;; PgBouncer in front of Neon Postgres (transaction pooling).
;;
;; The app detects the pooler (TF_PGBOUNCER=1, a :6439 URL, or
;; TF_PGBOUNCER_URL) and switches SQLAlchemy to NullPool so pooling happens
;; here, once, instead of once per worker. Point the app at this pooler with:
;;
;;   TF_PGBOUNCER_URL=postgresql://<user>:<pass>@127.0.0.1:6439/testforge
;;
;; For Neon specifically you can skip self-hosting and use Neon's own pooled
;; endpoint (it ends in `-pooler....neon.tech`); the app treats it the same
;; way as long as TF_PGBOUNCER=1 is set.
[databases]
; One entry per database. `host` is the Neon hostname from DATABASE_URL.
testforge = host=ep-example.eu-central-1.aws.neon.tech port=5432 dbname=neondb user=neondb password=CHANGE_ME sslmode=require

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6439
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a server connection is returned to the pool after every
; transaction, which is what lets hundreds of app workers share Neon's small
; connection limit. The app keeps transactions short and holds no session
; state (no prepared statements, no LISTEN/NOTIFY, no advisory locks, no
; SET ... that must survive the transaction), which is exactly what this mode
; requires.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Kill idle server connections so Neon can scale to zero / stay within limits.
server_idle_timeout = 30
server_lifetime = 3600
server_reset_query = DISCARD ALL

; Timeouts: fail fast rather than queue forever behind a saturated pooler.
query_timeout = 30
query_wait_timeout = 10
client_idle_timeout = 300
client_login_timeout = 10

; Keep the pooler observable.
stats_period = 60
log_connections = 0
log_disconnections = 0

admin_users = pgbouncer_admin
