name: ci

# Two jobs on purpose. `unit` answers "is this branch broken?" in a couple of
# minutes without a browser; `harness` runs the whole catalog, including the
# library scenarios that drive a real server and a real Chromium. A missing
# browser must fail the build here (--require-browser), because a skipped
# scenario is not a passed one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit suite (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -t .
      # Zero-LLM gate for the market comparison: fails when a TestForge claim
      # loses the evidence it is published with, so a stale capability matrix
      # cannot reach main.
      - run: python -m tools.market_audit

  harness:
    name: Full harness (with Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        # The harness records the commit it tested with `git rev-parse`.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      # No GitHub publishing credentials are set here on purpose: tests must never
      # be able to push to a repository. The harness also strips them from the
      # server environment it starts and sets TF_LIBRARY_PUBLISH=0.
      - run: python -m tests.harness --require-browser
      # TEMPORARY DEBUG (remove before merge): the sandbox running this agent
      # cannot download CI logs or artifacts (egress allowlist), so the harness
      # summary is posted to the PR where it can be read back over the API.
      - name: Post harness summary to the PR (temporary debug)
        if: always()
        run: |
          REPORT=$(ls -t logs/*/results.md 2>/dev/null | head -n 1)
          SCEN=$(ls -t logs/*/scenarios.log 2>/dev/null | head -n 1)
          HARN=$(ls -t logs/*/harness.log 2>/dev/null | head -n 1)
          {
            echo "## Harness debug report (temporary, will be removed)"
            echo "### results.md"
            echo '```'
            cat "$REPORT" 2>/dev/null || echo "(no results.md)"
            echo '```'
            echo "### scenario FAIL/SKIP lines"
            echo '```'
            grep -E "FAIL|SKIP|aborted" "$SCEN" 2>/dev/null | head -n 30 || echo "(no scenarios.log)"
            echo '```'
            echo "### harness.log tail"
            echo '```'
            tail -n 15 "$HARN" 2>/dev/null || echo "(no harness.log)"
            echo '```'
          } > /tmp/harness-report.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/harness-report.md
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-logs
          path: logs/
          retention-days: 14

  multi-browser:
    name: Smoke plan on chromium, firefox and webkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      # All three engines, with system dependencies, on the runner: the smoke
      # below launches each one for real. TF_REQUIRE_ENGINES=1 turns a missing
      # engine into a failure instead of a skip, so this job can never pass on
      # Chromium alone.
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: TF_TEST_BROWSER=1 TF_REQUIRE_ENGINES=1 python -m unittest tests.test_multi_browser -v
