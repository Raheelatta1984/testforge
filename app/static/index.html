<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; width: 100vw; }
  /* Labels stay visible on phones too; the named tab strip scrolls horizontally
     instead of compressing 13 tabs into icons that new users have to guess. */
  #main-tabs { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: #6366f1 #0f172a; }
  #main-tabs::-webkit-scrollbar { height: 8px; }
  #main-tabs::-webkit-scrollbar-track { background: #0f172a; }
  #main-tabs::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 999px; }
  /* Scroll bars that are always visible, both directions, on every tab. A wide
     table or a long form can be reached by dragging the bar or the wheel. */
  .content-area, .content-area * { scrollbar-width: auto; scrollbar-color: #6366f1 #0b1222; }
  .content-area { overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .content-area::-webkit-scrollbar, .content-area *::-webkit-scrollbar { width: 12px; height: 12px; }
  .content-area::-webkit-scrollbar-track, .content-area *::-webkit-scrollbar-track { background: #0b1222; border-radius: 999px; }
  .content-area::-webkit-scrollbar-thumb, .content-area *::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 999px; border: 2px solid #0b1222; }
  .content-area::-webkit-scrollbar-thumb:hover, .content-area *::-webkit-scrollbar-thumb:hover { background: #818cf8; }
  .content-area::-webkit-scrollbar-corner, .content-area *::-webkit-scrollbar-corner { background: #0b1222; }
  /* Wide tables and code blocks get their own horizontal bar. */
  .overflow-x-auto, .overflow-auto, .overflow-y-auto, pre { scrollbar-width: auto; scrollbar-color: #6366f1 #0b1222; }
  .overflow-x-auto::-webkit-scrollbar, .overflow-auto::-webkit-scrollbar, .overflow-y-auto::-webkit-scrollbar, pre::-webkit-scrollbar { width: 10px; height: 10px; }
  .overflow-x-auto::-webkit-scrollbar-track, .overflow-auto::-webkit-scrollbar-track, .overflow-y-auto::-webkit-scrollbar-track, pre::-webkit-scrollbar-track { background: #0b1222; border-radius: 999px; }
  .overflow-x-auto::-webkit-scrollbar-thumb, .overflow-auto::-webkit-scrollbar-thumb, .overflow-y-auto::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 999px; }
  .nav-btn { flex: 0 0 auto; min-width: 66px; padding: 7px 7px 8px; font-size: 10px; font-weight: bold; color: #64748b; border-top: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; white-space: nowrap; }
  .nav-btn-icon { font-size: 16px; line-height: 18px; }
  .nav-btn-label { font-size: 9px; line-height: 11px; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .content-area { height: calc(100vh - 75px); overflow-y: auto; overflow-x: auto; padding: 15px; padding-bottom: 90px; }
  .canvas-window { background: #000; border: 2px solid #1e293b; border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; }
  .progress-bar { height: 100%; background: #6366f1; transition: width 0.4s ease; box-shadow: 0 0 15px #6366f1; }
  .key-btn { background: #1e293b; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #334155; }
  .browser-shell { background: #020617; border: 2px solid #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 240px; }
  .browser-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #0f172a; border-bottom: 1px solid #1e293b; }
  .browser-url { flex: 1; font-size: 11px; color: #cbd5e1; background: #020617; border-radius: 999px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  .dot.red { background: #ef4444; } .dot.yellow { background: #eab308; } .dot.green { background: #22c55e; }
  .browser-viewport { position: relative; background: #000; min-height: 200px; }
  .browser-viewport img { width: 100%; height: auto; display: block; cursor: crosshair; user-select: none; -webkit-user-drag: none; }
  .browser-wait { min-height: 180px; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 24px; font-size: 13px; background: #000; }
  .fast-badge { background: linear-gradient(90deg, #22c55e, #16a34a); color: white; font-size: 8px; padding: 2px 6px; border-radius: 999px; font-weight: bold; }
  .var-chip { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; padding: 2px 8px; border-radius: 999px; font-size: 10px; cursor: pointer; }
  .var-chip:hover { background: #312e81; }

  /* --- Guide tags ---------------------------------------------------------
     Opt-in annotation layer: a hand-drawn yellow sticky note plus a marker
     arrow that points at the section it explains. Guide mode is off by
     default and remembered per browser, so real users never see it unless
     they switch it on for a demo, a screenshot or a walkthrough. */
  .guide-note {
    position: relative;
    background: linear-gradient(170deg, #fff27a 0%, #ffd93b 55%, #f7c331 100%);
    color: #241c02;
    border: 2px solid #1c1704;
    border-radius: 3px 10px 3px 9px / 9px 3px 10px 3px;
    box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.3);
    padding: 8px 28px 9px 10px;
    font-size: 11px;
    line-height: 1.45;
    transform: rotate(-1.1deg);
  }
  .guide-note.alt { transform: rotate(1deg); }
  .guide-note::after { /* the bit of tape holding the note up */
    content: ""; position: absolute; top: -9px; left: 18px; width: 46px; height: 15px;
    background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(28, 23, 4, 0.25);
    transform: rotate(-4deg);
  }
  .guide-ribbon {
    display: inline-block; background: #1c1704; color: #ffd93b;
    font-size: 8px; font-weight: 800; letter-spacing: 0.08em;
    padding: 1px 6px; border-radius: 3px; margin-bottom: 4px;
  }
  .guide-label { font-weight: 800; font-size: 12px; letter-spacing: -0.01em; }
  .guide-text { color: #43350a; }
  .guide-text b { color: #1c1704; }
  .guide-arrow { display: block; margin: -3px 0 -6px 14px; }
  .guide-dismiss {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
    background: rgba(28, 23, 4, 0.12); border: 1px solid rgba(28, 23, 4, 0.35);
    border-radius: 999px; color: #241c02; font-size: 11px; line-height: 1;
    font-weight: 700; cursor: pointer;
  }
  .guide-dismiss:hover { background: rgba(28, 23, 4, 0.28); }
  /* Guide mode also outlines what a note is talking about. */
  .guide-highlight { outline: 2px dashed rgba(255, 217, 59, 0.6); outline-offset: 3px; border-radius: 16px; }
</style>

<body>
<div id="root"></div>
<script src="/import-components.js"></script>
<script src="/scenario-components.js"></script>
<script src="/demo-components.js"></script>
<script src="/future-components.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;
async function apiRequest(url, options = {}) {
  const response = await fetch(url, options);
  let payload = null;
  const text = await response.text();
  try { payload = JSON.parse(text); } catch (_) { payload = text; }
  if (!response.ok) {
    const detail = payload && (payload.detail || payload.message || payload);
    throw new Error(typeof detail === 'string' ? detail : `Request failed (${response.status})`);
  }
  return payload;
}
const API = {
  get: u => apiRequest(u),
  post: (u, b) => apiRequest(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  put: (u, b) => apiRequest(u, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  patch: (u, b) => apiRequest(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  del: (u, b) => apiRequest(u, {method:'DELETE', headers:{'Content-Type':'application/json'}, body: b ? JSON.stringify(b) : undefined})
};

/* --- Error boundary ---------------------------------------------------------
   The last line of defence for the whole UI. Without it, a throw anywhere in
   the tree makes React unmount everything below the root, and the operator is
   left staring at a blank screen with no tabs and no clue what happened - the
   backend is still perfectly healthy and serving every API call. This keeps
   such a failure visible, names the error, and offers a way back. */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    try { console.error("TestForge UI failed to render:", error, info && info.componentStack); } catch (_) {}
  }
  render() {
    if (!this.state.error) return this.props.children;
    const message = String((this.state.error && this.state.error.message) || this.state.error);
    return e('div', { className: "max-w-md mx-auto p-6 space-y-4" },
      e('h1', { className: "text-lg font-bold text-red-300" }, "⚡ TestForge could not render this screen"),
      e('p', { className: "text-xs text-slate-400" },
        "The server and your data are fine - this is a problem in the interface only. ",
        "The message below is what the interface reported, and it is also in the browser console."),
      e('pre', { role: "alert",
        className: "text-[11px] bg-slate-900 border border-red-900/50 text-red-200 rounded-xl p-3 overflow-x-auto whitespace-pre-wrap" },
        message),
      e('div', { className: "flex gap-2" },
        e('button', { type: "button", className: "key-btn", onClick: () => this.setState({ error: null }) }, "TRY AGAIN"),
        e('button', { type: "button", className: "key-btn", onClick: () => location.reload() }, "RELOAD PAGE")),
      e('p', { className: "text-[10px] text-slate-500" },
        "If this keeps happening, note the message above and reload. Reaching the API directly at /api/health still works."));
  }
}

/* --- Guide tags -------------------------------------------------------------
   An opt-in annotation layer, built for demos, screenshots and walkthroughs.
   A GuideTag renders a hand-drawn yellow note plus a marker arrow that points
   at the section sitting directly beneath it, and outline()s that section so
   the eye lands on the right card. The notes never block the UI underneath:
   guide mode is off by default, remembered per browser, every note can be
   dismissed on its own, and the arrow itself takes no clicks. */
const GUIDE_KEY = "tf_guide_mode";
const GUIDE_HIDDEN_KEY = "tf_guide_hidden";
const guideListeners = new Set();
// Read straight from the store so the very first paint already knows whether
// guide mode is on - a flash of forty yellow notes would be worse than none.
const readGuideMode = () => {
  try { return localStorage.getItem(GUIDE_KEY) === "1"; } catch (_) { return false; }
};
/* useSyncExternalStore compares snapshots with Object.is and re-renders whenever
   they differ, so getSnapshot MUST hand back the very same object until the
   underlying data really changes. Building a fresh Set on every call made React
   see an endless stream of "changes": it re-rendered, re-read the store, saw a
   new Set again, and spun until it bailed out with "Maximum update depth
   exceeded". Because nothing wrapped the tree in an error boundary, that throw
   unmounted the whole app - a blank screen with no tabs at all. The Set is now
   cached against the raw localStorage string, so it is only rebuilt when the
   stored value actually changes. */
let hiddenTagsRaw = Symbol("unread");
let hiddenTagsCache = new Set();
const readHiddenTags = () => {
  let raw;
  try { raw = localStorage.getItem(GUIDE_HIDDEN_KEY); } catch (_) { raw = null; }
  if (raw === hiddenTagsRaw) return hiddenTagsCache;
  let next;
  try {
    const parsed = JSON.parse(raw || "[]");
    next = Array.isArray(parsed) ? new Set(parsed.filter(id => typeof id === "string")) : new Set();
  } catch (_) { next = new Set(); }
  hiddenTagsRaw = raw;
  hiddenTagsCache = next;
  return next;
};
const setGuideMode = (next) => {
  try { localStorage.setItem(GUIDE_KEY, next ? "1" : "0"); } catch (_) { /* private mode */ }
  guideListeners.forEach(fn => fn());
};
const hideGuideTag = (id) => {
  // Copy first: readHiddenTags() now returns a cached snapshot that React is
  // holding on to, and mutating it in place would both corrupt that snapshot
  // and hide the change from the Object.is comparison below.
  const hidden = new Set(readHiddenTags());
  hidden.add(id);
  try { localStorage.setItem(GUIDE_HIDDEN_KEY, JSON.stringify([...hidden])); } catch (_) {}
  guideListeners.forEach(fn => fn());
};
const revealGuideTags = () => {
  try { localStorage.removeItem(GUIDE_HIDDEN_KEY); } catch (_) {}
  guideListeners.forEach(fn => fn());
};
const subscribeGuide = (fn) => { guideListeners.add(fn); return () => guideListeners.delete(fn); };

// Marker arrow drawn in one stroke, so it reads as annotation rather than chrome.
function GuideArrow() {
  return e('svg', { className: "guide-arrow", width: "46", height: "26", viewBox: "0 0 46 26",
    'aria-hidden': "true", focusable: "false", style: { pointerEvents: "none", overflow: "visible" } },
    e('path', { d: "M6 1 C 12 8, 10 15, 16 20", fill: "none", stroke: "#facc15", strokeWidth: "3.4", strokeLinecap: "round" }),
    e('path', { d: "M6.5 2 C 12.5 8.5, 10.5 15, 16.2 19.6", fill: "none", stroke: "#facc15", strokeWidth: "2.2", strokeLinecap: "round" }),
    e('path', { d: "M8.4 14.6 L16.6 20.6 L17.8 11.4 Z", fill: "#facc15" }));
}

function GuideTag({ id, label, children, action }) {
  const on = React.useSyncExternalStore(subscribeGuide, readGuideMode, readGuideMode);
  const hidden = React.useSyncExternalStore(subscribeGuide, readHiddenTags, readHiddenTags);
  if (!on || !id || hidden.has(id)) return null;
  return e('div', { className: "guide-note", role: "note", 'aria-label': `Guide: ${label}` },
    e('span', { className: "guide-ribbon" }, "GUIDE"),
    e('div', { className: "guide-label" }, label),
    e('div', { className: "guide-text" }, children),
    action && e('div', { className: "guide-text" }, e('b', {}, "Do this: "), action),
    e('button', { type: "button", className: "guide-dismiss", onClick: () => hideGuideTag(id),
      title: "Hide this note", 'aria-label': `Hide the guide note for ${label}` }, "×"),
    e(GuideArrow, null));
}

// A note plus the section it explains. The note is a sibling of that section
// so the arrow has something to point at, and the outline is applied to the
// wrapped element itself rather than to whatever happens to follow. With guide
// mode off there is no wrapper at all, so the ordinary UI keeps its exact DOM.
function GuideSection({ id, label, action, children }) {
  const on = React.useSyncExternalStore(subscribeGuide, readGuideMode, readGuideMode);
  if (!on) return children;
  // Only the first section that is actually rendered gets the outline, and no
  // wrapper is ever inserted around the sections themselves, so a hidden
  // sibling cannot change the layout of the ones beside it.
  const items = React.Children.toArray(children).filter(Boolean);
  const highlighted = items.map((item, i) => (i === 0 && React.isValidElement(item))
    ? React.cloneElement(item, {
        className: (item.props.className ? item.props.className + " " : "") + "guide-highlight" })
    : item);
  return e('div', { className: "space-y-4" }, e(GuideTag, { id, label, action }), highlighted);
}

// Switches every note in the app on or off. Living in the header keeps it
// reachable from all thirteen tabs, including ones that render no content yet.
function GuideToggle() {
  const on = React.useSyncExternalStore(subscribeGuide, readGuideMode, readGuideMode);
  const hidden = React.useSyncExternalStore(subscribeGuide, readHiddenTags, readHiddenTags);
  return e('div', { className: "flex items-center gap-1" },
    e('button', { type: "button", className: "key-btn", onClick: () => setGuideMode(!on),
      'aria-pressed': on, title: "Show or hide the yellow guide notes on every section",
      style: on ? { borderColor: "#facc15", color: "#facc15" } : undefined },
      on ? "💡 GUIDE ON" : "💡 GUIDE"),
    on && hidden.size > 0 && e('button', { type: "button", className: "key-btn", onClick: revealGuideTags,
      title: `${hidden.size} note(s) dismissed — bring them all back` }, "↺ SHOW ALL"));
}

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) { window.alert("Speech input is not supported in this browser. Please type instead."); return; }
    const rec = new Recognition();
    rec.onerror = () => { setMic(false); window.alert("Speech input failed. Check microphone permission or type instead."); };
    rec.onstart = () => setMic(true); rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20 border border-slate-700", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: async () => { const res = await API.post("/api/ai/rephrase", { text: value }); onChange({ target: { value: res.rephrased } }); }, className: "p-1 rounded bg-purple-900" }, "✨")
    )
  );
}

function App({ access }) {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);
  // Live browser window for execution. Off means the replay runs without the
  // screencast, which is the cheapest way to run a suite.
  const [liveWindow, setLiveWindow] = useState(() => localStorage.getItem("tf_live_window") === "1");
  const toggleLiveWindow = (next) => {
    setLiveWindow(next);
    localStorage.setItem("tf_live_window", next ? "1" : "0");
  };
  const tabs = [
    ["demo", "🧪", "Demo"], ["projects", "📁", "Projects"],
    ["variables", "🔤", "Variables"], ["record", "⏺", "AI Recording"],
    ["plan", "🧭", "Test Plan"], ["library", "📚", "Test Library"],
    ["runs", "▶", "Runs"], ["comparison", "⚖️", "Compare"],
    ["artifacts", "🎥", "Artifacts"], ["logs", "📜", "Logs"],
    ["github", "🐙", "GitHub"], ["azure", "☁️", "Azure"],
    ["future", "🗺️", "Future release planning"]
  ];

  return e('div', { className: "h-full flex flex-col" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between bg-slate-950/80 backdrop-blur" },
      e('div', { className: "flex items-center gap-2" },
        e('span', { className: "font-bold text-indigo-400 tracking-tighter" }, "⚡ TESTFORGE TESTING TOOL"),
        e('span', { className: "fast-badge" }, "FAST ⚡")
      ),
      e(GuideToggle, null),
      access && !access.configured && e('span', {className:"text-[9px] text-amber-300", title:"Set TF_ACCESS_TOKEN before exposing this instance"}, "ACCESS TOKEN NOT CONFIGURED"),
      access && access.configured && e('button', {className:"key-btn", onClick:async()=>{await API.post('/api/auth/logout',{});location.reload();}}, "SIGN OUT"),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('div', { className: "content-area" },
      tab === "demo" && e(DemoTab, { project: activeProject, setActiveProject, setTab, liveWindow,
        onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "projects" && e(Projects, { setActiveProject, activeProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject, liveWindow,
        onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "plan" && e(ExecutionPlan, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "library" && e(Library, { project: activeProject, liveWindow, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId, liveWindow, setLiveWindow: toggleLiveWindow }),
      tab === "comparison" && e(Comparison), tab === "artifacts" && e(Artifacts),
      tab === "logs" && e(Logs), tab === "github" && e(Github),
      tab === "azure" && e(Azure),
      tab === "future" && e(FuturePlanningTab)
    ),
    e('nav', { id: "main-tabs", 'aria-label': "Main navigation tabs",
      title: "Swipe horizontally to see all named tabs",
      className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex" },
      tabs.map(([k, icon, label]) => e('button', { key: k, onClick: () => setTab(k), title: label,
        'aria-label': label, 'aria-current': tab === k ? 'page' : undefined,
        className: `nav-btn ${tab===k?'active':''}` },
        e('span', { className: "nav-btn-icon", 'aria-hidden': true }, icon),
        e('span', { className: "nav-btn-label" }, label)))
    )
  );
}

function Recorder({ project, onRun, liveWindow }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [status, setStatus] = useState("");
  const [error, setError] = useState("");
  const [saveNote, setSaveNote] = useState("");
  const [saveState, setSaveState] = useState("");
  const [steps, setSteps] = useState([]);
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const [text, setText] = useState("");
  const learningSites = window.TESTFORGE_LEARNING_SITES || [];
  const selectedLearningSite = learningSites.find(site => site.url === url);

  useEffect(() => {
    // Demo → Record passes a selected public learning URL through a one-shot handoff.
    try {
      const pendingUrl = localStorage.getItem("tf_pending_recorder_url");
      if (pendingUrl) {
        setUrl(pendingUrl);
        localStorage.removeItem("tf_pending_recorder_url");
      }
    } catch (_) {}
  }, []);
  const [busy, setBusy] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [armed, setArmed] = useState(null);
  const [variableName, setVariableName] = useState("");
  const [varsList, setVarsList] = useState([]);
  const [publishInfo, setPublishInfo] = useState(null);
  const [varReview, setVarReview] = useState(null);
  const [varNote, setVarNote] = useState("");
  const [varBusy, setVarBusy] = useState(false);
  // Every recording already in the library, so the tab can show a tree of what
  // exists and reuse (resume / run) instead of someone re-recording it.
  const [libraryRecs, setLibraryRecs] = useState([]);
  const [libraryNote, setLibraryNote] = useState("");
  const [resumeBusy, setResumeBusy] = useState("");
  const recRef = useRef(null);
  const frameUrl = useRef(null);
  const initialStepsLoaded = useRef(false);
  // Big-screen recorder: FIT shows the whole page; a zoom level scrolls it.
  const [fit, setFit] = useState(true);
  // Type directly: keystrokes typed while the picture is focused go to the remote page.
  const [typeDirect, setTypeDirect] = useState(false);
  const typeInput = useRef(null);
  const typeBuffer = useRef("");
  const typeTimer = useRef(null);
  const typeChain = useRef(Promise.resolve());
  // True from the moment START is pressed until the recording exists, so the
  // tab answers at once instead of sitting on the form.
  const [starting, setStarting] = useState(false);

function Runs({ runId, setRunId, liveWindow, setLiveWindow }) {
  /* Queue hygiene and batch execution live here: both are about what runs next. */
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);
  const [runStatus, setRunStatus] = useState("");
  const [runError, setRunError] = useState("");
  const [queueInfo, setQueueInfo] = useState(null);
  const [windowOff, setWindowOff] = useState(false);
  const windowOffRef = useRef(false);
  const frameUrl = useRef(null);

  const load = () => API.get("/api/runs").then(setRuns).catch(() => {});
  const loadQueue = () => API.get("/api/runs/queue/status").then(setQueueInfo).catch(() => {});
  useEffect(() => {
    load(); loadQueue();
    // A background tab must not keep polling: the service is small and every
    // poll is a database read plus a serialisation.
    const t = setInterval(() => { if (!document.hidden) { load(); loadQueue(); } }, 3000);
    const onVisible = () => { if (!document.hidden) { load(); loadQueue(); } };
    document.addEventListener("visibilitychange", onVisible);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", onVisible); };
  }, []);

  useEffect(() => {
    if (!runId) return undefined;
    setActiveLog([]); setPercent(0); setRunStatus("queued"); setRunError(""); setFrame(null);
    setWindowOff(false); windowOffRef.current = false;
    let stop = false;
    let finished = false;
    const ws = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws/runs/" + runId);
    ws.onmessage = (ev) => {
      const message = JSON.parse(ev.data);
      // The server states the window mode on the first status event of the run.
      if (message.display_window === false) { setWindowOff(true); windowOffRef.current = true; }
      if (message.type === "frame" && message.data) setFrame("data:image/jpeg;base64," + message.data);
      if (message.percent !== undefined) setPercent(message.percent);
      if (message.type === "done") {
        setRunStatus(message.status || "done");
        if (message.error) setRunError(message.error);
        if (message.status === "passed") setPercent(100);
        if (message.log) setActiveLog(message.log);
        finished = true;
        load(); loadQueue();
      } else if (message.status && (message.order !== undefined || message.type === "status")) {
        if (message.type === "status") {
          setRunStatus(message.status);
          setPercent(message.percent || 0);
        } else {
          setActiveLog(prev => prev.filter(item => item.order !== message.order).concat([message]));
        }
      }
    };
    const poll = async () => {
      if (stop || finished) return;
      if (document.hidden) { setTimeout(poll, 1000); return; }
      try {
        const run = await API.get("/api/runs/" + runId);
        if (run.progress_pct != null) setPercent(run.progress_pct);
        if (Array.isArray(run.log) && run.log.length) setActiveLog(run.log);
        if (run.status) setRunStatus(run.status);
        if (run.rog_monitor_log && run.status && run.status !== "running" && run.status !== "queued") setRunError(run.rog_monitor_log);
        if (run.display_window === false) { setWindowOff(true); windowOffRef.current = true; }
        if (["passed", "failed", "error", "cancelled"].includes(run.status)) { finished = true; load(); loadQueue(); return; }
        // No point polling for a picture the run was told not to produce.
        if (!windowOffRef.current) {
        const img = await fetch("/api/runs/" + runId + "/live.jpg?t=" + Date.now());
        if (img.ok && (img.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await img.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current && frameUrl.current.indexOf("blob:") === 0) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
        }
        }
      } catch (_) {}
      if (!stop) setTimeout(poll, 500); // Faster poll for immediate display
    };
    poll();
    return () => { stop = true; ws.close(); };
  }, [runId]);

  return e("div", { className: "space-y-4" },
    e(GuideSection, { id: "runs-queue", label: "Queue · what is running now",
      action: "Nothing to do — this shows how many runs are queued, running, passed and failed." },
    e("div", { className: "space-y-4" },
    queueInfo && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs" },
      e("div", { className: "flex justify-between" },
        e("span", { className: "font-bold text-indigo-300" }, `Queue: ${queueInfo.queued} queued, ${queueInfo.running} running ⚡`),
        e("span", { className: "fast-badge" }, "IMMEDIATE")
      ),
      e("p", { className: "text-[10px] text-slate-400 mt-1" }, `${queueInfo.passed} passed (${queueInfo.passed_pct}%) · ${queueInfo.failed} failed · ${queueInfo.pending} pending` )
    ),
    queueInfo && e(QueueHygiene, { queueInfo: queueInfo, refresh: () => { load(); loadQueue(); } }))),
    e(GuideSection, { id: "runs-batch", label: "Sequential batch execution",
      action: "Tick the recordings you want, choose session/screenshot options, then RUN BATCH — one browser for all of them." },
    e(BatchPanel, { onOpenRun: setRunId, liveWindow: liveWindow })),
    e(GuideSection, { id: "runs-live", label: "Live browser window switch",
      action: "Switch it on to watch the browser during a run; leave it off for the cheapest headless replay." },
    e("div", { className: "space-y-4" },
    e("div", { className: "bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-3" },
      e("div", {},
        e("div", { className: "text-xs font-bold text-indigo-300" }, "Live browser window"),
        e("p", { className: "text-[10px] text-slate-400 mt-0.5" },

            : "Off: runs headless with no screencast. Replay is unchanged, CPU is lower.")
      ),
      e("button", {
        type: "button",
        role: "switch",
        "aria-checked": !!liveWindow,
        "aria-label": "Display live browser window during execution",
        onClick: () => setLiveWindow(!liveWindow),
        className: "shrink-0 w-14 h-7 rounded-full relative transition-colors " + (liveWindow ? "bg-emerald-500" : "bg-slate-700")
      },
        e("span", { className: "absolute top-1 w-5 h-5 bg-white rounded-full transition-all " + (liveWindow ? "left-8" : "left-1") })
      )
    ),
    runId && e("div", { className: "bg-slate-900 border-2 border-indigo-500 rounded-3xl p-5 shadow-2xl" },
      e("div", { className: "flex justify-between font-bold text-xs" },
        e("span", {}, "EXECUTION ⚡ IMMEDIATE"),
        e("span", {}, (runStatus || "running") + " · " + percent + "%")
      ),
      e("div", { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-2" },
        e("div", { className: "progress-bar", style: { width: percent + "%" } })

                )
          ),
      e("div", { className: "max-h-40 overflow-y-auto mt-3 space-y-1" },
        activeLog.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((step, i) => e("div", { key: step.order || i, className: "text-[10px] p-2 bg-slate-950 rounded border border-slate-900" },

function QueueHygiene({ queueInfo, refresh }) {
  const [busy, setBusy] = useState("");
  const [note, setNote] = useState("");
  const hygiene = (queueInfo && queueInfo.hygiene) || {};
  const policy = hygiene.policy || {};
  const act = async (body, label) => {
    setBusy(label); setNote("");
    try {
      const res = await API.post("/api/runs/queue/clear", body);
      const kinds = Object.entries(res.by_kind || {}).map(([k, v]) => `${v} ${k}`).join(", ");
      setNote((res.message || "Done.") + (kinds ? ` (${kinds})` : "") + (res.purge ? ` Purged ${res.purge.purged || res.purge.would_purge || 0} finished run(s).` : ""));
      refresh();
    } catch (err) { setNote(err.message); }
    finally { setBusy(""); }
  };
  const clearable = hygiene.clearable || 0;
  return e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-2" },
    e("div", { className: "flex justify-between items-center" },
      e("span", { className: "font-bold text-indigo-300" }, "Queue hygiene 🧹"),
      clearable > 0
        ? e("span", { className: "text-[10px] px-2 py-0.5 rounded-full bg-amber-900 text-amber-200 font-bold" }, `${clearable} TO CLEAR`)
        : e("span", { className: "text-[10px] px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-200 font-bold" }, "CLEAN")
    ),
    e("div", { className: "grid grid-cols-2 gap-1 text-[10px] text-slate-400" },
      e("span", {}, `Orphaned (no worker): ${hygiene.orphans || 0}`),
      e("span", {}, `Stale (queued > ${policy.stale_minutes || 30}m): ${hygiene.stale || 0}`),
      e("span", {}, `Duplicates: ${hygiene.duplicates || 0}`),
      e("span", {}, `Oldest queued: ${Math.round(hygiene.oldest_queued_seconds || 0)}s`),
      e("span", {}, `Live workers: ${hygiene.live_workers || 0}`),
      e("span", {}, `Cancelled so far: ${(queueInfo && queueInfo.cancelled) || 0}`)
    ),
    e("p", { className: "text-[10px] text-slate-500" },
      "Orphans are runs left behind by a restart: no worker owns them, so they can never finish. They are reaped at boot and every " +
      Math.round((policy.sweep_seconds || 300) / 60) + " minutes; clear them here to do it now."),
    e("div", { className: "flex flex-wrap gap-2" },
      e("button", { type: "button", disabled: !!busy, onClick: () => act({ dry_run: true }, "dry"),
        className: "key-btn disabled:opacity-50" }, busy === "dry" ? "…" : "PREVIEW WHAT WOULD CLEAR"),
      e("button", { type: "button", disabled: !!busy || clearable === 0,
        onClick: () => act({ include_orphans: true, include_stale: true }, "clear"),
        className: "key-btn bg-amber-700 border-amber-500 disabled:opacity-40" }, busy === "clear" ? "CLEARING…" : "CLEAR ORPHANS + STALE"),
      e("button", { type: "button", disabled: !!busy,
        onClick: () => act({ include_orphans: true, include_stale: true, include_duplicates: true }, "dupes"),
        className: "key-btn disabled:opacity-50" }, busy === "dupes" ? "CLEARING…" : "+ DUPLICATES"),
      e("button", { type: "button", disabled: !!busy,
        onClick: () => act({ include_orphans: true, include_stale: true, include_duplicates: true, purge_finished_days: policy.retention_days || 14 }, "purge"),
        className: "key-btn bg-red-900 border-red-700 disabled:opacity-50" }, busy === "purge" ? "PURGING…" : "PURGE OLD HISTORY")
    ),
    note && e("p", { role: "status", className: "text-[10px] text-emerald-300" }, note)
  );
}

  /* The whole library, not just the selected project. Recordings captured with
     START AI RECORDING and scripts saved from UPLOAD TEST SCRIPTS land in

    const start = Date.now();
    return API.get("/api/library/recordings").then(rows => {
      setRecs(Array.isArray(rows) ? rows : []);

  };
  useEffect(() => { load(); }, [project && project.id]);

  const openEditor = async (id) => {
    try { setDetail(await API.get("/api/recordings/" + id)); setEditing(id); setDraft(null); setError(""); }
    catch (err) { setError(err.message); }
  };
  const saveStep = async (step, changes) => {
    try {
      const result = await API.patch(`/api/recordings/${editing}/steps/${step.id}`, changes);
      await openEditor(editing);
      if (!result.published) {
        // "retry pending" is only true when a retry was actually scheduled.
        setError(result.publish_message || (result.retry_scheduled
          ? "Step saved locally; the GitHub push is pending and will be retried."
          : "Step saved locally. GitHub publishing is disabled in this deployment."));
      }
    } catch (err) { setError(err.message); }
  };
  const run = async (recording, variables = {}) => {
    setRunning(recording.id); setError("");
    try {
      const res = await API.post("/api/runs", { target_id: recording.id, display_window: liveWindow !== false, variables });

  const needle = query.trim().toLowerCase();

  const visible = recs.filter(r => {
    if (projectFilter !== "all" && r.project_id !== projectFilter) return false;
    if (unverifiedOnly && !r.unverified) return false;
    if (tagNeedle && !(r.tags || "").toLowerCase().split(/[\s,]+/).includes(tagNeedle)) return false;
    if (needle && ![r.name, r.tags, r.project_name, r.start_url, r.id].some(v =>

      onRun: run}))),
    e(GuideSection, { id: "lib-search", label: "Library · search and filter",
      action: "Find a recording by name, tag, URL or project before running or editing it." },
    e("div", { className: "space-y-2 bg-slate-900 border border-slate-800 rounded-2xl p-3" },
      e("div", { className: "flex justify-between items-center gap-2 flex-wrap" },
        e("p", { className: "text-xs font-bold text-indigo-300" },
          `📚 Library · ${recs.length} recording(s) across ${projectCount} project(s)` +
          (visible.length === recs.length ? "" : ` · ${visible.length} shown`)),
        loadTime && e("span", { className: "fast-badge" }, loadTime)),
      e("p", { className: "text-[10px] text-slate-500" },
        "Everything saved to library/ — AI recordings from the ⏺ Record tab and scripts published from UPLOAD TEST SCRIPTS. Repository library · sequential execution · one low-quality JPEG per step."),
      e("div", { className: "flex flex-wrap gap-2" },
        e("input", { value: query, onChange: ev => setQuery(ev.target.value), placeholder: "Search name, tag, URL or id",
          "aria-label": "Search the library", className: "flex-1 min-w-[12rem] bg-slate-800 p-2 rounded text-xs" }),
        e("input", { value: tagFilter, onChange: ev => setTagFilter(ev.target.value), placeholder: "Filter by tag",
          "aria-label": "Filter recordings by tag", className: "w-40 bg-slate-800 p-2 rounded text-xs" }),
        e("select", { value: projectFilter, onChange: ev => setProjectFilter(ev.target.value),
          "aria-label": "Filter by project", className: "bg-slate-800 p-2 rounded text-xs" },
          e("option", { value: "all" }, "All projects"),
          [...new Map(recs.map(r => [r.project_id, r.project_name || r.project_id])).entries()]
            .sort((a, b) => String(a[1]).localeCompare(String(b[1])))
            .map(([id, name]) => e("option", { key: id, value: id }, name))),
        e("label", { className: "text-[10px] text-slate-400 flex items-center gap-1" },

        e("button", { type: "button", className: "key-btn", onClick: load }, "REFRESH")),
      error && e("p", { role: "alert", className: "text-sm text-red-300" }, error))),

    e("div", { className: "space-y-2" },
    recs.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-8" },
      "No recordings in the library yet. Use the ⏺ Record tab to capture a session, or UPLOAD TEST SCRIPTS above to publish a tested script. Saves push to the active branch immediately."),
    recs.length > 0 && visible.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-8" },

    groups.map(group => e("div", { key: group.id, className: "space-y-2" },

        e("span", { className: "text-xs font-bold " + (group.active ? "text-indigo-300" : "text-slate-300") },

        e("span", { className: "text-[10px] text-slate-500" }, `${group.rows.length} recording(s)`)),
      !collapsed[group.id] && orderedRecordingTree(group.rows).map(card))))),

      e(ActionComposer, {onSave: async step => { const res = await API.post(`/api/recordings/${editing}/steps`, step); await openEditor(editing); if (res.publish_message) setError(res.publish_message); }}),

function Projects({ setActiveProject, activeProject }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  const [baseUrl, setBaseUrl] = useState("");
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [varsMap, setVarsMap] = useState({});
  const [loadTime, setLoadTime] = useState("");
  // Entity/company: every project belongs to one. The registry is managed here,
  // before a project is created, and each project card can be moved between
  // entities afterwards -- including projects written before this existed.
  const [entities, setEntities] = useState([]);
  const [entityName, setEntityName] = useState("");
  const [entityCode, setEntityCode] = useState("");
  const [entityIndustry, setEntityIndustry] = useState("");
  const [entityNotes, setEntityNotes] = useState("");
  const [entityBusy, setEntityBusy] = useState(false);
  const [entityNotice, setEntityNotice] = useState("");
  const [entityError, setEntityError] = useState("");
  const [chosenEntity, setChosenEntity] = useState("");
  const [filterEntity, setFilterEntity] = useState("all");

  const load = async () => {
    setLoading(true);
    const start = Date.now();
    try {
      const result = await API.get("/api/projects?fast=true");
      setProjs(Array.isArray(result) ? result : []);
      setLoadTime(`${Date.now() - start}ms ⚡ FAST`);
      setError("");
      // Load variables for each project for display (requirement 2)
      const vMap = {};
      for (const p of result) {
        try {
          const vData = await API.get(`/api/projects/${p.id}/variables`);
          vMap[p.id] = vData.variables || [];
        } catch (_) { vMap[p.id] = []; }
      }
      setVarsMap(vMap);
    } catch (err) {
      setError(`Unable to load projects: ${err.message}`);
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => { load(); }, []);

  const loadEntities = async (selectId) => {
    try {
      const rows = await API.get("/api/entities");
      const list = Array.isArray(rows) ? rows : [];
      setEntities(list);
      setEntityError("");
      setChosenEntity(prev => {
        if (selectId && list.some(item => item.id === selectId)) return selectId;
        if (prev && list.some(item => item.id === prev)) return prev;
        const real = list.find(item => !item.system);
        return real ? real.id : "";
      });
    } catch (err) { setEntityError("Could not load companies/entities: " + err.message); }
  };
  useEffect(() => { loadEntities(); }, []);

  const createEntity = async (event) => {
    event.preventDefault();
    if (!entityName.trim()) { setEntityError("Enter the company/entity name first."); return; }
    setEntityBusy(true); setEntityError(""); setEntityNotice("");
    try {
      const created = await API.post("/api/entities", {
        name: entityName.trim(), code: entityCode.trim(), industry: entityIndustry.trim(), notes: entityNotes.trim(),
      });
      setEntityName(""); setEntityCode(""); setEntityIndustry(""); setEntityNotes("");
      setEntityNotice(created.publish_message || `Entity “${created.name}” saved.`);
      await loadEntities(created.id);
    } catch (err) { setEntityError("Could not create the entity: " + err.message); }
    finally { setEntityBusy(false); }
  };

  const renameEntity = async (entity) => {
    const next = window.prompt("New name for this company/entity", entity.name);
    if (next === null) return;
    if (!next.trim() || next.trim() === entity.name) return;
    setEntityBusy(true); setEntityError(""); setEntityNotice("");
    try {
      const saved = await API.patch("/api/entities/" + entity.id, { name: next.trim() });
      setEntityNotice(saved.publish_message || `Renamed to “${saved.name}”; its ${saved.project_count || 0} project(s) follow.`);
      await Promise.all([loadEntities(saved.id), load()]);
    } catch (err) { setEntityError("Could not rename the entity: " + err.message); }
    finally { setEntityBusy(false); }
  };

  const removeEntity = async (entity) => {
    const others = entities.filter(item => item.id !== entity.id);
    const target = entity.project_count > 0
      ? window.prompt(`“${entity.name}” still has ${entity.project_count} project(s).\n\nMove them to which entity? Type the id:\n` +
          others.map(item => `${item.id} — ${item.name}`).join("\n"), others.find(item => item.system) ? others.find(item => item.system).id : (others[0] || {}).id || "")
      : null;
    if (entity.project_count > 0 && (target === null || !target.trim())) return;
    if (entity.project_count === 0 && !window.confirm(`Delete the entity “${entity.name}”?`)) return;
    setEntityBusy(true); setEntityError(""); setEntityNotice("");
    try {
      const result = await API.del("/api/entities/" + entity.id, target ? { reassign_to: target.trim() } : {});
      setEntityNotice(`Removed “${result.name}”` +

const LOG_FILES = ["results.md", "harness.log", "unit.log", "scenarios.log", "server.log"];

function parseMarkdownTable(text) {
  const rows = [];
  let headers = null;
  for (const raw of (text || "").split("\n")) {
    const line = raw.trim();
    if (!line.startsWith("|")) continue;
    const cells = line.slice(1, -1).split("|").map(c => c.trim());
    if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
    if (!headers) { headers = cells; continue; }
    const row = {};
    headers.forEach((h, i) => { row[h] = cells[i] || ""; });
    rows.push(row);
  }
  return rows;
}

function Logs() {
  const [source, setSource] = useState(null);
  const [mode, setMode] = useState("");
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [loading, setLoading] = useState(true);
  const [open, setOpen] = useState(null);
  const [files, setFiles] = useState({});
  const [busy, setBusy] = useState("");

  // Read a path out of the repository. raw.githubusercontent.com first; some
  // networks block it, and the contents API serves the same bytes.
  const fromGithub = async (src, path) => {
    try {
      const raw = await fetch(`${src.base}/${path}`, { cache: "no-store" });
      if (raw.ok) return await raw.text();
    } catch (_) { /* fall through to the API */ }
    const api = await fetch(
      `https://api.github.com/repos/${src.slug}/contents/${path}?ref=${encodeURIComponent(src.branch)}`,
      { cache: "no-store", headers: { Accept: "application/vnd.github.raw+json" } }
    );
    if (!api.ok) throw new Error(`GitHub returned ${api.status} for ${path}`);
    return await api.text();
  };

  // Fallback for a deployment with no git checkout: read the reports this
  // instance wrote itself. The server caps every file, so this stays cheap.
  const loadLocal = async () => {
    const local = await API.get("/api/logs/local/index");
    if (!local.available) throw new Error(local.reason || "No harness logs are stored on this instance.");
    setMode("local");
    setRows((local.rows || []).map(row => ({ ...row, folder: row.folder || row.Folder })));
    return true;
  };

  useEffect(() => {
    let stop = false;
    (async () => {
      try {
        const src = await API.get("/api/logs/source");
        if (stop) return;
        setSource(src);
        if (src.available) {
          try {
            const text = await fromGithub(src, "logs/index.md");
            if (stop) return;
            const parsed = parseMarkdownTable(text);
            if (parsed.length) {
              setMode("github"); setRows(parsed); setError("");
            } else {
              throw new Error("The committed log index has no runs yet.");
            }
          } catch (githubError) {
            if (stop) return;
            // Coordinates exist but the branch has no committed logs (or the
            // network blocks GitHub): fall back to this instance instead of
            // showing an empty tab.
            try {
              await loadLocal();
              setNotice(`GitHub logs unavailable (${githubError.message}). Showing the reports stored on this instance.`);
            } catch (localError) {
              setMode("github"); setRows([]);
              setError(githubError.message);
            }
          }
        } else {
          try {
            await loadLocal();
            setNotice(src.reason || "No git checkout here, so committed logs are unavailable.");
          } catch (localError) {
            setMode("none");
            setError((src.reason || "Log location unknown") + " " + localError.message);
          }
        }
      } catch (err) {
        if (!stop) setError(err.message);
      } finally {
        if (!stop) setLoading(false);
      }
    })();
    return () => { stop = true; };
  }, []);

  const openRun = async (folder) => {
    if (open === folder) { setOpen(null); return; }
    setOpen(folder); setFiles({}); setBusy(folder);
    if (mode === "local") {
      try {
        const listing = await API.get("/api/logs/local/" + encodeURIComponent(folder));
        for (const name of listing.files || []) {
          API.get(`/api/logs/local/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`)
            .then(res => setFiles(prev => ({ ...prev, [name]: (res.truncated ? "… (tail) …\n" : "") + res.text })))
            .catch(() => {});
        }
      } catch (_) { /* a run may have no files */ }
      setBusy("");
      return;
    }
    for (const name of LOG_FILES) {
      fromGithub(source, `logs/${folder}/${name}`)
        .then(text => setFiles(prev => ({ ...prev, [name]: text })))
        .catch(() => {});   // a run may simply not have every file
    }
    setBusy("");
  };

  const folderOf = (row) => {
    if (row.folder) return row.folder;
    const match = /\(([^)]+)\/results\.md\)/.exec(row["Folder"] || "");
    return match ? match[1] : (row["Folder"] || "").replace(/[[\]]/g, "");
  };

  const badge = mode === "github" ? "FROM GITHUB" : mode === "local" ? "FROM THIS INSTANCE" : "NO LOGS";

      action: "The badge tells you the source: read from GitHub by your browser, or from this instance when there is no checkout." },
    e("div", { className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-2" },
      e("div", { className: "flex justify-between items-center" },
        e("h2", { className: "font-bold text-lg text-indigo-300" }, "Harness logs 📜"),
        e("span", { className: "fast-badge" }, badge)
      ),
      e("p", { className: "text-sm text-slate-400" },
        mode === "local"
          ? "Read from the reports stored on this instance, capped per file. This is the fallback used when the deployment has no git checkout to read the committed logs from."
          : "Read straight from the repository by your browser. This deployment never reads, stores or serves these files, so opening this tab puts no load on the service."),
      source && source.available && e("p", { className: "text-[10px] font-mono text-slate-500 break-all" },

      mode === "local" && source && source.local && e("p", { className: "text-[10px] font-mono text-slate-500 break-all" },
        `${source.local.logs_dir}`),
      source && !source.available && source.fixes && e("div", { className: "text-[10px] text-amber-300/80 space-y-0.5" },
        e("div", { className: "font-bold" }, "Make committed logs readable here:"),
        source.fixes.map(fix => e("div", { key: fix, className: "font-mono" }, "• " + fix)))
    )),
    e(GuideSection, { id: "logs-runs", label: "Committed harness runs",
      action: "Open a run to read its results.md, harness.log and unit.log exactly as they were committed." },
    e("div", { className: "space-y-4" },
    loading && e("p", { className: "text-sm text-slate-400" }, "Fetching log index…"),
    notice && e("p", { role: "status", className: "text-xs text-amber-300" }, notice),
    error && e("p", { role: "alert", className: "text-sm text-red-300" }, error),
    !loading && !error && rows.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-6" },
      mode === "local" ? "No harness runs are stored on this instance yet." : "No committed harness runs on this branch yet."),
    rows.map((row, i) => {

// --- Azure deployment guide tab ---------------------------------------------
// The guide (docs/azure-devops-deployment-guide.md) is served by
// GET /api/docs/azure-guide and rendered here as follow-along steps: each `##`
// heading becomes a collapsible, checkable step with progress kept on this
// device. The renderer below covers exactly what the guide uses - headings,
// paragraphs, nested lists, tables, fenced code, quotes and task boxes - and
// nothing fancier.

function inlineMd(text, keyBase) {
  // **bold**, *italic*, `code` and [text](url) into elements; the rest stays text.
  const out = [];
  const pattern = /(\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`|\[[^\]]+\]\([^)\s]+\))/g;
  let last = 0, m, k = 0;
  const plain = (t) => out.push(t);
  while ((m = pattern.exec(text)) !== null) {
    if (m.index > last) plain(text.slice(last, m.index));
    const token = m[0], key = keyBase + "-" + (k++);
    if (token.startsWith("**")) out.push(e("strong", { key, className: "text-slate-100" }, token.slice(2, -2)));
    else if (token.startsWith("`")) out.push(e("code", { key, className: "bg-slate-800 text-indigo-200 rounded px-1 py-0.5 text-[0.85em] font-mono break-all" }, token.slice(1, -1)));
    else if (token.startsWith("[")) {
      const link = /^\[([^\]]+)\]\(([^)\s]+)\)$/.exec(token);
      out.push(e("a", { key, href: link[2], target: "_blank", rel: "noopener noreferrer", className: "text-indigo-300 underline break-all" }, link[1]));
    }
    else out.push(e("em", { key, className: "text-slate-200" }, token.slice(1, -1)));
    last = m.index + token.length;
  }
  if (last < text.length) plain(text.slice(last));
  return out;
}

function CopyBtn({ text, label }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
      else {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (_) { /* clipboard blocked; the text is still selectable */ }
  };
  return e("button", { onClick: copy, title: "Copy to clipboard",
    className: "text-[9px] font-bold px-2 py-0.5 rounded bg-slate-700 hover:bg-indigo-600 text-slate-200 whitespace-nowrap" },
    copied ? "COPIED ✓" : (label || "COPY ⧉"));
}

function splitTableRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
}

function parseMdBlocks(md) {
  const lines = md.split("\n");
  const blocks = [];
  let i = 0;
  const isFence = (l) => /^\s*```/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (isFence(line)) {
      const lang = line.replace(/^\s*```/, "").trim();
      const buf = [];
      i++;
      while (i < lines.length && !isFence(lines[i])) { buf.push(lines[i]); i++; }
      i++; // consume the closing fence; a missing one still ends the block
      blocks.push({ type: "code", lang, text: buf.join("\n") });
      continue;
    }
    const heading = /^(#{1,4})\s+(.*)$/.exec(line);
    if (heading) { blocks.push({ type: "heading", level: heading[1].length, text: heading[2] }); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { blocks.push({ type: "hr" }); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const header = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitTableRow(lines[i])); i++; }
      blocks.push({ type: "table", header, rows });
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      blocks.push({ type: "quote", text: buf.join("\n") });
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const items = [];
      while (i < lines.length) {
        const l = lines[i];
        if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
          const indent = (/^(\s*)/.exec(l)[1] || "").replace(/\t/g, "  ").length;
          items.push({ indent, ordered: /^\s*\d+\./.test(l), task: /^\s*[-*]\s+\[( |x)\]\s+/.test(l),
                       taskDone: /^\s*[-*]\s+\[x\]\s+/.test(l),
                       text: l.replace(/^\s*([-*]|\d+\.)\s+(?:\[( |x)\]\s+)?/, "") });
          i++;
        } else if (l.trim() && /^\s{2,}/.test(l) && items.length) {
          // A wrapped continuation of the previous list item.
          items[items.length - 1].text += " " + l.trim();
          i++;
        } else break;
      }
      blocks.push({ type: "list", items });
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() &&
           !/^\s*(```|#{1,4}\s|>|-{3,}\s*$|\*{3,}\s*$)/.test(lines[i]) &&
           !/^\s*\|.*\|\s*$/.test(lines[i]) &&
           !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
      buf.push(lines[i].trim()); i++;
    }
    blocks.push({ type: "p", text: buf.join(" ") });
  }
  return blocks;
}

function MdList({ items, keyBase }) {
  // Nest by indentation, then render each run of same-flavoured items as one
  // ul/ol so mixed nesting keeps its markers.
  const root = { children: [] };
  const stack = [{ level: -1, node: root }];
  items.forEach((item) => {
    const node = { item, children: [] };
    const level = Math.floor(item.indent / 2);
    while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
    stack[stack.length - 1].node.children.push(node);
    stack.push({ level, node });
  });
  const render = (node, key, depth) => {
    const groups = [];
    node.children.forEach((child) => {
      const last = groups[groups.length - 1];
      if (last && last.ordered === child.item.ordered) last.nodes.push(child);
      else groups.push({ ordered: child.item.ordered, nodes: [child] });
    });
    return groups.map((g, gi) => e(g.ordered ? "ol" : "ul", {
      key: key + "-" + gi,
      className: (g.ordered ? "list-decimal" : "list-disc") + " pl-5 space-y-1.5 text-xs text-slate-300 leading-relaxed"
    }, g.nodes.map((n, ni) => e("li", { key: ni, className: n.item.task ? "list-none -ml-5" : "" },
      n.item.task && e("span", { className: "mr-1.5" }, "☐"),
      inlineMd(n.item.text, key + gi + "i" + ni),
      n.children.length ? render(n, key + gi + "n" + ni, depth + 1) : null))));
  };
  return e("div", { className: "space-y-2" }, render(root, keyBase, 0));
}

function MdBlocks({ blocks }) {
  return e("div", { className: "space-y-3" }, blocks.map((b, i) => {
    switch (b.type) {
      case "heading": {
        const sizes = ["text-lg font-bold text-indigo-200", "text-base font-bold text-indigo-300",
                       "text-sm font-bold text-slate-100", "text-xs font-bold text-slate-200"];
        return e("div", { key: i, className: (sizes[b.level - 1] || sizes[2]) + " pt-1" }, inlineMd(b.text, "h" + i));
      }
      case "p": return e("p", { key: i, className: "text-xs text-slate-300 leading-relaxed" }, inlineMd(b.text, "p" + i));
      case "hr": return e("hr", { key: i, className: "border-slate-800" });
      case "quote": return e(QuoteBlock, { key: i, text: b.text, keyBase: "q" + i });
      case "code": return e(CodeBlock, { key: i, lang: b.lang, text: b.text });
      case "table": return e("div", { key: i, className: "overflow-x-auto border border-slate-800 rounded-xl" },
        e("table", { className: "w-full text-[10px]" },
          e("thead", {}, e("tr", { className: "bg-slate-800/70" },
            b.header.map((cell, j) => e("th", { key: j, className: "text-left px-2 py-1.5 font-bold text-slate-200" }, inlineMd(cell, "th" + i + "-" + j))))),
          e("tbody", {}, b.rows.map((row, r) => e("tr", { key: r, className: "border-t border-slate-800" + (r % 2 ? " bg-slate-900/40" : "") },
            row.map((cell, c) => e("td", { key: c, className: "px-2 py-1.5 text-slate-300 align-top" }, inlineMd(cell, "td" + i + "-" + r + "-" + c))))))));
      case "list": return e(MdList, { key: i, items: b.items, keyBase: "l" + i });
      default: return null;
    }
  }));
}

const DOCS_BASE_URL = "https://github.com/Raheelatta1984/testforge/blob/main/docs/";
const AZURE_GUIDE_URL = DOCS_BASE_URL + "azure-devops-deployment-guide.md";
// Runbooks this Azure guide tells you to read (§2, §8). Deliberately NOT a link to
// docs/deployment-guide.md: the Azure tab is a self-contained Azure story.
const RUNBOOK_URLS = {
  security: DOCS_BASE_URL + "github-publishing-security-runbook.md",
  acceptance: DOCS_BASE_URL + "qa-automation-acceptance.md",
};

function Azure() {
  const [data, setData] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(true);
  const [open, setOpen] = useState(() => ({ 0: true }));   // first step starts open
  const [allOpen, setAllOpen] = useState(false);
  // Follow-along progress lives on this device only.
  const [done, setDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem("tf_azure_steps") || "{}"); } catch (_) { return {}; }
  });
  const sectionRefs = useRef({});

  useEffect(() => {
    let stop = false;
    API.get("/api/docs/azure-guide")
      .then(res => { if (!stop) { setData(res); setError(""); } })
      .catch(err => { if (!stop) setError(err.message); })
      .finally(() => { if (!stop) setLoading(false); });
    return () => { stop = true; };
  }, []);

  // Split the guide into: document title, an intro (before the first `##`) and
  // one step per `##` heading. Code fences are respected - some code blocks
  // contain lines that look like headings.
  let title = "", intro = [], sections = [];
  if (data && data.markdown) {
    let current = null, inFence = false;
    for (const line of data.markdown.split("\n")) {
      if (/^\s*```/.test(line)) {
        inFence = !inFence;
        (current ? current.lines : intro).push(line);
        continue;
      }
      if (!inFence) {
        const h2 = /^##\s+(.*)$/.exec(line);
        const h1 = /^#\s+(.*)$/.exec(line);
        if (h2) { current = { title: h2[1].trim(), lines: [] }; sections.push(current); continue; }
        if (h1 && !title) { title = h1[1].trim(); continue; }
      }
      (current ? current.lines : intro).push(line);
    }
  }
  sections = sections.map(s => ({ title: s.title, markdown: s.lines.join("\n") }));
  const introMd = intro.join("\n");

  const toggleDone = (key) => {
    setDone(prev => {
      const next = { ...prev };
      if (next[key]) delete next[key]; else next[key] = true;
      try { localStorage.setItem("tf_azure_steps", JSON.stringify(next)); } catch (_) {}
      return next;
    });
  };
  const resetProgress = () => {
    setDone({});
    try { localStorage.removeItem("tf_azure_steps"); } catch (_) {}
  };
  const jumpTo = (idx) => {
    setOpen(prev => ({ ...prev, [idx]: true }));
    setTimeout(() => {
      const node = sectionRefs.current[idx];
      if (node && node.scrollIntoView) node.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 50);
  };
  const toggleAll = () => {
    const next = {};
    sections.forEach((_, idx) => { next[idx] = !allOpen; });
    setOpen(next);
    setAllOpen(!allOpen);
  };
  const stepKey = (idx, s) => idx + "::" + s.title;
  const doneCount = sections.filter((s, idx) => done[stepKey(idx, s)]).length;
  const pct = sections.length ? Math.round((doneCount / sections.length) * 100) : 0;

  return e("div", { className: "space-y-4" },
    e(GuideSection, { id: "azure-head", label: "Azure deployment guide",
      action: "Work top to bottom and tick each step off — progress is kept on this device." },
    e("div", { className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-2" },
      e("div", { className: "flex justify-between items-start gap-2" },
        e("div", {},
          e("h2", { className: "font-bold text-lg text-indigo-300" }, "Azure deployment guide ☁️"),
          e("p", { className: "text-[11px] text-slate-400 mt-1" },
            "Deploy TestForge on Azure — the VM runtime, Azure Database for PostgreSQL and the Azure " +
            "DevOps pipeline — by following the steps below, in order. This tab is self-contained: every " +
            "step is an Azure step. " +
            "Tick each step off as you finish it — progress is kept on this device."),
          data && e("p", { className: "text-[9px] font-mono text-slate-500 mt-1 break-all" },
            `${data.source} · ${Math.round((data.bytes || 0) / 1024)} KB`)),
        e("span", { className: "fast-badge whitespace-nowrap" }, sections.length ? (sections.length + " STEPS") : "GUIDE")
      ),
      sections.length > 0 && e("div", { className: "space-y-1 pt-1" },
        e("div", { className: "h-2 bg-slate-800 rounded-full overflow-hidden" },
          e("div", { className: "h-full bg-indigo-500 transition-all", style: { width: pct + "%" } })),
        e("div", { className: "flex justify-between items-center" },
          e("span", { className: "text-[10px] text-slate-400" }, `${doneCount} of ${sections.length} steps complete`),
          e("div", { className: "flex gap-2" },
            e("button", { onClick: toggleAll, className: "text-[9px] font-bold px-2 py-1 rounded bg-slate-700 hover:bg-indigo-600" },
              allOpen ? "COLLAPSE ALL" : "EXPAND ALL"),
            e("button", { onClick: resetProgress, className: "text-[9px] font-bold px-2 py-1 rounded bg-slate-700 hover:bg-red-700" }, "RESET PROGRESS"))))
    )),
    loading && e("p", { className: "text-sm text-slate-400" }, "Loading the guide…"),
    error && e("div", { role: "alert", className: "bg-red-950/40 border border-red-800/40 text-red-200 p-4 rounded-2xl space-y-2" },
      e("p", { className: "text-sm font-bold" }, "The guide could not be loaded."),
      e("p", { className: "text-xs" }, error),
      e("a", { href: AZURE_GUIDE_URL, target: "_blank", rel: "noopener noreferrer",
               className: "block text-center bg-slate-800 text-indigo-300 text-xs font-bold px-4 py-2 rounded-xl underline" },
        "Read it on GitHub instead")),
    data && data.truncated && e("p", { role: "status", className: "text-xs text-amber-300" },
      "The guide is larger than the server is willing to serve and was cut short. Read the full file on GitHub."),
    e(GuideSection, { id: "azure-nav", label: "Jump to a step",
      action: "Tap a chip to scroll straight to that step of the guide." },
    e("div", { className: "space-y-4" },
    sections.length > 0 && e("div", { className: "flex flex-wrap gap-1.5" },
      sections.map((s, idx) => e("button", { key: idx, onClick: () => jumpTo(idx),
        className: "text-[9px] font-mono px-2 py-1 rounded-full border " +
          (done[stepKey(idx, s)] ? "bg-emerald-900/60 border-emerald-700 text-emerald-200"
                                 : "bg-slate-900 border-slate-700 text-slate-300 hover:border-indigo-500") },
        (done[stepKey(idx, s)] ? "✓ " : "") + s.title.split(/[.:]/)[0].slice(0, 28)))),
    data && introMd.trim() && e("div", { className: "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2" },
      title && e("div", { className: "text-sm font-bold text-indigo-200" }, title),
      e(MdBlocks, { blocks: parseMdBlocks(introMd) })))),
    e(GuideSection, { id: "azure-steps", label: "The steps themselves",
      action: "Expand a step, copy its commands, then tick it off when it is done." },
    e("div", { className: "space-y-4" },
    sections.map((s, idx) => {
      const key = stepKey(idx, s);
      const isOpen = !!open[idx];
      const isDone = !!done[key];
      return e("div", { key: key, ref: (node) => { sectionRefs.current[idx] = node; }, className: "scroll-mt-3" },
        e("div", { className: "bg-slate-900 border rounded-2xl overflow-hidden " + (isDone ? "border-emerald-800/60" : "border-slate-800") },
          e("div", { className: "flex items-stretch" },
            e("button", { title: isDone ? "Mark step as not done" : "Mark step as done",
              onClick: () => toggleDone(key),
              className: "px-3 text-lg " + (isDone ? "text-emerald-400" : "text-slate-600 hover:text-slate-400") }, isDone ? "✅" : "⬜"),
            e("button", { className: "flex-1 text-left p-3 pl-1", onClick: () => setOpen(prev => ({ ...prev, [idx]: !isOpen })) },
              e("div", { className: "flex justify-between items-center gap-2" },
                e("span", { className: "font-bold text-xs " + (isDone ? "text-emerald-300 line-through" : "text-slate-200") }, s.title),
                e("span", { className: "text-slate-500 text-xs" }, isOpen ? "▲" : "▼")))),
          isOpen && e("div", { className: "p-4 pt-1 border-t border-slate-800/70" },
            e(MdBlocks, { blocks: parseMdBlocks(s.markdown) }))));
    }))),
    e("div", { className: "flex flex-wrap justify-center gap-2 pt-1" },
      e("a", { href: AZURE_GUIDE_URL, target: "_blank", rel: "noopener noreferrer",
               className: "text-[9px] font-bold px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 hover:border-indigo-500" }, "📖 THIS GUIDE ON GITHUB"),
      e("a", { href: RUNBOOK_URLS.security, target: "_blank", rel: "noopener noreferrer",
               className: "text-[9px] font-bold px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 hover:border-indigo-500" }, "🔐 SECURITY RUNBOOK"),
      e("a", { href: RUNBOOK_URLS.acceptance, target: "_blank", rel: "noopener noreferrer",
               className: "text-[9px] font-bold px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-300 hover:border-indigo-500" }, "✅ QA ACCEPTANCE")),
    e("p", { className: "text-[10px] text-slate-500 text-center" },
      "Served from docs/azure-devops-deployment-guide.md in this deployment. This guide covers Azure only " +
      "(VM runtime, Azure Database for PostgreSQL, Azure DevOps); the [verify] marks flag Azure quotas " +
      "that change - check them against your subscription.")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(ErrorBoundary, null, e(AccessBoundary)));
</script>
</body>
</html>
