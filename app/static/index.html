<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; }
  .nav-btn { width: 100%; padding: 15px; text-align: left; font-size: 14px; border-left: 4px solid transparent; transition: 0.2s; }
  .nav-btn.active { background: #1e293b; border-left-color: #818cf8; color: #818cf8; font-weight: bold; }
  .content-area { flex: 1; overflow-y: auto; padding: 20px; }
  .progress-fill { height: 100%; background: #6366f1; transition: width 0.5s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

const API = {
  get: u => fetch(u).then(r => r.json()),
  post: (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  patch: (u, b) => fetch(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  del: u => fetch(u, {method:'DELETE'}).then(r => r.json())
};

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);

  const tabs = [
    {id:"projects", label:"📁 Projects"},
    {id:"variables", label:"🔤 Variables"},
    {id:"record", label:"⏺ AI Record"},
    {id:"library", label:"📚 Library"},
    {id:"runs", label:"▶ Execution"},
    {id:"github", label:"🐙 Sync"}
  ];

  return e('div', { className: "flex h-screen w-screen overflow-hidden" },
    // PERMANENT MENU SIDEBAR (NEVER HIDES)
    e('aside', { className: "w-48 bg-slate-900 border-r border-slate-800 flex flex-col pt-4" },
      e('div', {className:"px-4 mb-8 font-bold text-indigo-400 text-lg"}, "⚡ TESTFORGE"),
      tabs.map(t => e('button', {
        key: t.id,
        onClick: () => setTab(t.id),
        className: `nav-btn ${tab===t.id?'active':''}`
      }, t.label))
    ),
    // MAIN CONTENT
    e('main', { className: "content-area" },
      tab === "projects" && e(Projects, { activeProject, setActiveProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "github" && e(Github)
    )
  );
}

function Projects({ activeProject, setActiveProject }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  const load = () => API.get("/api/projects").then(setProjs);
  useEffect(() => { load(); }, []);
  return e('div', { className: "space-y-4" },
    e('div', { className: "bg-slate-900 p-4 rounded-xl border border-slate-800" },
      e('input', { value: name, onChange: e => setName(e.target.value), className: "w-full bg-slate-800 p-2 rounded mb-2", placeholder: "Project Name" }),
      e('button', { onClick: async () => { await API.post("/api/projects", { name }); setName(""); load(); }, className: "w-full bg-indigo-600 py-2 rounded font-bold" }, "Create Project")
    ),
    projs.map(p => e('div', { key: p.id, onClick: () => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); }, className: `p-4 rounded-xl border cursor-pointer ${activeProject?.id===p.id?'border-indigo-500 bg-indigo-500/5':'border-slate-800'}` }, p.name))
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const load = () => project && API.get(`/api/variables?project_id=${project.id}`).then(setVars);
  useEffect(() => { load(); }, [project]);
  if (!project) return e('div', {}, "Select Project First");
  return e('div', { className: "space-y-2" }, vars.map(v => e('div', {key:v.id, className:"p-3 bg-slate-900 border border-slate-800 rounded-lg flex justify-between"}, 
    e('div', {}, e('code', {className:"text-indigo-400"}, `{{${v.name}}}`), e('div', {className:"text-xs text-slate-500"}, v.value)),
    e('div', {className:"flex gap-1"}, (v.associated_recordings||[]).map((tag,i)=>e('span', {key:i, className:"text-[9px] bg-slate-800 p-1 rounded"}, tag)))
  )));
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const ws = useRef(null);
  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: "New Session", start_url: "https://google.com" });
    setRecId(r.id);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${r.id}`);
    ws.current.onmessage = ev => { const m = JSON.parse(ev.data); if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data); };
  };
  if (!project) return e('div', {}, "Select Project First");
  if (recId) return e('div', { className: "fixed inset-0 bg-slate-950 z-50 flex flex-col" },
    e('div', { className: "flex justify-between p-3 bg-slate-900" }, e('span', {}, "RECORDING"), e('button', { onClick: () => { ws.current.send(JSON.stringify({type:"stop"})); setRecId(null); }, className: "bg-red-600 px-4 rounded" }, "SAVE")),
    e('div', { className: "flex-1 overflow-auto bg-black" }, frame && e('img', { src: frame, className: "w-full", onClick: (evt) => {
      const r = evt.target.getBoundingClientRect();
      ws.current.send({ type: "tap", x: Math.round((evt.clientX - r.left) / r.width * 1280), y: Math.round((evt.clientY - r.top) / r.height * 800) });
    }}))
  );
  return e('button', { onClick: start, className: "w-full bg-red-600 py-10 rounded-2xl font-bold" }, "START AI RECORDING");
}

function Library({ project, onRun }) {
  const [recs, setRecs] = useState([]);
  useEffect(() => { project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs); }, [project]);
  return e('div', { className: "space-y-2" }, recs.map(r => e('div', { key: r.id, className: "p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between" }, 
    e('span', {}, r.name), e('button', { onClick: () => onRun(r.id), className: "bg-emerald-600 px-4 py-1 rounded" }, "RUN")
  )));
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [frame, setFrame] = useState(null);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  useEffect(() => {
    if (runId) {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = ev => { const m = JSON.parse(ev.data); if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data); };
      return () => ws.close();
    }
  }, [runId]);
  return e('div', { className: "space-y-4" },
    runId && e('div', {className:"bg-slate-900 border-2 border-indigo-500 rounded-xl p-4"}, 
      e('div', {className:"flex justify-between mb-2"}, e('span', {}, "LIVE VIEW"), e('button', {onClick:()=>setRunId(null)}, "✕")),
      e('img', { src: frame, className: "w-full rounded bg-black" })
    ),
    runs.map(r => e('div', { key: r.id, onClick: () => setRunId(r.id), className: "p-4 bg-slate-900 border border-slate-800 rounded flex justify-between cursor-pointer" }, e('span', {}, r.id.slice(0,8)), e('span', {}, r.status)))
  );
}

function Github() { return e('div', {className:"text-center py-20"}, e('a', {href:"/api/sync/github-bundle", className:"bg-indigo-600 px-8 py-3 rounded-lg font-bold"}, "Download Sync Bundle")); }

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
