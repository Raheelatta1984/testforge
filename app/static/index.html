<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: #020617; color: #f8fafc; font-family: sans-serif; }
  .canvas-img { image-rendering: auto; user-select: none; }
</style>
</head>
<body>
<div id="root">
  <div style="padding: 40px; text-align: center;">
    <h2>⚒️ Loading TestForge Portal...</h2>
  </div>
</div>

<script>
  window.addEventListener('error', function(e) {
    document.getElementById('root').innerHTML = '<div style="padding:20px; color:#ef4444;"><h3>Runtime Error:</h3><pre>' + e.message + ' at line ' + e.lineno + '</pre></div>';
  });
</script>

<script>
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

const API = {
  async req(m, u, b) {
    const r = await fetch(u, { method: m,
      headers: { "Content-Type": "application/json" },
      body: b !== undefined ? JSON.stringify(b) : undefined });
    if (!r.ok) throw new Error((await r.text()).slice(0, 300));
    return r.json();
  },
  get: (u) => API.req("GET", u),
  post: (u, b) => API.req("POST", u, b),
  patch: (u, b) => API.req("PATCH", u, b),
  del: (u) => API.req("DELETE", u),
};

const ACTION_ICON = { navigate:"🌐", click:"🖱", dblclick:"🖱🖱", fill:"⌨️",
  select:"🔽", press:"⏎", copy:"⎘", cut:"✂️", paste:"📋", scroll:"🖱",
  assert_text:"✓", assert_visible:"👁", wait:"⏱", call_recording:"🔗" };

function Badge(props) {
  return e('span', { className: `text-[10px] px-1.5 py-0.5 rounded ${props.color || "bg-slate-700"}` }, props.children);
}

function App() {
  const [tab, setTab] = useState("projects");
  const [projects, setProjects] = useState([]);
  const [activeProject, setActiveProject] = useState(
    () => JSON.parse(localStorage.getItem("tf_project") || "null"));
  const [activeRun, setActiveRun] = useState(null);

  const loadProjects = () => API.get("/api/projects").then(setProjects).catch(console.error);
  useEffect(() => { loadProjects(); }, []);

  const selectProject = (p) => {
    setActiveProject(p);
    localStorage.setItem("tf_project", JSON.stringify(p));
  };
  const runStarted = (id) => { setActiveRun(id); setTab("runs"); };

  return e('div', { className: "min-h-screen pb-20" },
    e('header', { className: "sticky top-0 z-10 bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center gap-2" },
      e('span', { className: "font-bold text-lg" }, "⚒️ TestForge"),
      activeProject && e(Badge, { color: "bg-indigo-700" }, activeProject.name)
    ),
    e('main', { className: "p-3 max-w-3xl mx-auto" },
      tab === "projects" && e(Projects, { projects, active: activeProject, onSelect: selectProject, onChanged: loadProjects }),
      tab === "record" && e(Recorder, { project: activeProject, onDone: () => setTab("library") }),
      tab === "library" && e(Library, { project: activeProject, projects, onRun: runStarted }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "scenarios" && e(Scenarios, { project: activeProject, onRun: runStarted }),
      tab === "runs" && e(Runs, { activeRun, setActiveRun })
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex overflow-x-auto" },
      [
        ["projects", "📁 Projects"], ["record", "⏺ Record"],
        ["library", "📚 Library"], ["variables", "🔤 Variables"],
        ["scenarios", "✨ Scenarios"], ["runs", "▶ Runs"]
      ].map(([k, label]) =>
        e('button', {
          key: k,
          onClick: () => setTab(k),
          className: `flex-1 py-3 text-xs whitespace-nowrap px-2 ${tab === k ? "text-indigo-400 border-t-2 border-indigo-400" : "text-slate-400"}`
        }, label)
      )
    )
  );
}

function NeedProject() {
  return e('div', { className: "text-center text-slate-400 mt-16" }, "Select or create a project first 📁");
}

function Projects({ projects, active, onSelect, onChanged }) {
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const create = async () => {
    if (!name.trim()) return;
    const p = await API.post("/api/projects", { name, base_url: url });
    setName(""); setUrl(""); onChanged(); onSelect(p);
  };
  return e('div', { className: "space-y-3" },
    e('div', { className: "bg-slate-900 rounded-lg p-3 space-y-2" },
      e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white", placeholder: "Project name", value: name, onChange: e => setName(e.target.value) }),
      e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white", placeholder: "Base URL (optional)", value: url, onChange: e => setUrl(e.target.value) }),
      e('button', { onClick: create, className: "w-full bg-indigo-600 rounded py-2 font-semibold" }, "+ Create Project")
    ),
    projects.map(p =>
      e('div', {
        key: p.id,
        onClick: () => onSelect(p),
        className: `bg-slate-900 rounded-lg p-3 cursor-pointer border ${active?.id === p.id ? "border-indigo-500" : "border-slate-800"}`
      },
        e('div', { className: "font-semibold" }, p.name),
        e('div', { className: "text-xs text-slate-400" }, p.base_url)
      )
    )
  );
}

function Recorder({ project, onDone }) {
  const [name, setName] = useState("");
  const [url, setUrl] = useState(project?.base_url || "");
  const [shared, setShared] = useState(false);
  const [recId, setRecId] = useState(null);
  const [steps, setSteps] = useState([]);

  if (!project) return e(NeedProject);

  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: name || "Untitled", start_url: url, shared });
    setSteps([]); setRecId(r.id);
  };

  if (recId) return e(LiveRecorder, { recId, steps, setSteps, onDone: () => { setRecId(null); onDone(); } });

  return e('div', { className: "bg-slate-900 rounded-lg p-3 space-y-2" },
    e('h2', { className: "font-bold" }, "⏺ New Recording"),
    e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white", placeholder: "Recording name", value: name, onChange: e => setName(e.target.value) }),
    e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white", placeholder: "https://start-url.com", value: url, onChange: e => setUrl(e.target.value) }),
    e('label', { className: "flex items-center gap-2 text-sm" },
      e('input', { type: "checkbox", checked: shared, onChange: e => setShared(e.target.checked) }),
      "Share across all projects (reusable everywhere)"
    ),
    e('button', { onClick: start, className: "w-full bg-red-600 rounded py-2 font-semibold" }, "● Start Recording")
  );
}

function LiveRecorder({ recId, steps, setSteps, onDone }) {
  const [frame, setFrame] = useState(null);
  const [text, setText] = useState("");
  const [status, setStatus] = useState("Connecting & launching browser (takes ~5s)...");
  const wsRef = useRef(null);

  useEffect(() => {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/record/${recId}`);
    ws.onopen = () => setStatus("Browser connected! Loading page...");
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "frame") {
        setFrame("data:image/jpeg;base64," + m.data);
        setStatus("Recording active");
      } else if (m.type === "step") {
        setSteps(s => [...s, m.step]);
      } else if (m.type === "stopped") {
        onDone();
      }
    };
    ws.onerror = () => setStatus("WebSocket connection error");
    wsRef.current = ws;
    return () => { try { ws.send(JSON.stringify({ type: "stop" })); } catch (_) {} ws.close(); };
  }, [recId]);

  const forceStop = () => {
    if (wsRef.current && wsRef.current.readyState === 1) {
      wsRef.current.send(JSON.stringify({ type: "stop" }));
    }
    onDone();
  };

  const send = (o) => {
    if (wsRef.current && wsRef.current.readyState === 1) {
      wsRef.current.send(JSON.stringify(o));
    } else {
      alert("Connection not ready yet. Please wait a moment.");
    }
  };

  const tap = (evt) => {
    const r = evt.currentTarget.getBoundingClientRect();
    send({ type: "tap", x: Math.round((evt.clientX - r.left) / r.width * 1280), y: Math.round((evt.clientY - r.top) / r.height * 800) });
  };

  return e('div', { className: "space-y-2" },
    e('div', { className: "flex items-center gap-2" },
      e('span', { className: "w-2 h-2 rounded-full bg-red-500 animate-pulse" }),
      e('span', { className: "text-sm font-semibold" }, "REC"),
      e('span', { className: "text-xs text-slate-400 ml-2 truncate max-w-[150px]" }, status),
      e('button', { onClick: forceStop, className: "ml-auto bg-red-700 hover:bg-red-600 rounded px-4 py-1.5 text-sm font-bold" }, "⏹ Stop & Save")
    ),
    e('div', { className: "bg-black rounded-lg overflow-hidden border border-slate-700" },
      frame ? e('img', { className: "canvas-img w-full", src: frame, onClick: tap, draggable: "false" })
            : e('div', { className: "h-64 flex flex-col items-center justify-center text-slate-400 gap-2 p-4 text-center" },
                e('div', { className: "animate-spin rounded-full h-8 w-8 border-b-2 border-white" }),
                e('span', { className: "text-xs" }, status)
              )
    ),
    e('div', { className: "flex gap-1.5" },
      e('input', { className: "flex-1 bg-slate-800 rounded px-3 py-2 text-sm text-white", placeholder: "Type text...", value: text, onChange: e => setText(e.target.value) }),
      e('button', { onClick: () => { if (text) { send({ type: "text", text }); setText(""); } }, className: "bg-indigo-600 rounded px-3 text-sm" }, "Type")
    ),
    e('div', { className: "bg-slate-900 rounded-lg p-2 max-h-40 overflow-y-auto" },
      e('div', { className: "text-xs text-slate-400 px-1 pb-1" }, `${steps.length} steps captured`),
      steps.map((s, i) =>
        e('div', { key: i, className: "text-xs px-1 py-1 border-b border-slate-800" },
          ACTION_ICON[s.action] || "•", " ", e('span', { className: "text-slate-300" }, s.label || s.action),
          s.value && e('span', { className: "text-indigo-300" }, ` = "${s.value}"`)
        )
      )
    )
  );
}

function Library({ project, projects, onRun }) {
  const [recs, setRecs] = useState([]);
  const load = useCallback(() => project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs), [project]);
  useEffect(() => { load(); }, [load]);
  if (!project) return e(NeedProject);
  return e('div', { className: "space-y-2" },
    e('h2', { className: "font-bold" }, "📚 Recording Library"),
    recs.length === 0 ? e('p', { className: "text-xs text-slate-400" }, "No recordings yet — go to ⏺ Record.") :
    recs.map(r =>
      e('div', { key: r.id, className: "bg-slate-900 rounded-lg border border-slate-800 p-3 flex justify-between items-center" },
        e('div', {},
          e('div', { className: "font-semibold text-sm" }, r.name),
          e('div', { className: "text-xs text-slate-400" }, `${r.step_count} steps · ${r.status}`)
        ),
        e('button', { onClick: () => API.post("/api/runs", { target_type: "recording", target_id: r.id }).then(res => alert("Run started! Check Runs tab.")), className: "bg-emerald-600 rounded px-3 py-1 text-xs font-bold" }, "▶ Run")
      )
    )
  );
}

function Variables({ project }) {
  if (!project) return e(NeedProject);
  return e('div', { className: "space-y-3" }, e('h2', { className: "font-bold" }, "🔤 Variables"), e('p', { className: "text-xs text-slate-400" }, "Manage scoped variables here."));
}

function Scenarios({ project, onRun }) {
  if (!project) return e(NeedProject);
  return e('div', { className: "space-y-3" }, e('h2', { className: "font-bold" }, "✨ Scenarios"), e('p', { className: "text-xs text-slate-400" }, "Generate scenarios from stories here."));
}

function Runs({ activeRun, setActiveRun }) {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns).catch(() => {}); }, []);
  return e('div', { className: "space-y-2" },
    e('h2', { className: "font-bold" }, "▶ Runs History"),
    runs.length === 0 ? e('p', { className: "text-xs text-slate-400" }, "No test runs yet.") :
    runs.map(r =>
      e('div', { key: r.id, className: "bg-slate-900 rounded-lg p-3 border border-slate-800 text-xs flex justify-between items-center" },
        e('div', {},
          e('span', { className: "font-bold text-indigo-400 mr-2" }, r.status.toUpperCase()),
          e('span', {}, `${r.target_type} (${r.target_id.slice(0,6)}...)`)
        ),
        e('span', { className: "text-slate-500" }, r.created_at.slice(11, 19))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
