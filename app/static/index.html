<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; overflow-x: hidden; }
  .canvas-img { image-rendering: auto; user-select: none; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  .nav-btn { flex: 1; padding: 12px 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; color: #64748b; border-top: 2px solid transparent; transition: all 0.2s; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .progress-bar { transition: width 0.4s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

const API = {
  get: u => fetch(u).then(r => r.json()),
  post: (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  patch: (u, b) => fetch(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  del: u => fetch(u, {method:'DELETE'}).then(r => r.json())
};

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => setMic(true);
    rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  const rephrase = async () => {
    const res = await API.post("/api/ai/rephrase", { text: value });
    onChange({ target: { value: res.rephrased } });
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: rephrase, className: "p-1 rounded bg-indigo-900" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || "null"));
  const [activeRunId, setActiveRunId] = useState(null);

  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["github","🐙"]];

  return e('div', { className: "min-h-screen pb-20" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-950/80 backdrop-blur z-40" },
      e('span', { className: "font-bold text-indigo-400" }, "⚡ TESTFORGE AI"),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('main', { className: "p-4 max-w-2xl mx-auto" },
      tab === "projects" && e(Projects, { activeProject, setActiveProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "comparison" && e(Comparison, {}),
      tab === "artifacts" && e(Artifacts, {}),
      tab === "github" && e(Github, {})
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex z-50" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Projects({ activeProject, setActiveProject }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  const load = () => API.get("/api/projects").then(setProjs);
  useEffect(() => { load(); }, []);
  return e('div', { className: "space-y-4" },
    e('div', { className: "bg-slate-900 p-4 rounded-xl border border-slate-800" },
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Project Name" }),
      e('button', { onClick: async () => { await API.post("/api/projects", { name }); setName(""); load(); }, className: "w-full bg-indigo-600 mt-2 py-2 rounded-lg font-bold" }, "Create Project")
    ),
    projs.map(p => e('div', { key: p.id, onClick: () => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); }, className: `p-4 rounded-xl border ${activeProject?.id===p.id?'border-indigo-500 bg-indigo-500/5':'border-slate-800 bg-slate-900'}` }, p.name))
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");
  const load = () => project && API.get(`/api/variables?project_id=${project.id}`).then(setVars);
  useEffect(() => { load(); }, [project]);
  if (!project) return e('div', {className:"text-center py-20 text-slate-500"}, "Select Project First");
  return e('div', { className: "space-y-4" },
    e('div', { className: "bg-slate-900 p-4 rounded-xl border border-slate-800" },
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Var Name" }),
      e('div', { className: "h-2" }),
      e(AiInput, { value: val, onChange: e => setVal(e.target.value), placeholder: "Value" }),
      e('button', { onClick: async () => { await API.post("/api/variables", { scope: "project", project_id: project.id, name, value: val }); setName(""); setVal(""); load(); }, className: "w-full bg-indigo-600 mt-2 py-2 rounded-lg font-bold" }, "Save Variable")
    ),
    vars.map(v => e('div', { key: v.id, className: "p-3 bg-slate-900 rounded-lg border border-slate-800 flex justify-between" },
      e('div', {}, e('code', {className:"text-indigo-400 font-bold"}, `{{${v.name}}}`), e('div', {className:"text-[10px] text-slate-500"}, v.value)),
      e('button', { onClick: async () => { await API.del(`/api/variables/${v.id}`); load(); }, className: "text-red-500" }, "✕")
    ))
  );
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [zoom, setZoom] = useState(1);
  const ws = useRef(null);

  if (!project) return e('div', {className:"text-center py-20 text-slate-500"}, "Select Project First");

  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: "New Session", start_url: project.base_url || "https://google.com" });
    setRecId(r.id);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${r.id}`);
    ws.current.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
    };
  };

  const send = (m) => ws.current?.send(JSON.stringify(m));

  if (recId) return e('div', { className: "fixed inset-0 bg-slate-950 z-[100] flex flex-col p-2" },
    e('div', { className: "flex justify-between p-2" },
      e('span', {className:"text-xs font-bold animate-pulse text-red-500"}, "● AI RECORDING"),
      e('div', {className:"flex gap-2"},
        e('button', { onClick:()=>setZoom(z=>z+0.1), className:"bg-slate-800 px-2 rounded" }, "+"),
        e('button', { onClick:()=>setZoom(z=>z-0.1), className:"bg-slate-800 px-2 rounded" }, "-"),
        e('button', { onClick:()=> { send({type:"stop"}); setRecId(null); }, className:"bg-red-600 px-4 rounded font-bold text-xs" }, "SAVE")
      )
    ),
    e('div', { className: "flex-1 relative overflow-auto bg-black rounded-xl" },
      frame && e('img', { src: frame, className: "origin-top-left", style: { transform: `scale(${zoom})` }, onClick: (evt) => {
        const r = evt.target.getBoundingClientRect();
        send({ type: "tap", x: Math.round(((evt.clientX - r.left)/zoom / r.width) * 1280), y: Math.round(((evt.clientY - r.top)/zoom / r.height) * 800) });
      }})
    ),
    e('div', { className: "h-20 bg-slate-900 mt-2 rounded-xl flex items-center px-4" },
       e('input', { className: "flex-1 bg-slate-800 p-2 rounded text-sm", placeholder: "Type into browser..." }),
       e('button', { className: "ml-2 bg-indigo-600 px-4 py-2 rounded" }, "Type")
    )
  );

  return e('button', { onClick: start, className: "w-full bg-red-600 py-10 rounded-2xl font-bold text-xl shadow-xl shadow-red-900/20" }, "● START AI RECORDING");
}

function Library({ project, onRun }) {
  const [recs, setRecs] = useState([]);
  const load = () => project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs);
  useEffect(() => { load(); }, [project]);
  return e('div', { className: "space-y-4" },
    recs.map(r => e('div', { key: r.id, className: "bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center" },
      e('div', {}, e('div', {className:"font-bold text-indigo-300"}, r.name), e('div', {className:"text-[10px] text-slate-500"}, `${r.step_count} steps`)),
      e('button', { onClick: () => onRun(r.id), className: "bg-emerald-600 px-6 py-2 rounded-lg font-bold text-xs" }, "RUN")
    ))
  );
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [log, setLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);

  const load = () => API.get("/api/runs").then(setRuns);
  useEffect(() => { load(); }, []);

  useEffect(() => {
    if (runId) {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);
        if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
        if (m.type === "step") { setLog(prev => [...prev.filter(x => x.order !== m.order), m]); setPercent(m.percent || 0); }
        if (m.type === "done") { setPercent(100); load(); }
      };
      return () => ws.close();
    }
  }, [runId]);

  return e('div', { className: "space-y-4" },
    runId && e('div', { className: "bg-slate-900 border-2 border-indigo-500 rounded-2xl p-4 space-y-4" },
      e('div', { className: "flex justify-between font-bold text-xs" }, e('span', {}, "LIVE JOURNEY"), e('button', {onClick:()=>setRunId(null)}, "✕")),
      e('div', { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden" }, e('div', { className: "bg-indigo-500 h-full progress-bar", style: { width: `${percent}%` } })),
      e('img', { src: frame, className: "w-full rounded-lg bg-black min-h-[150px]" }),
      e('div', { className: "max-h-40 overflow-y-auto space-y-1" }, log.sort((a,b) => b.order - a.order).map((s,i) => e('div', {key:i, className:"text-[10px] p-2 bg-slate-950 rounded flex justify-between"}, e('span', {}, s.label), e('span', {}, s.status==='passed'?'✅':'⏳'))))
    ),
    runs.map(r => e('div', { key: r.id, onClick: () => setRunId(r.id), className: "p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer" }, e('span', {className:"text-xs"}, `RUN ${r.id.slice(0,8)}`), e(Badge, { color: r.status==='passed'?'bg-emerald-900':'bg-amber-900' }, r.status)))
  );
}

function Comparison() {
  return e('div', {className:"py-20 text-center text-slate-500 text-xs"}, "Recordings & Execution logs will appear here side-by-side after first run.");
}

function Artifacts() {
  return e('div', {className:"py-20 text-center text-slate-500 text-xs"}, "Full-screen videos and validation snapshots center.");
}

function Github() {
  return e('div', { className: "text-center space-y-4 bg-slate-900 p-10 rounded-2xl border border-slate-800" },
    e('div', {className:"text-4xl"}, "🐙"),
    e('h2', {className:"font-bold"}, "Log Sync Engine"),
    e('a', { href: "/api/sync/github-bundle", className: "inline-block bg-indigo-600 px-8 py-3 rounded-xl font-bold" }, "Download Sync Bundle")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
