<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; height: 100vh; width: 100vw; overflow: hidden; }
  #root { height: 100%; display: flex; flex-direction: column; }
  
  /* Sidebar for Desktop, Bottom Bar for Mobile */
  .app-layout { display: flex; flex-direction: column; height: 100%; }
  @media (min-width: 768px) { .app-layout { flex-direction: row; } }

  .sidebar { background: #0f172a; border-right: 1px solid #1e293b; z-index: 50; }
  @media (max-width: 767px) {
    .sidebar { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; border-right: none; border-top: 1px solid #1e293b; display: flex; flex-direction: row; }
    .sidebar-header { display: none; }
    .nav-btn { flex: 1; flex-direction: column; justify-content: center; padding: 5px !important; }
  }

  .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 20px; font-size: 13px; font-weight: 500; color: #94a3b8; transition: 0.2s; }
  .nav-btn.active { color: #818cf8; background: rgba(129, 140, 248, 0.1); border-left: 3px solid #818cf8; }
  @media (max-width: 767px) { .nav-btn.active { border-left: none; border-top: 3px solid #818cf8; } }

  .main-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
  @media (min-width: 768px) { .main-content { padding-bottom: 20px; } }

  /* Container-based Browser Window (No more full-screen hiding) */
  .browser-container { background: #000; border-radius: 12px; border: 2px solid #1e293b; position: relative; overflow: hidden; width: 100%; aspect-ratio: 16/10; max-height: 60vh; }
  .canvas-render { width: 100%; height: 100%; object-fit: contain; cursor: crosshair; }
  
  .error-toast { position: fixed; top: 20px; right: 20px; background: #7f1d1d; border: 1px solid #f87171; padding: 12px; border-radius: 8px; z-index: 100; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

const API = {
  get: u => fetch(u).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t) })),
  post: (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t) })),
  patch: (u, b) => fetch(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t) })),
  del: u => fetch(u, {method:'DELETE'}).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t) }))
};

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);
  const [error, setError] = useState(null);

  const showError = (msg) => {
    setError(msg);
    setTimeout(() => setError(null), 10000);
  };

  const navItems = [
    { id: "projects", label: "Projects", icon: "📁" },
    { id: "variables", label: "Variables", icon: "🔤" },
    { id: "record", label: "AI Record", icon: "⏺" },
    { id: "library", label: "Tree", icon: "📚" },
    { id: "runs", label: "Execution", icon: "▶" },
    { id: "comparison", label: "Logs", icon: "⚖️" },
    { id: "github", label: "Sync", icon: "🐙" }
  ];

  return e('div', { className: "app-layout" },
    // ERROR TOAST
    error && e('div', { className: "error-toast" }, 
      e('div', { className: "flex items-center gap-3" },
        e('span', { className: "text-sm" }, error),
        e('button', { onClick: () => { navigator.clipboard.writeText(error); alert("Copied!"); }, className: "text-[10px] bg-red-800 px-2 py-1 rounded" }, "📋 COPY")
      )
    ),

    // SIDEBAR / BOTTOM BAR
    e('aside', { className: "sidebar md:w-64" },
      e('div', { className: "sidebar-header p-6" },
        e('div', { className: "text-indigo-400 font-bold text-xl tracking-tighter" }, "⚡ TESTFORGE AI")
      ),
      e('div', { className: "flex md:flex-col w-full" },
        navItems.map(item => e('button', {
          key: item.id,
          onClick: () => setTab(item.id),
          className: `nav-btn ${tab === item.id ? 'active' : ''}`
        }, 
          e('span', { className: "text-lg md:text-base" }, item.icon),
          e('span', { className: "hidden md:inline" }, item.label)
        ))
      )
    ),

    // MAIN VIEWPORT
    e('main', { className: "main-content" },
      e('div', { className: "p-4 md:p-8" },
        tab === "projects" && e(Projects, { activeProject, setActiveProject, setErr: showError }),
        tab === "variables" && e(Variables, { project: activeProject, setErr: showError }),
        tab === "record" && e(Recorder, { project: activeProject, setErr: showError }),
        tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); }, setErr: showError }),
        tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId, setErr: showError }),
        tab === "comparison" && e(Comparison, { setErr: showError }),
        tab === "github" && e(GithubSync)
      )
    )
  );
}

function Projects({ activeProject, setActiveProject, setErr }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  const load = () => API.get("/api/projects").then(setProjs).catch(err => setErr(err.message));
  useEffect(() => { load(); }, []);
  return e('div', { className: "max-w-2xl space-y-6" },
    e('div', { className: "bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl" },
      e('h2', { className: "text-lg font-bold mb-4" }, "Create New Project"),
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Project Name (e.g. CRM System)" }),
      e('button', { onClick: async () => { try { await API.post("/api/projects", { name }); setName(""); load(); } catch(err){setErr(err.message)} }, className: "w-full bg-indigo-600 mt-4 py-3 rounded-xl font-bold" }, "Create Project")
    ),
    e('div', { className: "grid gap-3" }, projs.map(p => e('div', { key: p.id, onClick: () => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); }, className: `p-5 rounded-2xl border cursor-pointer transition-all ${activeProject?.id === p.id ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-800 bg-slate-900/50 hover:bg-slate-800'}` }, p.name)))
  );
}

function Variables({ project, setErr }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");
  const load = () => project && API.get(`/api/variables?project_id=${project.id}`).then(setVars).catch(err => setErr(err.message));
  useEffect(() => { load(); }, [project]);
  if (!project) return e(NeedProject);
  return e('div', { className: "max-w-3xl space-y-4" },
    e('div', { className: "bg-slate-900 p-6 rounded-2xl border border-slate-800" },
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Key" }), e('div', {className:"h-2"}),
      e(AiInput, { value: val, onChange: e => setVal(e.target.value), placeholder: "Value" }),
      e('button', { onClick: async () => { try { await API.post("/api/variables", { scope: "project", project_id: project.id, name, value: val }); setName(""); setVal(""); load(); } catch(err){setErr(err.message)} }, className: "w-full bg-indigo-600 mt-4 py-2 rounded-lg font-bold" }, "Save Variable")
    ),
    vars.map(v => e('div', { key: v.id, className: "p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between items-center" }, 
      e('div', {}, e('code', {className:"text-indigo-400 font-bold"}, `{{${v.name}}}`), e('div', {className:"text-sm text-slate-500"}, v.value)),
      e('div', {className:"flex gap-2"}, 
        (v.associated_recordings || []).map((tag, i) => e('span', {key:i, className:"text-[10px] bg-slate-800 px-2 py-0.5 rounded text-indigo-300"}, tag)),
        e('button', { onClick: async () => { try { await API.del(`/api/variables/${v.id}`); load(); } catch(err){setErr(err.message)} }, className: "text-red-500 ml-2" }, "✕")
      )
    ))
  );
}

function Recorder({ project, setErr }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [zoom, setZoom] = useState(1);
  const ws = useRef(null);

  if (!project) return e(NeedProject);

  const start = async () => {
    try {
      const r = await API.post("/api/recordings", { project_id: project.id, name: "New Session", start_url: "https://google.com" });
      setRecId(r.id);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${r.id}`);
      ws.current.onmessage = ev => { const m = JSON.parse(ev.data); if(m.type==='frame') setFrame("data:image/jpeg;base64,"+m.data); };
      ws.current.onerror = () => setErr("Socket Error");
    } catch(err){setErr(err.message)}
  };

  const send = (m) => ws.current?.readyState === 1 && ws.current.send(JSON.stringify(m));

  if (recId) return e('div', { className: "space-y-4" },
    e('div', { className: "flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800" },
      e('div', { className: "flex items-center gap-2 text-xs font-bold text-red-500" }, e('span', {className:"w-2 h-2 rounded-full bg-red-500 animate-ping"}), "RECORDING LIVE"),
      e('div', { className: "flex gap-2" },
        e('button', { onClick: () => setZoom(z => Math.min(2, z + 0.1)), className: "bg-slate-800 p-2 rounded" }, "🔍+"),
        e('button', { onClick: () => setZoom(z => Math.max(0.5, z - 0.1)), className: "bg-slate-800 p-2 rounded" }, "🔍-"),
        e('button', { onClick: () => { send({type:"stop"}); setRecId(null); }, className: "bg-red-600 px-6 py-2 rounded-xl font-bold" }, "SAVE")
      )
    ),
    e('div', { className: "browser-container" }, 
      frame && e('img', { src: frame, className: "canvas-render origin-top-left", style: { transform: `scale(${zoom})` }, onClick: (evt) => {
        const r = evt.target.getBoundingClientRect();
        send({ type: "tap", x: Math.round(((evt.clientX - r.left)/zoom / r.width) * 1280), y: Math.round(((evt.clientY - r.top)/zoom / r.height) * 800) });
      }})
    )
  );

  return e('div', { className: "py-20 text-center" }, 
    e('button', { onClick: start, className: "bg-red-600 px-12 py-12 rounded-full font-bold text-xl shadow-2xl shadow-red-900/40 border-4 border-slate-900 hover:scale-105 transition-transform" }, "● START AI RECORD")
  );
}

function Library({ project, onRun, setErr }) {
  const [recs, setRecs] = useState([]);
  useEffect(() => { project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs).catch(err=>setErr(err.message)); }, [project]);
  if (!project) return e(NeedProject);
  return e('div', { className: "grid gap-4" },
    recs.map(r => e('div', { key: r.id, className: "bg-slate-900 p-5 rounded-2xl border border-slate-800 flex justify-between items-center" },
      e('div', {}, e('div', {className:"font-bold text-indigo-300"}, r.name), e('div', {className:"text-[10px] text-slate-500"}, `${r.step_count} steps`)),
      e('button', { onClick: () => onRun("recording", r.id), className: "bg-emerald-600 px-6 py-2 rounded-xl font-bold text-xs" }, "RUN")
    ))
  );
}

function Runs({ runId, setRunId, setErr }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);

  const load = () => API.get("/api/runs").then(setRuns).catch(err => setErr(err.message));
  useEffect(() => { load(); }, []);

  useEffect(() => {
    if (runId) {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);
        if (m.type === "snapshot" && m.run) { setActiveLog(m.run.log); setPercent(m.run.status === "passed" ? 100 : 0); }
        else if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
        else if (m.type === "step") { setActiveLog(p => [...p.filter(x => x.order !== m.order), m]); setPercent(m.percent || 0); }
        else if (m.type === "done") { setPercent(100); load(); }
      };
      return () => ws.close();
    }
  }, [runId]);

  return e('div', { className: "space-y-4" },
    runId && e('div', { className: "bg-slate-900 border-2 border-indigo-500 rounded-3xl p-6 space-y-4 shadow-2xl" },
      e('div', { className: "flex justify-between items-center" }, e('span', {className:"font-bold text-xs"}, "LIVE EXECUTION JOURNEY"), e('button', {onClick:()=>setRunId(null)}, "✕")),
      e('div', { className: "w-full bg-slate-800 h-3 rounded-full overflow-hidden" }, e('div', { className: "progress-fill shadow-[0_0_15px_rgba(99,102,241,0.5)]", style: { width: `${percent}%` } })),
      e('div', { className: "browser-container" }, frame && e('img', { src: frame, className: "canvas-render" })),
      e('div', { className: "max-h-40 overflow-y-auto space-y-2" }, activeLog.sort((a,b)=>b.order-a.order).map((s,i)=>e('div',{key:i, className:"p-3 bg-slate-950 rounded-xl border border-slate-900 flex justify-between text-xs"}, e('span',{},s.label), e('span',{},s.status==='passed'?'✅':'⏳'))))
    ),
    runs.map(r => e('div', { key: r.id, onClick: () => setRunId(r.id), className: "p-5 bg-slate-900 rounded-2xl border border-slate-800 flex justify-between items-center cursor-pointer hover:border-indigo-500" }, e('span', {className:"text-sm"}, `Execution #${r.id.slice(0,8)}`), e('span', {className:"text-[10px] font-bold text-indigo-400 uppercase"}, r.status)))
  );
}

function Comparison() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" }, runs.map(r => e('div', { key: r.id, className: "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg" },
      e('div', { className: "p-4 flex justify-between bg-slate-800/30", onClick: () => setSel(sel === r.id ? null : r.id) }, e('div', {}, e('div', {className:"font-bold"}, `Audit #${r.id.slice(0,8)}`), e('div', {className:"text-xs text-slate-500"}, r.created_at)), e('span', {className:"text-indigo-400 text-xs font-bold"}, "COMPARE")),
      sel === r.id && e('div', { className: "grid grid-cols-2 gap-2 p-2 bg-black/50 border-t border-slate-800" },
        e('div', { className: "space-y-1" }, (r.baseline || []).map((s, i) => e('div', {key:i, className:"text-[10px] bg-slate-900 p-2 rounded"}, s.action))),
        e('div', { className: "space-y-1" }, (r.log || []).map((s, i) => e('div', {key:i, className:"text-[10px] bg-slate-900 p-2 rounded flex justify-between"}, e('span',{},s.action), e('span',{},s.status==='passed'?'✅':'❌'))))
      )
  )));
}

function Artifacts() {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "grid gap-4" }, runs.filter(r => r.has_video).map(r => e('div', { key: r.id, className: "bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4 shadow-xl" },
      e('video', { controls: true, className: "w-full rounded-xl bg-black", src: `/api/runs/video/${r.id}` })
    ))
  );
}

function GithubSync() {
  return e('div', { className: "text-center py-20 bg-slate-900 rounded-3xl border border-slate-800" },
    e('div', {className:"text-5xl mb-4"}, "🐙"),
    e('h2', {className:"font-bold text-xl mb-6"}, "GitHub Log Archive"),
    e('a', { href: "/api/sync/github-bundle", className: "bg-indigo-600 px-10 py-4 rounded-2xl font-bold" }, "Download Full Bundle")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
