<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; width: 100vw; }
  .nav-btn { flex: 1; padding: 15px 5px; font-size: 10px; font-weight: bold; color: #64748b; border-top: 3px solid transparent; transition: 0.2s; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .content-area { height: calc(100vh - 70px); overflow-y: auto; padding: 15px; padding-bottom: 80px; }
  .canvas-img { width: 100%; border-radius: 12px; border: 1px solid #334155; }
  .progress-fill { height: 100%; background: #6366f1; transition: width 0.5s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

const API = {
  get: u => fetch(u).then(r => r.json()),
  post: (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  patch: (u, b) => fetch(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  del: u => fetch(u, {method:'DELETE'}).then(r => r.json())
};

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => setMic(true); rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20 border border-slate-700", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: async () => { const res = await API.post("/api/ai/rephrase", { text: value }); onChange({ target: { value: res.rephrased } }); }, className: "p-1 rounded bg-purple-900" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("record");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);

  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["github","🐙"]];

  return e('div', { className: "h-full flex flex-col" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/80 backdrop-blur" },
      e('span', { className: "font-bold text-indigo-400" }, "⚡ TESTFORGE AI"),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('div', { className: "content-area" },
      tab === "projects" && e(Projects, { setActiveProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "comparison" && e(Comparison),
      tab === "artifacts" && e(Artifacts),
      tab === "github" && e(Github)
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const ws = useRef(null);
  if (!project) return e('div', {className:"py-20 text-center text-slate-500"}, "Select Project First");
  const start = async (id = null) => {
    if (!id) {
      const r = await API.post("/api/recordings", { project_id: project.id, name: "New Session", start_url: project.base_url || "https://google.com" });
      id = r.id;
    }
    setRecId(id);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${id}`);
    ws.current.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
    };
  };
  if (recId) return e('div', { className: "fixed inset-0 bg-slate-950 z-[100] flex flex-col p-2" },
    e('div', { className: "flex justify-between p-2" }, e('span', {className:"text-xs font-bold text-red-500 animate-pulse"}, "● RECORDING"), e('button', { onClick:()=> { ws.current.send(JSON.stringify({type:"stop"})); setRecId(null); }, className:"bg-red-600 px-4 py-1 rounded text-xs" }, "SAVE")),
    e('div', { className: "flex-1 overflow-auto bg-black" }, frame && e('img', { src: frame, className: "canvas-img origin-top-left", onClick: (evt) => {
      const r = evt.target.getBoundingClientRect();
      ws.current.send(JSON.stringify({ type: "tap", x: Math.round((evt.clientX - r.left) / r.width * 1280), y: Math.round((evt.clientY - r.top) / r.height * 800) }));
    }}))
  );
  return e('button', { onClick: () => start(), className: "w-full bg-red-600 py-10 rounded-2xl font-bold" }, "● START AI RECORDING");
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  useEffect(() => {
    if (runId) {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);
        if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
        if (m.percent !== undefined) setPercent(m.percent);
        if (m.status) setActiveLog(prev => [...prev.filter(x => x.order !== m.order), m]);
      };
      return () => ws.close();
    }
  }, [runId]);
  return e('div', { className: "space-y-4" },
    runId && e('div', { className: "bg-slate-900 border-2 border-indigo-500 rounded-3xl p-4" },
      e('div', { className: "flex justify-between font-bold text-xs" }, e('span', {}, "LIVE JOURNEY"), e('button', {onClick:()=>setRunId(null)}, "✕")),
      e('div', { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden" }, e('div', { className: "progress-fill", style: { width: `${percent}%` } })),
      e('img', { src: frame, className: "w-full rounded bg-black mt-2" }),
      e('div', { className: "max-h-40 overflow-y-auto mt-2 space-y-1" }, activeLog.map((s,i) => e('div', {key:i, className:"text-[10px] p-2 bg-slate-950 rounded flex justify-between"}, e('span',{},s.label), e('span',{},s.status==='passed'?'✅':'⏳'))))
    ),
    runs.map(r => e('div', { key: r.id, onClick: () => setRunId(r.id), className: "p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between cursor-pointer" }, e('span', {}, r.id.slice(0,8)), e('span', {}, r.status)))
  );
}

function Projects({ setActiveProject }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  useEffect(() => { API.get("/api/projects").then(setProjs); }, []);
  return e('div', { className: "space-y-4" },
    e('div', { className: "bg-slate-900 p-4 rounded-xl border border-slate-800" },
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Project Name" }),
      e('button', { onClick: async () => { await API.post("/api/projects", { name }); setName(""); API.get("/api/projects").then(setProjs); }, className: "w-full bg-indigo-600 mt-2 py-2 rounded-lg font-bold" }, "Create Project")
    ),
    projs.map(p => e('div', { key: p.id, onClick: () => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); }, className: "p-4 bg-slate-900 rounded-xl border border-slate-800 mb-2 cursor-pointer" }, p.name))
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");
  const load = () => project && API.get(`/api/variables?project_id=${project.id}`).then(setVars);
  useEffect(() => { load(); }, [project]);
  if (!project) return e('div', {}, "Select Project First");
  return e('div', { className: "space-y-2" }, 
    e('div', {className:"bg-slate-900 p-4 rounded-xl border border-slate-800 mb-4"},
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Key" }), e('div', {className:"h-2"}),
      e(AiInput, { value: val, onChange: e => setVal(e.target.value), placeholder: "Value" }),
      e('button', { onClick: async () => { await API.post("/api/variables", { project_id: project.id, name, value: val }); setName(""); setVal(""); load(); }, className: "w-full bg-indigo-600 mt-2 py-2 rounded font-bold" }, "Save Variable")
    ),
    vars.map(v => e('div', {key:v.id, className:"p-3 bg-slate-900 border border-slate-800 rounded-lg flex justify-between"}, 
      e('div', {}, e('code', {className:"text-indigo-400 font-bold text-sm"}, `{{${v.name}}}`), e('div', {className:"text-xs text-slate-500"}, v.value)),
      e('button', { onClick: async () => { await API.del(`/api/variables/${v.id}`); load(); }, className: "text-red-500" }, "✕")
  )));
}

function Library({ project, onRun }) {
  const [recs, setRecs] = useState([]);
  useEffect(() => { project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs); }, [project]);
  return e('div', { className: "space-y-2" }, recs.map(r => e('div', { key: r.id, className: "p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between" }, 
    e('span', {}, r.name), e('button', { onClick: () => onRun(r.id), className: "bg-emerald-600 px-4 py-1 rounded" }, "RUN")
  )));
}

function Comparison() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" },
    runs.map(r => e('div', { key: r.id, className: "bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl" },
      e('div', { className: "p-4 flex justify-between bg-slate-800/50", onClick: () => setSel(sel === r.id ? null : r.id) }, e('span', {}, `Audit Run #${r.id.slice(0,8)}`), e('span', {}, "Compare ➔")),
      sel === r.id && e('div', { className: "grid grid-cols-2 gap-2 p-2 bg-black/40 border-t border-slate-800" },
        e('div', { className: "space-y-1 border-r border-slate-800 pr-1" }, e('div', {className:"text-[9px] font-bold text-purple-400 mb-1 uppercase"}, "Baseline Steps"), (r.baseline || []).map((s, i) => e('div', {key:i, className:"text-[9px] bg-slate-900 p-1.5 rounded"}, `${s.order}. ${s.action}`))),
        e('div', { className: "space-y-1 pl-1" }, e('div', {className:"text-[9px] font-bold text-emerald-400 mb-1 uppercase"}, "AI Execution Result"), (r.log || []).map((s, i) => e('div', {key:i, className:"text-[9px] bg-slate-900 p-1.5 rounded flex justify-between"}, e('span',{},s.action), e('span',{},s.status==='passed'?'✅':'❌'))))
      )
    ))
  );
}

function Artifacts() {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" },
    runs.filter(r => r.has_video).map(r => e('div', { key: r.id, className: "bg-slate-900 p-4 rounded-xl border border-slate-800" }, 
      e('div', {className:"text-xs mb-2 text-indigo-400"}, `Session: ${r.id.slice(0,8)}`),
      e('video', { controls: true, className: "w-full rounded bg-black", src: `/api/runs/video/${r.id}` })
    ))
  );
}

function Github() { return e('div', {className:"text-center py-20 bg-slate-900 rounded-3xl"}, e('a', {href:"/api/sync/github-bundle", className:"bg-indigo-600 px-8 py-3 rounded-xl font-bold"}, "Download Sync Bundle")); }

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
