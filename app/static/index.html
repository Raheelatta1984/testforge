<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Hybrid</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
    body { background: #020617; color: #f8fafc; font-family: system-ui; }
    .vm-canvas { width: 100%; height: auto; aspect-ratio: 1280/800; background: #000; border-radius: 8px; cursor: crosshair; }
    .key-btn { background: #1e293b; padding: 10px; border-radius: 6px; font-size: 11px; font-weight: bold; text-align: center; color: #cbd5e1; }
    .progress-bar { transition: width 0.3s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

const API = {
    get: u => fetch(u).then(r => r.json()),
    post: (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json())
};

function App() {
    const [tab, setTab] = useState("record");
    const [activeRunId, setActiveRunId] = useState(null);

    return e('div', { className: "p-2 pb-24 max-w-lg mx-auto" },
        e('header', { className: "p-4 bg-slate-900 rounded-xl mb-4 flex justify-between" },
            e('span', { className: "font-bold text-indigo-400" }, "⚡ TestForge Hybrid"),
            e('span', { className: "text-xs text-slate-500" }, "v2.0-VM")
        ),
        tab === "record" && e(Recorder),
        tab === "runs" && e(Runs, { activeRunId, setActiveRunId }),
        e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 flex justify-around p-4 border-t border-slate-800 z-50" },
            e('button', { onClick: () => setTab("record"), className: tab==="record"?"text-indigo-400":"" }, "⏺ AI Record"),
            e('button', { onClick: () => setTab("runs"), className: tab==="runs"?"text-indigo-400":"" }, "▶ Execution")
        )
    );
}

function Recorder() {
    const [frame, setFrame] = useState(null);
    const [status, setStatus] = useState("VM IDLE");
    const [text, setText] = useState("");
    const [zoom, setZoom] = useState(1);
    const ws = useRef(null);

    const start = async () => {
        setStatus("BOOTING...");
        const r = await API.post("/api/recordings", { project_id: "default", name: "Mobile_Session", start_url: "https://google.com" });
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${r.id}`);
        ws.current.onmessage = (ev) => {
            const m = JSON.parse(ev.data);
            if (m.type === "frame") { setFrame("data:image/jpeg;base64," + m.data); setStatus("LIVE"); }
        };
    };

    const send = (m) => ws.current?.send(JSON.stringify(m));

    return e('div', { className: "space-y-4" },
        e('div', { className: "flex gap-2" },
            e('button', { onClick: start, className: "flex-1 bg-emerald-600 p-3 rounded-lg font-bold" }, "POWER ON VM"),
            e('button', { onClick: () => send({type:"stop"}), className: "bg-red-600 px-4 rounded-lg" }, "SAVE")
        ),
        e('div', { className: "relative overflow-hidden rounded-lg bg-black border border-slate-800" },
            frame ? e('img', { src: frame, className: "vm-canvas", style:{transform:`scale(${zoom})`, transformOrigin:'top left'}, onClick: (evt) => {
                const r = evt.target.getBoundingClientRect();
                send({ type: "tap", x: Math.round(((evt.clientX - r.left)/zoom / r.width) * 1280), y: Math.round(((evt.clientY - r.top)/zoom / r.height) * 800) });
            }}) : e('div', { className: "vm-canvas flex items-center justify-center text-slate-800" }, status),
            e('div', { className: "absolute bottom-2 right-2 flex gap-1" },
                e('button', { onClick: () => setZoom(z => z + 0.1), className: "bg-slate-800/80 p-2 rounded" }, "🔍+"),
                e('button', { onClick: () => setZoom(z => z - 0.1), className: "bg-slate-800/80 p-2 rounded" }, "🔍-")
            )
        ),
        e('div', { className: "grid grid-cols-4 gap-1" },
            ["Tab", "Enter", "Backspace", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].map(k => 
                e('button', { key: k, className: "key-btn", onClick: () => send({type:"key", key: k}) }, k)
            )
        ),
        e('div', { className: "flex gap-2" },
            e('input', { className: "flex-1 bg-slate-800 p-3 rounded-lg text-white", value: text, onChange: ev => setText(ev.target.value), placeholder: "Remote Type..." }),
            e('button', { onClick: () => { send({type:"text", text}); setText(""); }, className: "bg-indigo-600 px-6 rounded-lg" }, "TYPE")
        )
    );
}

function Runs({ activeRunId, setActiveRunId }) {
    const [runs, setRuns] = useState([]);
    const [activeRun, setActiveRun] = useState(null);
    const [frame, setFrame] = useState(null);

    useEffect(() => {
        API.get("/api/runs").then(setRuns);
        if (activeRunId) {
            const proto = location.protocol === "https:" ? "wss" : "ws";
            const ws = new WebSocket(`${proto}://${location.host}/ws/runs/${activeRunId}`);
            ws.onmessage = (ev) => {
                const m = JSON.parse(ev.data);
                if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
                if (m.type === "step") setActiveRun(prev => ({...prev, ...m}));
                if (m.type === "done") API.get("/api/runs").then(setRuns);
            };
            return () => ws.close();
        }
    }, [activeRunId]);

    return e('div', { className: "space-y-4" },
        activeRunId && e('div', { className: "bg-slate-900 p-4 rounded-xl border-2 border-indigo-500" },
            e('div', { className: "flex justify-between mb-2 text-xs font-bold" }, e('span', {}, "LIVE EXECUTION"), e('button', {onClick:()=>setActiveRunId(null)}, "✕")),
            e('div', { className: "w-full bg-slate-800 h-2 rounded-full mb-3" }, e('div', { className: "bg-indigo-500 h-full progress-bar", style: {width: `${activeRun?.percent || 0}%`} })),
            e('img', { src: frame, className: "w-full rounded bg-black mb-3" }),
            e('div', { className: "text-[10px] font-mono text-indigo-300" }, activeRun?.label || "Awaiting steps...")
        ),
        runs.map(r => e('div', { key: r.id, className: "p-4 bg-slate-900 rounded-xl flex justify-between items-center" }, 
            e('div', {}, e('div', {className:"text-sm font-bold"}, `Run ${r.id.slice(0,8)}`), e('div', {className:"text-[10px] text-slate-500"}, r.created_at)),
            e('button', { onClick: () => setActiveRunId(r.id), className: "bg-indigo-600 px-4 py-1 rounded text-xs" }, "VIEW")
        ))
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
