<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: #020617; color: #f8fafc; font-family: sans-serif; }
  .canvas-img { image-rendering: auto; user-select: none; transition: transform 0.2s; }
</style>
</head>
<body>
<div id="root">
  <div style="padding: 40px; text-align: center;"><h2>⚡ Loading TestForge Enterprise...</h2></div>
</div>

<script>
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

const API = {
  async req(m, u, b) {
    const r = await fetch(u, { method: m,
      headers: { "Content-Type": "application/json" },
      body: b !== undefined ? JSON.stringify(b) : undefined });
    if (!r.ok) throw new Error((await r.text()).slice(0, 300));
    return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
  },
  get: (u) => API.req("GET", u),
  post: (u, b) => API.req("POST", u, b),
  patch: (u, b) => API.req("PATCH", u, b),
  del: (u) => API.req("DELETE", u),
};

function Badge(props) {
  return e('span', { className: `text-[10px] px-1.5 py-0.5 rounded ${props.color || "bg-slate-700"}` }, props.children);
}

function AiInput(props) {
  const [listening, setListening] = useState(false);
  const startVoice = () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) { alert("Speech recognition not supported."); return; }
    const rec = new SpeechRecognition();
    rec.onstart = () => setListening(true);
    rec.onend = () => setListening(false);
    rec.onresult = (ev) => props.onChange({ target: { value: (props.value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  const rephrase = async () => {
    if (!props.value) return;
    const res = await API.post("/api/ai/rephrase", { text: props.value });
    props.onChange({ target: { value: res.rephrased } });
  };
  return e('div', { className: "relative w-full" },
    props.isArea ? e('textarea', { ...props, className: `${props.className || ''} pr-20` }) : e('input', { ...props, className: `${props.className || ''} pr-20` }),
    e('div', { className: "absolute right-1 top-1.5 flex gap-1" },
      e('button', { type: "button", onClick: startVoice, className: `p-1 rounded text-xs ${listening ? 'bg-red-600 animate-pulse' : 'bg-slate-800 text-slate-300'}` }, "🎤"),
      e('button', { type: "button", onClick: rephrase, className: "p-1 rounded bg-purple-900 text-purple-200 text-xs" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("projects");
  const [projects, setProjects] = useState([]);
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || "null"));
  const [activeRunId, setActiveRunId] = useState(null);
  const [resumeRecId, setResumeRecId] = useState(null);

  const loadProjects = () => API.get("/api/projects").then(setProjects).catch(console.error);
  useEffect(() => { loadProjects(); }, []);

  const selectProject = (p) => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); };

  const startRunAndSwitch = async (type, id) => {
    const res = await API.post("/api/runs", { target_type: type, target_id: id });
    setActiveRunId(res.run_id);
    setTab("runs");
  };

  const tabs = [
    ["projects", "📁 Projects"], ["variables", "🔤 Variables"],
    ["record", "⏺ AI Record"], ["library", "📚 Library Tree"],
    ["runs", "▶ Live Execution & Window"], ["artifacts", "🎥 Artifacts"]
  ];

  return e('div', { className: "min-h-screen pb-20" },
    e('header', { className: "sticky top-0 z-10 bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center gap-2" },
      e('span', { className: "font-bold text-lg text-indigo-400" }, "⚡ TestForge AI"),
      activeProject && e(Badge, { color: "bg-indigo-700" }, activeProject.name)
    ),
    e('main', { className: "p-3 max-w-3xl mx-auto" },
      tab === "projects" && e(Projects, { projects, active: activeProject, onSelect: selectProject, onChanged: loadProjects }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject, resumeId: resumeRecId, onDone: () => { setResumeRecId(null); setTab("library"); } }),
      tab === "library" && e(Library, { project: activeProject, projects, onRun: startRunAndSwitch, onResume: (id) => { setResumeRecId(id); setTab("record"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "artifacts" && e(Artifacts, { project: activeProject })
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex overflow-x-auto z-20" },
      tabs.map(([k, label]) =>
        e('button', {
          key: k, onClick: () => setTab(k),
          className: `flex-1 py-3 text-xs whitespace-nowrap px-2 ${tab === k ? "text-indigo-400 border-t-2 border-indigo-400 font-bold" : "text-slate-400"}`
        }, label)
      )
    )
  );
}

function NeedProject() {
  return e('div', { className: "text-center text-slate-400 mt-16 bg-slate-900 p-6 rounded-lg border border-slate-800" },
    e('p', { className: "text-lg mb-2" }, "⚠️ Project Required"),
    e('p', { className: "text-xs text-slate-500" }, "Please create or select a project in the Projects tab first.")
  );
}

function Projects({ projects, active, onSelect, onChanged }) {
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const create = async () => {
    if (!name.trim()) return;
    const p = await API.post("/api/projects", { name, base_url: url });
    setName(""); setUrl(""); onChanged(); onSelect(p);
  };
  return e('div', { className: "space-y-3" },
    e('div', { className: "bg-slate-900 rounded-lg p-4 space-y-2 border border-slate-800" },
      e('h2', { className: "font-bold text-sm text-indigo-300" }, "📁 Create New Project (Neon DB Persisted)"),
      e(AiInput, { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Project Name", value: name, onChange: e => setName(e.target.value) }),
      e(AiInput, { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Base URL", value: url, onChange: e => setUrl(e.target.value) }),
      e('button', { onClick: create, className: "w-full bg-indigo-600 rounded py-2 font-semibold text-sm" }, "⚡ Create Project")
    ),
    projects.map(p =>
      e('div', { key: p.id, onClick: () => onSelect(p), className: `bg-slate-900 rounded-lg p-3 cursor-pointer border ${active?.id === p.id ? "border-indigo-500" : "border-slate-800"}` },
        e('div', { className: "font-semibold text-sm" }, p.name),
        e('div', { className: "text-xs text-slate-400" }, p.base_url)
      )
    )
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");
  const load = () => { if (!project) return; API.get(`/api/variables?project_id=${project.id}`).then(setVars); };
  useEffect(() => { load(); }, [project]);

  if (!project) return e(NeedProject);

  const add = async () => {
    if (!name.trim()) return;
    await API.post("/api/variables", { scope: "project", project_id: project.id, name, value: val });
    setName(""); setVal(""); load();
  };

  return e('div', { className: "space-y-3" },
    e('h2', { className: "font-bold text-sm" }, "🔤 Scoped Test Variables"),
    e('div', { className: "bg-slate-900 rounded-lg p-3 space-y-2 border border-slate-800" },
      e(AiInput, { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Variable Name", value: name, onChange: e => setName(e.target.value) }),
      e(AiInput, { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Value", value: val, onChange: e => setVal(e.target.value) }),
      e('button', { onClick: add, className: "w-full bg-indigo-600 rounded py-2 text-sm font-semibold" }, "+ Add Variable")
    ),
    vars.map(v =>
      e('div', { key: v.id, className: "bg-slate-900 rounded-lg p-3 border border-slate-800 flex justify-between text-xs" },
        e('div', {}, e('code', { className: "text-indigo-400 font-bold" }, `{{${v.name}}}`), e('span', { className: "text-slate-400 ml-2" }, `= ${v.value}`)),
        e('button', { onClick: async () => { await API.del(`/api/variables/${v.id}`); load(); }, className: "text-red-400 font-bold" }, "✕")
      )
    )
  );
}

function Recorder({ project, resumeId, onDone }) {
  const [name, setName] = useState("");
  const [url, setUrl] = useState(project?.base_url || "");
  const [recId, setRecId] = useState(resumeId || null);
  const [steps, setSteps] = useState([]);

  if (!project) return e(NeedProject);

  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: name || "AI Recording", start_url: url, shared: false });
    setSteps([]); setRecId(r.id);
  };

  if (recId) return e(LiveRecorder, { recId, project, steps, setSteps, onDone: () => { setRecId(null); onDone(); } });

  return e('div', { className: "space-y-3 bg-slate-900 p-4 rounded-lg border border-slate-800" },
    e('h2', { className: "font-bold text-sm text-indigo-300" }, resumeId ? "⏺ Resume / Continue Recording" : "⏺ AI-Powered Browser Recorder"),
    e(AiInput, { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Recording Name", value: name, onChange: e => setName(e.target.value) }),
    e(AiInput, { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Start URL", value: url, onChange: e => setUrl(e.target.value) }),
    e('button', { onClick: resumeId ? () => setRecId(resumeId) : start, className: "w-full bg-red-600 rounded py-2.5 font-bold text-sm" }, resumeId ? "▶ Resume Recording Session" : "● Launch Browser Recorder")
  );
}

function LiveRecorder({ recId, project, steps, setSteps, onDone }) {
  const [frame, setFrame] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [text, setText] = useState("");
  const [vars, setVars] = useState([]);
  const wsRef = useRef(null);

  useEffect(() => {
    API.get(`/api/variables?project_id=${project.id}`).then(setVars);
    API.get(`/api/recordings/${recId}`).then(r => setSteps(r.steps || []));
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/record/${recId}`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
      else if (m.type === "step") setSteps(s => [...s, m.step]);
      else if (m.type === "stopped") onDone();
    };
    wsRef.current = ws;
    return () => { try { ws.send(JSON.stringify({ type: "stop" })); } catch(_){} ws.close(); };
  }, [recId]);

  const send = (o) => { if (wsRef.current?.readyState === 1) wsRef.current.send(JSON.stringify(o)); };
  const tap = (evt) => {
    const r = evt.currentTarget.getBoundingClientRect();
    const x = (evt.clientX - r.left) / zoom;
    const y = (evt.clientY - r.top) / zoom;
    send({ type: "tap", x: Math.round(x / r.width * 1280), y: Math.round(y / r.height * 800) });
  };

  return e('div', { className: "space-y-2" },
    e('div', { className: "flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-800 text-xs" },
      e('span', { className: "w-2 h-2 rounded-full bg-red-500 animate-pulse" }),
      e('span', { className: "font-bold" }, "Recording / Resuming Active"),
      e('button', { onClick: () => send({ type: "stop" }), className: "ml-auto bg-red-700 font-bold px-3 py-1 rounded text-white" }, "⏹ Save & Close")
    ),
    e('div', { className: "bg-black rounded-lg overflow-auto border border-slate-700 max-h-[350px] flex justify-center" },
      frame ? e('img', { className: "canvas-img", style: { transform: `scale(${zoom})`, transformOrigin: "top left" }, src: frame, onClick: tap, draggable: "false" })
            : e('div', { className: "h-40 flex items-center justify-center text-slate-500 text-xs" }, "Connecting browser...")
    ),
    e('div', { className: "flex gap-1 flex-wrap" },
      vars.map(v => e('button', { key: v.id, onClick: () => setText(t => t + `{{${v.name}}}`), className: "bg-indigo-900/60 border border-indigo-700 text-indigo-200 text-[10px] px-2 py-0.5 rounded" }, `+ {{${v.name}}}`))
    ),
    e('div', { className: "flex gap-1" },
      e(AiInput, { className: "flex-1 bg-slate-800 rounded px-3 py-1.5 text-xs text-white", placeholder: "Type value or variables...", value: text, onChange: e => setText(e.target.value) }),
      e('button', { onClick: () => { if (text) { send({ type: "text", text }); setText(""); } }, className: "bg-indigo-600 px-3 py-1.5 rounded text-xs" }, "Type")
    ),
    e('div', { className: "bg-slate-900 rounded p-2 max-h-32 overflow-y-auto text-xs space-y-1" },
      e('div', { className: "font-bold text-indigo-400" }, `Recorded Steps (${steps.length}):`),
      steps.map((s, i) => e('div', { key: i, className: "py-0.5 border-b border-slate-800" }, `${s.order}. ${s.action} -> ${s.label || s.value || ''}`))
    )
  );
}

function Library({ project, projects, onRun, onResume }) {
  const [recs, setRecs] = useState([]);
  const [selectedRec, setSelectedRec] = useState(null);
  const [childName, setChildName] = useState("");

  const load = () => project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs);
  useEffect(() => { load(); }, [project]);

  if (!project) return e(NeedProject);

  const addChildChunk = async (parentId) => {
    if (!childName.trim()) return;
    await API.post("/api/recordings", { project_id: project.id, parent_id: parentId, name: childName, start_url: project.base_url || "https://example.com" });
    setChildName(""); load();
  };

  const topLevel = recs.filter(r => !r.parent_id);

  return e('div', { className: "space-y-3" },
    e('h2', { className: "font-bold text-sm" }, "📚 Hierarchical Recording Library Tree"),
    selectedRec && e('div', { className: "bg-slate-900 p-3 rounded-lg border border-indigo-700 space-y-2 text-xs" },
      e('div', { className: "flex justify-between items-center font-bold text-indigo-300" },
        e('span', {}, `Recording Details: ${selectedRec.name}`),
        e('button', { onClick: () => setSelectedRec(null), className: "bg-slate-800 px-2 py-1 rounded text-[10px]" }, "Close")
      ),
      e('div', { className: "text-slate-400" }, `Start URL: ${selectedRec.start_url}`),
      e('div', { className: "flex gap-2 flex-wrap pt-1" },
        e('button', { onClick: () => onResume(selectedRec.id), className: "bg-red-700 px-3 py-1.5 rounded font-bold text-white" }, "▶ Continue / Resume Recording"),
        e('button', { onClick: () => onRun("recording", selectedRec.id), className: "bg-emerald-600 px-3 py-1.5 rounded font-bold text-white" }, "▶ Execute Run"),
        e('a', { href: `/api/recordings/${selectedRec.id}/export/jenkins`, className: "bg-amber-800 px-3 py-1.5 rounded font-bold text-white" }, "🥒 Jenkins Feature")
      ),
      e('div', { className: "pt-2 border-t border-slate-800 space-y-1" },
        e('div', { className: "font-bold text-slate-300" }, "Add Sub-Recording Chunk (Group Tree):"),
        e('div', { className: "flex gap-1" },
          e('input', { className: "flex-1 bg-slate-800 rounded px-2 py-1 text-white", placeholder: "Sub-chunk name (e.g. Option 2)", value: childName, onChange: e => setChildName(e.target.value) }),
          e('button', { onClick: () => addChildChunk(selectedRec.id), className: "bg-indigo-600 px-3 py-1 rounded" }, "+ Add Chunk")
        )
      )
    ),
    topLevel.map(r => {
      const children = recs.filter(c => c.parent_id === r.id);
      return e('div', { key: r.id, className: "bg-slate-900 rounded-lg p-3 border border-slate-800 space-y-2 text-xs" },
        e('div', { className: "flex justify-between items-center" },
          e('div', { className: "font-semibold cursor-pointer text-indigo-300 hover:underline", onClick: () => setSelectedRec(r) }, `🌳 Group: ${r.name} (${r.step_count} steps)`),
          e('button', { onClick: () => onResume(r.id), className: "bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded font-bold text-indigo-300" }, "➕ Resume / Edit")
        ),
        children.map(c =>
          e('div', { key: c.id, className: "ml-4 pl-3 border-l-2 border-indigo-600 flex justify-between items-center py-1" },
            e('span', { className: "cursor-pointer text-slate-300 hover:underline", onClick: () => setSelectedRec(c) }, `↳ 📂 Sub-Chunk: ${c.name} (${c.step_count} steps)`),
            e('button', { onClick: () => onResume(c.id), className: "bg-slate-800 px-2 py-0.5 rounded text-[10px]" }, "Edit")
          )
        )
      );
    })
  );
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState(null);
  const [execFrame, setExecFrame] = useState(null);
  const [zoom, setZoom] = useState(1);

  const load = () => API.get("/api/runs").then(setRuns).catch(() => {});
  useEffect(() => { load(); const t = setInterval(load, 3000); return () => clearInterval(t); }, []);

  useEffect(() => {
    if (runId) {
      setExecFrame(null);
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === "snapshot" && m.run) setActiveLog(m.run);
        else if (m.type === "frame") setExecFrame("data:image/jpeg;base64," + m.data);
        else if (m.type === "done") load();
      };
      return () => ws.close();
    }
  }, [runId]);

  return e('div', { className: "space-y-3" },
    e('h2', { className: "font-bold text-sm" }, "▶ Live Execution Window & Step Progress"),
    runId && activeLog && e('div', { className: "bg-indigo-950/60 border border-indigo-700 p-3 rounded-lg space-y-2 text-xs" },
      e('div', { className: "flex justify-between items-center font-bold text-indigo-300" },
        e('span', {}, `Active Run: ${runId.slice(0,8)}... (${activeLog.status.toUpperCase()})`),
        e('div', { className: "flex gap-1" },
          e('button', { onClick: () => setZoom(z => Math.max(1, z - 0.25)), className: "bg-slate-800 px-2 py-0.5 rounded text-[10px]" }, "🔍-"),
          e('button', { onClick: () => setZoom(z => Math.min(2, z + 0.25)), className: "bg-slate-800 px-2 py-0.5 rounded text-[10px]" }, "🔍+"),
          e('button', { onClick: () => setRunId(null), className: "bg-slate-800 px-2 py-1 rounded text-[10px]" }, "Close")
        )
      ),
      // LIVE EXECUTION SCREENCAST WINDOW
      e('div', { className: "bg-black rounded-lg overflow-auto border border-slate-700 max-h-[300px] flex justify-center" },
        execFrame ? e('img', { className: "canvas-img", style: { transform: `scale(${zoom})`, transformOrigin: "top left" }, src: execFrame, draggable: "false" })
                  : e('div', { className: "h-32 flex items-center justify-center text-slate-400 text-xs" }, "Executing test steps live...")
      ),
      e('div', { className: "space-y-2 pt-2" },
        (activeLog.log || []).map((step, i) =>
          e('div', { key: i, className: "bg-slate-900 p-2 rounded border border-slate-800 space-y-1" },
            e('div', { className: "flex items-center gap-2 font-bold" },
              e('span', {}, step.status === "passed" ? "✅" : step.status === "failed" ? "❌" : "⏳"),
              e('span', { className: "text-indigo-300" }, `Step ${step.order}: ${step.action}`),
              e('span', { className: "text-slate-400 text-[10px] ml-auto" }, step.label)
            ),
            step.screenshot && e('div', { className: "mt-1" },
              e('img', { src: step.screenshot, className: "rounded border border-slate-700 max-h-40 w-full object-cover", alt: "Step validation screenshot" })
            )
          )
        )
      )
    ),
    e('div', { className: "space-y-2 pt-2" },
      e('h3', { className: "text-xs font-bold text-slate-400" }, "Execution History"),
      runs.map(r =>
        e('div', { key: r.id, onClick: () => setRunId(r.id), className: "bg-slate-900 p-3 rounded-lg border border-slate-800 text-xs flex justify-between items-center cursor-pointer hover:border-indigo-500" },
          e('div', {},
            e('span', { className: `font-bold px-2 py-0.5 rounded mr-2 ${r.status === 'passed' ? 'bg-emerald-900 text-emerald-200' : 'bg-red-900 text-red-200'}` }, r.status.toUpperCase()),
            e('span', { className: "text-slate-300" }, `${r.target_type} (${r.target_id.slice(0,6)}...)`)
          ),
          e('span', { className: "text-slate-500 text-[10px]" }, r.created_at.slice(11, 19))
        )
      )
    )
  );
}

function Artifacts() {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns).catch(() => {}); }, []);

  return e('div', { className: "space-y-3" },
    e('h2', { className: "font-bold text-sm" }, "🎥 Screen Recordings & Artifacts"),
    runs.filter(r => r.has_video).length === 0 && e('p', { className: "text-xs text-slate-500 italic" }, "No screen recordings yet."),
    runs.filter(r => r.has_video).map(r =>
      e('div', { key: r.id, className: "bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-2 text-xs" },
        e('div', { className: "flex justify-between items-center" },
          e('span', { className: "font-bold text-indigo-400" }, `Session: ${r.id.slice(0,8)}...`),
          e('span', { className: "text-slate-400 text-[10px]" }, r.created_at)
        ),
        e('video', { controls: true, playsInline: true, className: "w-full rounded border border-slate-700 bg-black", src: `/api/runs/video/${r.id}` })
      )
    )
  );
}
