<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge Titan ERP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; width: 100vw; }
  .nav-btn { flex: 1; padding: 12px; font-size: 11px; font-weight: bold; color: #64748b; border-top: 2px solid transparent; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .content-area { height: calc(100vh - 75px); overflow-y: auto; padding: 15px; padding-bottom: 90px; }
  .canvas-window { background: #000; border: 2px solid #1e293b; border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; }
  .progress-bar { height: 100%; background: #6366f1; transition: width 0.4s ease; box-shadow: 0 0 15px #6366f1; }
  .key-btn { background: #1e293b; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #334155; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;
async function apiRequest(url, options = {}) {
  const response = await fetch(url, options);
  let payload = null;
  try { payload = await response.json(); } catch (_) {}
  if (!response.ok) {
    const detail = payload && (payload.detail || payload.message);
    throw new Error(detail || `Request failed (${response.status})`);
  }
  return payload;
}
const API = {
  get: u => apiRequest(u),
  post: (u, b) => apiRequest(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  patch: (u, b) => apiRequest(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  del: u => apiRequest(u, {method:'DELETE'})
};

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => setMic(true); rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20 border border-slate-700", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: async () => { const res = await API.post("/api/ai/rephrase", { text: value }); onChange({ target: { value: res.rephrased } }); }, className: "p-1 rounded bg-purple-900" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);
  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["github","🐙"]];

  return e('div', { className: "h-full flex flex-col" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between bg-slate-950/80 backdrop-blur" },
      e('span', { className: "font-bold text-indigo-400 tracking-tighter" }, "⚡ TITAN ROG ERP"),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('div', { className: "content-area" },
      tab === "projects" && e(Projects, { setActiveProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "comparison" && e(Comparison), tab === "artifacts" && e(Artifacts), tab === "github" && e(Github)
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [zoom, setZoom] = useState(1);
  const ws = useRef(null);

  if (!project) return e('div', {className:"py-20 text-center text-slate-500 font-bold"}, "SELECT PROJECT TO BEGIN");

  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: "ERP_Session", start_url: project.base_url || "https://google.com" });
    setRecId(r.id);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${r.id}`);
    ws.current.onmessage = ev => { const m = JSON.parse(ev.data); if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data); };
  };

  if (recId) return e('div', { className: "fixed inset-0 bg-slate-950 z-[100] flex flex-col p-2" },
    e('div', { className: "flex justify-between p-2" }, e('span', {className:"text-xs font-bold text-red-500 animate-pulse"}, "● ROG RECORDING"), e('button', { onClick:()=> { ws.current.send(JSON.stringify({type:"stop"})); setRecId(null); }, className:"bg-red-600 px-4 py-1 rounded font-bold text-xs" }, "SAVE")),
    e('div', { className: "flex-1 overflow-auto bg-black rounded-2xl relative border-2 border-slate-800" }, frame && e('img', { src: frame, className: "origin-top-left", style: { transform: `scale(${zoom})` }, onClick: (evt) => {
        const r = evt.target.getBoundingClientRect();
        ws.current.send(JSON.stringify({ type: "tap", x: Math.round(((evt.clientX - r.left)/zoom / r.width) * 1280), y: Math.round(((evt.clientY - r.top)/zoom / r.height) * 800) }));
    }})),
    e('div', { className: "bg-slate-900 p-2 space-y-2 rounded-b-xl" },
      e('div', { className: "grid grid-cols-4 gap-1" }, ["Enter", "Tab", "Backspace", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].map(k => e('button', { key: k, className: "key-btn", onClick: () => ws.current.send(JSON.stringify({type:"key", key: k})) }, k))),
      e('div', { className: "flex gap-2" }, e('input', { className: "flex-1 bg-slate-800 p-2 rounded text-sm", placeholder: "Remote Text Type..." }), e('button', { className: "bg-indigo-600 px-4 rounded" }, "Type"))
    )
  );
  return e('button', { onClick: start, className: "w-full bg-red-600 py-10 rounded-3xl font-bold text-xl shadow-2xl" }, "● START AI RECORDING");
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);

  const load = () => API.get("/api/runs").then(setRuns);
  useEffect(() => { load(); const t = setInterval(load, 5000); return () => clearInterval(t); }, []);

  useEffect(() => {
    if (runId) {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);
        if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
        if (m.percent !== undefined) setPercent(m.percent);
        if (m.status) setActiveLog(prev => [...prev.filter(x => x.order !== m.order), m]);
      };
      return () => ws.close();
    }
  }, [runId]);

  return e('div', { className: "space-y-4" },
    runId && e('div', { className: "bg-slate-900 border-2 border-indigo-500 rounded-3xl p-5 shadow-2xl" },
      e('div', { className: "flex justify-between font-bold text-xs" }, e('span', {}, "AI EXECUTION PROGRESS"), e('span', {}, `${percent}%`)),
      e('div', { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-2" }, e('div', { className: "progress-fill", style: { width: `${percent}%` } })),
      e('img', { src: frame, className: "w-full rounded-xl bg-black mt-3 border border-slate-800" }),
      e('div', { className: "max-h-40 overflow-y-auto mt-3 space-y-1" }, activeLog.sort((a,b)=>b.order-a.order).map((s,i) => e('div', {key:i, className:"text-[10px] p-2 bg-slate-950 rounded flex justify-between border border-slate-900"}, e('span',{},s.label), e('span',{},s.status==='passed'?'✅':'⏳'))))
    ),
    runs.map(r => e('div', { key: r.id, onClick: () => setRunId(r.id), className: "p-4 bg-slate-900 rounded-2xl border border-slate-800 mb-2" },
      e('div', {className:"flex justify-between items-center"}, e('span', {className:"font-bold text-indigo-400 text-xs font-mono"}, `RUN #${r.id.slice(0,8)}`), e('span', {className:"text-[10px] uppercase font-bold text-slate-500"}, r.status)),
      r.rog_monitor_log && e('div', {className:"text-[9px] bg-red-950/20 p-2 mt-2 rounded border border-red-900/30 text-red-200 font-mono"}, r.rog_monitor_log)
    ))
  );
}

function Library({ project, onRun }) {
  const [recs, setRecs] = useState([]);
  useEffect(() => { project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs); }, [project]);
  return e('div', { className: "space-y-4" }, recs.map(r => e('div', { key: r.id, className: "p-5 bg-slate-900 rounded-2xl border border-slate-800 flex justify-between shadow-xl" },
    e('div', {}, e('div', {className:"font-bold text-indigo-300"}, r.name), e('div', {className:"text-[10px] text-slate-500 font-mono uppercase tracking-tighter"}, `Tree Root: ${r.id.slice(0,8)}`)),
    e('div', {className:"flex gap-2"},
      e('a', { href: `/api/recordings/${r.id}/jenkins`, className: "bg-slate-800 p-2 rounded text-[10px]" }, "🥒"),
      e('button', { onClick: () => onRun(r.id), className: "bg-emerald-600 px-6 py-2 rounded-xl font-bold text-xs" }, "RUN")
    )
  )));
}

function Projects({ setActiveProject }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  const [baseUrl, setBaseUrl] = useState("");
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");

  const load = async () => {
    setLoading(true);
    try {
      const result = await API.get("/api/projects");
      setProjs(Array.isArray(result) ? result : []);
      setError("");
    } catch (err) {
      setError(`Unable to load projects: ${err.message}`);
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => { load(); }, []);

  const create = async (event) => {
    event.preventDefault();
    if (!name.trim()) {
      setError("Enter a project name before creating it.");
      return;
    }
    setSaving(true);
    setError("");
    setNotice("");
    try {
      const project = await API.post("/api/projects", {
        name: name.trim(),
        base_url: baseUrl.trim()
      });
      setProjs(prev => [project, ...prev.filter(item => item.id !== project.id)]);
      setName("");
      setBaseUrl("");
      setNotice(`Project “${project.name}” created.`);
    } catch (err) {
      setError(`Could not create project: ${err.message}`);
    } finally {
      setSaving(false);
    }
  };

  return e('div', { className: "space-y-4" },
    e('form', { onSubmit: create, className: "bg-slate-900 p-6 rounded-3xl border border-slate-800" },
      e('h2', { className: "font-bold text-lg text-indigo-300 mb-4" }, "Create a test project"),
      e('label', { className: "block text-xs text-slate-400 mb-1", htmlFor: "project-name" }, "Project name"),
      e('input', { id: "project-name", required: true, maxLength: 200, value: name, onChange: evt => setName(evt.target.value), placeholder: "e.g. Customer Portal", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e('label', { className: "block text-xs text-slate-400 mt-3 mb-1", htmlFor: "project-url" }, "Application URL (optional)"),
      e('input', { id: "project-url", type: "url", maxLength: 500, value: baseUrl, onChange: evt => setBaseUrl(evt.target.value), placeholder: "https://example.com", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e('button', { type: "submit", disabled: saving, className: "w-full bg-indigo-600 disabled:opacity-60 mt-4 py-3 rounded-xl font-bold shadow-xl" }, saving ? "CREATING…" : "CREATE PROJECT"),
      error && e('p', { role: "alert", className: "mt-3 text-sm text-red-300" }, error),
      notice && e('p', { role: "status", className: "mt-3 text-sm text-emerald-300" }, notice)
    ),
    loading && e('p', { className: "text-sm text-slate-400" }, "Loading projects…"),
    !loading && projs.length === 0 && e('p', { className: "text-sm text-slate-500 text-center py-6" }, "No projects yet. Create one above to get started."),
    projs.map(p => e('div', { key: p.id, onClick: () => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); }, className: "p-5 bg-slate-900 rounded-3xl border border-slate-800 mb-3 shadow-md hover:border-indigo-500 transition-all cursor-pointer font-bold text-sm" },
      e('div', {}, p.name),
      p.base_url && e('div', { className: "text-[10px] text-slate-500 font-normal mt-1" }, p.base_url)
    ))
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");
  const load = () => project && API.get(`/api/variables?project_id=${project.id}`).then(setVars);
  useEffect(() => { load(); }, [project]);
  if (!project) return e('div', {className:"py-20 text-center text-slate-500"}, "SELECT PROJECT FIRST");
  return e('div', { className: "space-y-4" },
    e('div', { className: "bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg" },
      e(AiInput, { value: name, onChange: e => setName(e.target.value), placeholder: "Key" }), e('div', {className:"h-2"}),
      e(AiInput, { value: val, onChange: e => setVal(e.target.value), placeholder: "Value" }),
      e('button', { onClick: async () => { await API.post("/api/variables", { project_id: project.id, name, value: val }); setName(""); setVal(""); load(); }, className: "w-full bg-indigo-600 mt-3 py-2 rounded-lg font-bold" }, "SAVE VARIABLE")
    ),
    vars.map(v => e('div', { key: v.id, className: "p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-2 shadow-inner" },
      e('div', { className: "flex justify-between" }, e('code', {className:"text-indigo-400 font-bold"}, `{{${v.name}}}`), e('button', { onClick: async () => { await API.del(`/api/variables/${v.id}`); load(); }, className: "text-red-500" }, "✕")),
      e('div', { className: "text-[10px] text-slate-500 font-bold" }, "ASSOCIATED RECORDINGS: " + (v.tags?.join(", ") || "None")),
      e('input', { className: "w-full bg-slate-950 p-2 rounded text-xs text-slate-300 border border-slate-800", value: v.value, onChange: async (evt) => { await API.patch(`/api/variables/${v.id}`, {value: evt.target.value}); load(); } })
    ))
  );
}

function Comparison() {
  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" },
    runs.map(r => e('div', { key: r.id, className: "bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl" },
      e('div', { className: "p-4 flex justify-between bg-slate-800/30", onClick: () => setSel(sel === r.id ? null : r.id) }, e('span', {className:"font-bold"}, `ERP Audit: ${r.id.slice(0,8)}`), e('span', {className:"text-indigo-400 font-bold text-xs"}, "SPLIT ➔")),
      sel === r.id && e('div', { className: "grid grid-cols-2 gap-2 p-3 bg-black/40 border-t border-slate-800" },
        e('div', { className: "space-y-1 pr-1 border-r border-slate-800" }, e('div', {className:"text-[9px] font-bold text-purple-400 uppercase text-center mb-1"}, "BASELINE"), (r.baseline || []).map((s, i) => e('div', {key:i, className:"text-[9px] bg-slate-900 p-2 rounded border border-purple-900/10"}, `${s.action}`))),
        e('div', { className: "space-y-1 pl-1" }, e('div', {className:"text-[9px] font-bold text-emerald-400 uppercase text-center mb-1"}, "ACTUAL"), (r.log || []).map((s, i) => e('div', {key:i, className:"text-[9px] bg-slate-900 p-2 rounded border border-emerald-900/10"}, e('div',{},s.action), s.screenshot && e('img', {src:s.screenshot, className:"mt-1 rounded"}))))
      )
    ))
  );
}

function Artifacts() {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" }, runs.filter(r => r.video_path).map(r => e('div', { key: r.id, className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-2xl" }, e('video', { controls: true, className: "w-full rounded-2xl bg-black shadow-inner", src: `/api/runs/video/${r.id}` }))));
}

function Github() {
  const repositoryUrl = "https://github.com/Raheelatta1984/testforge";
  return e('div', { className: "text-center py-16 px-5 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl space-y-5" },
    e('div', {className:"text-6xl"}, "🐙"),
    e('h2', {className:"font-bold text-xl text-indigo-300"}, "GITHUB & SYNC"),
    e('p', {className:"text-sm text-slate-400"}, "Open the TestForge source repository on GitHub. TestForge projects are stored separately and are not imported from this code repository."),
    e('a', { href: repositoryUrl, target: "_blank", rel: "noopener noreferrer", className: "inline-block bg-slate-700 px-8 py-3 rounded-2xl font-bold" }, "OPEN SOURCE REPOSITORY"),
    e('div', {}, e('a', { href: "/api/sync/github", className: "inline-block bg-indigo-600 px-8 py-3 rounded-2xl font-bold shadow-xl shadow-indigo-900/30" }, "DOWNLOAD SYNC PACKAGE"))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
