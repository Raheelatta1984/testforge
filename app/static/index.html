<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge Titan ERP - Optimized</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; width: 100vw; }
  .nav-btn { flex: 1; padding: 12px; font-size: 11px; font-weight: bold; color: #64748b; border-top: 2px solid transparent; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .content-area { height: calc(100vh - 75px); overflow-y: auto; padding: 15px; padding-bottom: 90px; }
  .canvas-window { background: #000; border: 2px solid #1e293b; border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; }
  .progress-bar { height: 100%; background: #6366f1; transition: width 0.4s ease; box-shadow: 0 0 15px #6366f1; }
  .key-btn { background: #1e293b; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #334155; }
  .browser-shell { background: #020617; border: 2px solid #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 240px; }
  .browser-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #0f172a; border-bottom: 1px solid #1e293b; }
  .browser-url { flex: 1; font-size: 11px; color: #cbd5e1; background: #020617; border-radius: 999px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  .dot.red { background: #ef4444; } .dot.yellow { background: #eab308; } .dot.green { background: #22c55e; }
  .browser-viewport { position: relative; background: #000; min-height: 200px; }
  .browser-viewport img { width: 100%; height: auto; display: block; cursor: crosshair; user-select: none; -webkit-user-drag: none; }
  .browser-wait { min-height: 180px; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 24px; font-size: 13px; background: #000; }
  .fast-badge { background: linear-gradient(90deg, #22c55e, #16a34a); color: white; font-size: 8px; padding: 2px 6px; border-radius: 999px; font-weight: bold; }
  .var-chip { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; padding: 2px 8px; border-radius: 999px; font-size: 10px; cursor: pointer; }
  .var-chip:hover { background: #312e81; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;
async function apiRequest(url, options = {}) {
  const response = await fetch(url, options);
  let payload = null;
  const text = await response.text();
  try { payload = JSON.parse(text); } catch (_) { payload = text; }
  if (!response.ok) {
    const detail = payload && (payload.detail || payload.message || payload);
    throw new Error(typeof detail === 'string' ? detail : `Request failed (${response.status})`);
  }
  return payload;
}
const API = {
  get: u => apiRequest(u),
  post: (u, b) => apiRequest(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  patch: (u, b) => apiRequest(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  del: u => apiRequest(u, {method:'DELETE'})
};

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => setMic(true); rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20 border border-slate-700", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: async () => { const res = await API.post("/api/ai/rephrase", { text: value }); onChange({ target: { value: res.rephrased } }); }, className: "p-1 rounded bg-purple-900" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);
  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["github","🐙"]];

  return e('div', { className: "h-full flex flex-col" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between bg-slate-950/80 backdrop-blur" },
      e('div', { className: "flex items-center gap-2" },
        e('span', { className: "font-bold text-indigo-400 tracking-tighter" }, "⚡ TITAN ROG ERP"),
        e('span', { className: "fast-badge" }, "FAST ⚡")
      ),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('div', { className: "content-area" },
      tab === "projects" && e(Projects, { setActiveProject, activeProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "comparison" && e(Comparison), tab === "artifacts" && e(Artifacts), tab === "github" && e(Github)
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [status, setStatus] = useState("");
  const [error, setError] = useState("");
  const [steps, setSteps] = useState([]);
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [varsList, setVarsList] = useState([]);
  const recRef = useRef(null);
  const frameUrl = useRef(null);

  useEffect(() => {
    if (!project) return;
    setUrl(prev => prev || project.base_url || "");
    setName(prev => prev || ("Session " + new Date().toLocaleString()));
    // Load variables for reuse in recording tab (requirement 2)
    API.get(`/api/projects/${project.id}/variables`).then(data => {
      setVarsList(data.variables || []);
    }).catch(() => {});
  }, [project]);
  useEffect(() => { recRef.current = recId; }, [recId]);
  useEffect(() => () => {
    const id = recRef.current;
    if (id) fetch("/api/recordings/" + id + "/stop", { method: "POST" }).catch(() => {});
  }, []);
  useEffect(() => {
    if (!recId) return undefined;
    let stop = false;
    const tick = async () => {
      if (stop) return;
      try {
        const session = await API.get("/api/recordings/" + recId + "/session");
        if (session.error) { setError(session.error); setStatus("Browser error"); }
        else if (session.status === "live") setStatus("Browser live ⚡ FAST");
        else if (session.status === "starting") setStatus("Launching browser… FAST");
        const res = await fetch("/api/recordings/" + recId + "/frame?t=" + Date.now());
        if (res.ok && (res.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await res.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
          if (!session.error) { setStatus("Browser live ⚡ FAST"); setError(""); }
        } else if (res.status !== 204) {
          let detail = "Browser unavailable (" + res.status + ")";
          try { const payload = await res.json(); detail = payload.detail || detail; } catch (_) {}
          setError(detail);
          setStatus("Browser error");
        }
      } catch (err) { setError(err.message); }
      if (!stop) setTimeout(tick, 150); // Faster polling for super fast feel (was 400)
    };
    tick();
    return () => { stop = true; };
  }, [recId]);

  if (!project) return e("div", { className: "py-20 text-center text-slate-500 font-bold" }, "SELECT A PROJECT TO BEGIN");

  const send = async (msg) => {
    try {
      const res = await API.post("/api/recordings/" + recId + "/input", msg);
      if (res.step) {
        // Handle dedup display
        if (res.dedup) {
          // Update existing step instead of adding new
          setSteps(prev => {
            const last = prev[prev.length - 1];
            if (last && last.id === res.step.id) {
              return [...prev.slice(0, -1), res.step];
            }
            return prev.concat([res.step]);
          });
        } else {
          setSteps(prev => prev.concat([res.step]));
        }
      }
      setError("");
    } catch (err) { setError(err.message); }
  };
  const start = async () => {
    setBusy(true); setError("");
    try {
      const recording = await API.post("/api/recordings", {
        project_id: project.id,
        name: (name || "Session").trim(),
        start_url: (url || "").trim() || "/demo.html"
      });
      setSteps([]); setFrame(null); setStatus("Launching browser… FAST ⚡"); setRecId(recording.id);
      await API.post("/api/recordings/" + recording.id + "/session", {});
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  };
  const stop = async () => {
    const id = recId;
    recRef.current = null;
    if (!id) { setRecId(null); setFrame(null); setStatus(""); return; }
    setStatus("Saving to GitHub main… ⚡");
    try {
      const result = await API.post("/api/recordings/" + id + "/stop", {});
      if (result.publish_error) {
        setError(`Saved locally, push to main retrying: ${result.publish_error}`);
      } else {
        setError("");
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setRecId(null); setFrame(null); setStatus("");
    }
  };

  const insertVariable = (varName) => {
    const placeholder = `{{${varName}}}`;
    setText(prev => prev + placeholder);
  };

  if (recId) return e("div", { className: "fixed inset-0 bg-slate-950 z-[100] flex flex-col p-2 gap-2" },
    e("div", { className: "flex justify-between items-center px-1" },
      e("span", { className: "text-xs font-bold " + (status.includes("live") ? "text-emerald-400" : "text-red-400") }, status === "Browser live ⚡ FAST" ? "● BROWSER LIVE ⚡ FAST" : "● " + (status || "RECORDING")),
      e("button", { onClick: stop, className: "bg-red-600 px-4 py-1 rounded font-bold text-xs" }, "SAVE TO MAIN")
    ),
    error && e("p", { role: "alert", className: "text-sm text-red-300 px-1" }, error),
    e("div", { className: "browser-shell flex-1 min-h-0" },
      e("div", { className: "browser-bar" },
        e("span", { className: "dot red" }), e("span", { className: "dot yellow" }), e("span", { className: "dot green" }),
        e("span", { className: "browser-url" }, url || "/demo.html"),
        e("span", { className: "fast-badge ml-2" }, "FAST")
      ),
      e("div", { className: "browser-viewport flex-1 overflow-auto" },
        frame
          ? e("img", {
              src: frame, alt: "Remote browser", draggable: false,
              onClick: (evt) => {
                const img = evt.target;
                const rect = img.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const x = Math.round((evt.clientX - rect.left) / rect.width * (img.naturalWidth || 1024));
                const y = Math.round((evt.clientY - rect.top) / rect.height * (img.naturalHeight || 640));
                send({ type: "tap", x: x, y: y });
              }
            })
          : e("div", { className: "browser-wait" }, error || status || "Starting the remote browser FAST…")
      )
    ),
    varsList.length > 0 && e("div", { className: "flex gap-1 flex-wrap px-1" },
      e("span", { className: "text-[10px] text-slate-500" }, "Variables:"),
      varsList.map(v => e("button", { key: v.id, onClick: () => insertVariable(v.name), className: "var-chip" }, `{{${v.name}}}`))
    ),
    steps.length > 0 && e("div", { className: "max-h-20 overflow-y-auto text-[10px] text-slate-400 px-1" },
      steps.map(step => e("div", { key: step.id || step.order, className: "flex justify-between" },
        e("span", {}, `${step.order}. ${step.label || step.action}`),
        step.repeat > 1 && e("span", { className: "text-emerald-400 font-bold" }, `×${step.repeat} 🔁`)
      ))
    ),
    e("div", { className: "bg-slate-900 p-2 space-y-2 rounded-xl" },
      e("div", { className: "grid grid-cols-4 gap-1" },
        ["Enter", "Tab", "Backspace", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].map(key =>
          e("button", { key: key, className: "key-btn", onClick: () => send({ type: "key", key: key }) }, key))
      ),
      e("div", { className: "flex gap-2" },
        e("input", {
          className: "flex-1 bg-slate-800 p-2 rounded text-sm", placeholder: "Type text or {{variable}}…", value: text,
          onChange: (evt) => setText(evt.target.value),
          onKeyDown: (evt) => { if (evt.key === "Enter" && text) { send({ type: "text", text: text }); setText(""); } }
        }),
        e("button", { className: "bg-indigo-600 px-4 rounded font-bold text-sm", onClick: () => { if (text) { send({ type: "text", text: text }); setText(""); } } }, "Type")
      ),
      e("p", { className: "text-[9px] text-slate-500" }, "💡 Repeated steps auto-compress to 'follow last steps x times' ⚡")
    )
  );

  return e("div", { className: "space-y-4" },
    e("div", { className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3" },
      e("div", { className: "flex justify-between items-center" },
        e("h2", { className: "font-bold text-lg text-indigo-300" }, "Record in remote browser ⚡ FAST"),
        e("span", { className: "fast-badge" }, "OPTIMIZED")
      ),
      e("p", { className: "text-sm text-slate-400" }, "Opens Chromium on server (free-tier optimized, low CPU). SAVE pushes immediately to GitHub main with description. Repeated steps auto-dedup."),
      varsList.length > 0 && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800" },
        e("div", { className: "text-xs font-bold text-indigo-300 mb-2" }, `📦 ${varsList.length} Variables available for reuse:`),
        e("div", { className: "flex flex-wrap gap-1" },
          varsList.map(v => e("button", { key: v.id, onClick: () => insertVariable(v.name), className: "var-chip", title: `${v.name} = ${v.value}` }, `{{${v.name}}}`))
        ),
        e("p", { className: "text-[9px] text-slate-500 mt-2" }, "Click to insert into type field")
      ),
      e("label", { className: "block text-xs text-slate-400", htmlFor: "rec-name" }, "Recording name"),
      e("input", { id: "rec-name", value: name, onChange: (evt) => setName(evt.target.value), className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e("label", { className: "block text-xs text-slate-400", htmlFor: "rec-url" }, "Page to open"),
      e("input", { id: "rec-url", value: url, onChange: (evt) => setUrl(evt.target.value), placeholder: "Leave blank for sample app", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e("button", { type: "button", onClick: () => setUrl("/demo.html"), className: "text-xs text-indigo-300 underline" }, "Use sample app"),
      e("button", { type: "button", onClick: start, disabled: busy, className: "w-full bg-red-600 disabled:opacity-60 py-4 rounded-2xl font-bold text-lg" }, busy ? "OPENING BROWSER FAST…" : "● START AI RECORDING ⚡"),
      error && e("p", { role: "alert", className: "text-sm text-red-300" }, error)
    )
  );
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);
  const [runStatus, setRunStatus] = useState("");
  const [runError, setRunError] = useState("");
  const [queueInfo, setQueueInfo] = useState(null);
  const frameUrl = useRef(null);

  const load = () => API.get("/api/runs").then(setRuns).catch(() => {});
  const loadQueue = () => API.get("/api/runs/queue/status").then(setQueueInfo).catch(() => {});
  useEffect(() => { load(); loadQueue(); const t = setInterval(() => { load(); loadQueue(); }, 3000); return () => clearInterval(t); }, []);

  useEffect(() => {
    if (!runId) return undefined;
    setActiveLog([]); setPercent(0); setRunStatus("queued"); setRunError(""); setFrame(null);
    let stop = false;
    const ws = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws/runs/" + runId);
    ws.onmessage = (ev) => {
      const message = JSON.parse(ev.data);
      if (message.type === "frame" && message.data) setFrame("data:image/jpeg;base64," + message.data);
      if (message.percent !== undefined) setPercent(message.percent);
      if (message.type === "done") {
        setRunStatus(message.status || "done");
        if (message.error) setRunError(message.error);
        load();
      } else if (message.status && (message.order !== undefined || message.type === "status")) {
        if (message.type === "status") {
          setRunStatus(message.status);
          setPercent(message.percent || 0);
        } else {
          setActiveLog(prev => prev.filter(item => item.order !== message.order).concat([message]));
        }
      }
    };
    const poll = async () => {
      if (stop) return;
      try {
        const run = await API.get("/api/runs/" + runId);
        if (run.progress_pct != null) setPercent(run.progress_pct);
        if (Array.isArray(run.log) && run.log.length) setActiveLog(run.log);
        if (run.status) setRunStatus(run.status);
        if (run.rog_monitor_log && run.status && run.status !== "running" && run.status !== "queued") setRunError(run.rog_monitor_log);
        const img = await fetch("/api/runs/" + runId + "/live.jpg?t=" + Date.now());
        if (img.ok && (img.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await img.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current && frameUrl.current.indexOf("blob:") === 0) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
        }
      } catch (_) {}
      if (!stop) setTimeout(poll, 500); // Faster poll for immediate display
    };
    poll();
    return () => { stop = true; ws.close(); };
  }, [runId]);

  return e("div", { className: "space-y-4" },
    queueInfo && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs" },
      e("div", { className: "flex justify-between" },
        e("span", { className: "font-bold text-indigo-300" }, `Queue: ${queueInfo.queued} queued, ${queueInfo.running} running ⚡`),
        e("span", { className: "fast-badge" }, "IMMEDIATE")
      ),
      e("p", { className: "text-[10px] text-slate-500 mt-1" }, "Execution queue proceeds immediately and displays window")
    ),
    runId && e("div", { className: "bg-slate-900 border-2 border-indigo-500 rounded-3xl p-5 shadow-2xl" },
      e("div", { className: "flex justify-between font-bold text-xs" },
        e("span", {}, "EXECUTION ⚡ IMMEDIATE"),
        e("span", {}, (runStatus || "running") + " · " + percent + "%")
      ),
      e("div", { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-2" },
        e("div", { className: "progress-bar", style: { width: percent + "%" } })
      ),
      runError && e("p", { className: "text-xs text-red-300 mt-2" }, runError),
      e("div", { className: "mt-3 rounded-xl overflow-hidden border border-slate-800 bg-black min-h-[200px] flex items-center justify-center" },
        frame
          ? e("img", { src: frame, alt: "Execution browser", className: "w-full" })
          : e("div", { className: "text-slate-400 text-sm p-8 text-center" },
              runStatus === "queued" ? "⏳ Queued - browser launching immediately..." : "Waiting for execution browser… (window displays immediately)"
            )
      ),
      e("div", { className: "max-h-40 overflow-y-auto mt-3 space-y-1" },
        activeLog.slice().sort((a, b) => (a.order || 0) - (b.order || 0)).map((step, i) => e("div", { key: step.order || i, className: "text-[10px] p-2 bg-slate-950 rounded border border-slate-900" },
          e("div", { className: "flex justify-between gap-2" },
            e("span", {}, step.label || step.action),
            e("span", {}, step.status === "passed" ? "✅" : step.status === "failed" ? "❌" : "⏳")
          ),
          step.error && e("div", { className: "text-red-300 mt-1" }, step.error)
        ))
      )
    ),
    runs.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-6" }, "No runs yet. Record a session, then press RUN in the library. Execution displays immediately."),
    runs.map(r => e("div", { key: r.id, onClick: () => setRunId(r.id), className: `p-4 bg-slate-900 rounded-2xl border ${runId===r.id?'border-indigo-500':'border-slate-800'} mb-2 cursor-pointer` },
      e("div", { className: "flex justify-between items-center" },
        e("span", { className: "font-bold text-indigo-400 text-xs font-mono" }, "RUN #" + r.id.slice(0, 8)),
        e("span", { className: "text-[10px] uppercase font-bold text-slate-500" }, r.status + (r.progress_pct ? " " + r.progress_pct + "%" : ""))
      ),
      r.rog_monitor_log && e("div", { className: "text-[9px] bg-red-950/20 p-2 mt-2 rounded border border-red-900/30 text-red-200 font-mono" }, r.rog_monitor_log)
    ))
  );
}

function Library({ project, onRun }) {
  const [recs, setRecs] = useState([]);
  const [error, setError] = useState("");
  const [running, setRunning] = useState("");
  const [loadTime, setLoadTime] = useState("");
  useEffect(() => {
    if (!project) return;
    const start = Date.now();
    // Use fast endpoint
    fetch(`/api/projects/${project.id}/recordings?fast=true`).then(async res => {
      const data = await res.json();
      const elapsed = Date.now() - start;
      setLoadTime(`${elapsed}ms ⚡`);
      setRecs(Array.isArray(data) ? data : []);
      setError("");
    }).catch(err => setError(err.message));
  }, [project]);
  if (!project) return e("div", { className: "py-20 text-center text-slate-500" }, "SELECT PROJECT FIRST");
  const run = async (recording) => {
    setRunning(recording.id); setError("");

    recs.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-8" }, "No recordings in repository yet. Open record tab and capture a session. Saves push to main immediately."),
    recs.map(r => e("div", { key: r.id, className: "p-5 bg-slate-900 rounded-2xl border border-slate-800 flex justify-between shadow-xl gap-3" },
      e("div", { className: "min-w-0" },
        e("div", { className: "font-bold text-indigo-300 flex items-center gap-2" }, r.name, e("span", { className: "text-[8px] bg-emerald-900 px-1 rounded" }, "MAIN")),
        e("div", { className: "text-[10px] text-slate-500 font-mono truncate" }, (r.step_count || 0) + " steps · " + (r.start_url || "") + (r.step_count > 5 ? " · 🔁 deduped" : "")),
        r.resources && r.resources.length > 0 && e("div", { className: "text-[9px] text-slate-600" }, r.resources.join(", "))
      ),

        e("button", { onClick: () => run(r), disabled: running === r.id, className: "bg-emerald-600 px-6 py-2 rounded-xl font-bold text-xs disabled:opacity-60" }, running === r.id ? "…⚡" : "RUN ⚡")
      )

}

function Projects({ setActiveProject, activeProject }) {
  const [projs, setProjs] = useState([]);
  const [name, setName] = useState("");
  const [baseUrl, setBaseUrl] = useState("");
  const [saving, setSaving] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [varsMap, setVarsMap] = useState({});
  const [loadTime, setLoadTime] = useState("");

  const load = async () => {
    setLoading(true);
    const start = Date.now();
    try {
      const result = await API.get("/api/projects?fast=true");
      setProjs(Array.isArray(result) ? result : []);
      setLoadTime(`${Date.now() - start}ms ⚡ FAST`);
      setError("");
      // Load variables for each project for display (requirement 2)
      const vMap = {};
      for (const p of result) {
        try {
          const vData = await API.get(`/api/projects/${p.id}/variables`);
          vMap[p.id] = vData.variables || [];
        } catch (_) { vMap[p.id] = []; }
      }
      setVarsMap(vMap);
    } catch (err) {
      setError(`Unable to load projects: ${err.message}`);
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => { load(); }, []);

  const create = async (event) => {
    event.preventDefault();
    if (!name.trim()) {
      setError("Enter a project name before creating it.");
      return;
    }
    setSaving(true);
    setError("");
    setNotice("");
    try {
      const project = await API.post("/api/projects", {
        name: name.trim(),
        base_url: baseUrl.trim()
      });
      setProjs(prev => [project, ...prev.filter(item => item.id !== project.id)]);
      setName("");
      setBaseUrl("");
      setNotice(project.published ? `Project “${project.name}” saved to GitHub main ⚡.` : `Project “${project.name}” saved to library. Pushing to main...`);
      // Reload vars
      setTimeout(load, 500);
    } catch (err) {
      setError(`Could not create project: ${err.message}`);
    } finally {
      setSaving(false);
    }
  };

  return e('div', { className: "space-y-4" },
    e('form', { onSubmit: create, className: "bg-slate-900 p-6 rounded-3xl border border-slate-800" },
      e('div', { className: "flex justify-between items-center mb-1" },
        e('h2', { className: "font-bold text-lg text-indigo-300" }, "Create a test project ⚡"),
        loadTime && e('span', { className: "fast-badge" }, loadTime)
      ),
      e('p', { className: "text-xs text-slate-500 mb-4" }, "Projects, recordings, variables stored in GitHub main branch. Loads super fast from catalog. Pushes immediately to main with description."),
      e('label', { className: "block text-xs text-slate-400 mb-1", htmlFor: "project-name" }, "Project name"),
      e('input', { id: "project-name", required: true, maxLength: 200, value: name, onChange: evt => setName(evt.target.value), placeholder: "e.g. Customer Portal", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e('label', { className: "block text-xs text-slate-400 mt-3 mb-1", htmlFor: "project-url" }, "Application URL (optional)"),
      e('input', { id: "project-url", type: "url", maxLength: 500, value: baseUrl, onChange: evt => setBaseUrl(evt.target.value), placeholder: "https://example.com", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e('button', { type: "submit", disabled: saving, className: "w-full bg-indigo-600 disabled:opacity-60 mt-4 py-3 rounded-xl font-bold shadow-xl" }, saving ? "CREATING & PUSHING TO MAIN…⚡" : "CREATE PROJECT → MAIN ⚡"),
      error && e('p', { role: "alert", className: "mt-3 text-sm text-red-300" }, error),
      notice && e('p', { role: "status", className: "mt-3 text-sm text-emerald-300" }, notice)
    ),
    loading && e('p', { className: "text-sm text-slate-400" }, "Loading projects super fast from GitHub main… ⚡"),
    !loading && projs.length === 0 && e('p', { className: "text-sm text-slate-500 text-center py-6" }, "No projects in GitHub library yet. Create one above - pushes to main immediately."),
    projs.map(p => e('div', { key: p.id, onClick: () => { setActiveProject(p); localStorage.setItem("tf_project", JSON.stringify(p)); }, className: `p-5 bg-slate-900 rounded-3xl border ${activeProject && activeProject.id===p.id ? 'border-indigo-500' : 'border-slate-800'} mb-3 shadow-md hover:border-indigo-500 transition-all cursor-pointer` },
      e('div', { className: "flex justify-between items-start" },
        e('div', { className: "font-bold text-sm" }, p.name),
        e('span', { className: "fast-badge" }, "MAIN")
      ),
      e('div', { className: "text-[10px] text-emerald-400 font-normal mt-1" }, "GitHub main · " + (p.repository_path || "library")),
      p.base_url && e('div', { className: "text-[10px] text-slate-500 font-normal mt-1" }, p.base_url),
      varsMap[p.id] && varsMap[p.id].length > 0 && e('div', { className: "mt-2" },
        e('div', { className: "text-[10px] text-indigo-300 font-bold" }, `🔤 ${varsMap[p.id].length} Variables (reusable as parameters):`),
        e('div', { className: "flex flex-wrap gap-1 mt-1" },
          varsMap[p.id].slice(0, 5).map(v => e('span', { key: v.id, className: "var-chip" }, `{{${v.name}}}`)),
          varsMap[p.id].length > 5 && e('span', { className: "text-[9px] text-slate-500" }, `+${varsMap[p.id].length - 5} more`)
        )
      ),
      varsMap[p.id] && varsMap[p.id].length === 0 && e('div', { className: "text-[9px] text-slate-600 mt-1" }, "No variables yet - add in Variables tab")
    ))
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");
  const [loadTime, setLoadTime] = useState("");
  const load = () => {
    if (!project) return;
    const start = Date.now();
    API.get(`/api/variables?project_id=${project.id}`).then(data => {
      setVars(Array.isArray(data) ? data : []);
      setLoadTime(`${Date.now() - start}ms ⚡`);
    });

  if (!project) return e('div', {className:"py-20 text-center text-slate-500"}, "SELECT PROJECT FIRST");
  return e('div', { className: "space-y-4" },
    e('div', { className: "flex justify-between items-center" },

      loadTime && e('span', { className: "fast-badge" }, loadTime)
    ),
    e('div', { className: "bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg" },

      e(AiInput, { value: val, onChange: e => setVal(e.target.value), placeholder: "Value" }),

    ),
    e('div', { className: "text-xs text-slate-400 bg-slate-950 p-3 rounded-xl border border-slate-800" },
      e('p', { className: "font-bold text-indigo-300" }, "💡 How to reuse as parameters:"),

    ),
    vars.map(v => e('div', { key: v.id, className: "p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-2 shadow-inner" },
      e('div', { className: "flex justify-between" }, e('code', {className:"text-indigo-400 font-bold"}, `{{${v.name}}}`), e('button', { onClick: async () => { await API.del(`/api/variables/${v.id}`); load(); }, className: "text-red-500" }, "✕")),
      e('div', { className: "text-[10px] text-slate-500 font-bold" }, "ASSOCIATED RECORDINGS: " + (v.tags?.join(", ") || "None") + " · MAIN BRANCH"),
      e('input', { className: "w-full bg-slate-950 p-2 rounded text-xs text-slate-300 border border-slate-800", value: v.value, onChange: async (evt) => { await API.patch(`/api/variables/${v.id}`, {value: evt.target.value}); load(); } })
    ))
  );
}

  const [runs, setRuns] = useState([]);
  const [sel, setSel] = useState(null);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" },
    runs.map(r => e('div', { key: r.id, className: "bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl" },
      e('div', { className: "p-4 flex justify-between bg-slate-800/30", onClick: () => setSel(sel === r.id ? null : r.id) }, e('span', {className:"font-bold"}, `ERP Audit: ${r.id.slice(0,8)}`), e('span', {className:"text-indigo-400 font-bold text-xs"}, "SPLIT ➔")),
      sel === r.id && e('div', { className: "grid grid-cols-2 gap-2 p-3 bg-black/40 border-t border-slate-800" },
        e('div', { className: "space-y-1 pr-1 border-r border-slate-800" }, e('div', {className:"text-[9px] font-bold text-purple-400 uppercase text-center mb-1"}, "BASELINE"), (r.baseline || []).map((s, i) => e('div', {key:i, className:"text-[9px] bg-slate-900 p-2 rounded border border-purple-900/10"}, `${s.action}`))),
        e('div', { className: "space-y-1 pl-1" }, e('div', {className:"text-[9px] font-bold text-emerald-400 uppercase text-center mb-1"}, "ACTUAL"), (r.log || []).map((s, i) => e('div', {key:i, className:"text-[9px] bg-slate-900 p-2 rounded border border-emerald-900/10"}, e('div',{},s.action), s.screenshot && e('img', {src:s.screenshot, className:"mt-1 rounded"}))))

function Artifacts() {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns).catch(() => {}); }, []);
  const withMedia = runs.filter(r => r.video_path || (r.log || []).some(step => step.screenshot));
  return e("div", { className: "space-y-4" },
    withMedia.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-8" }, "No artifacts yet. Run a recording to capture screenshots. Execution window displays immediately."),
    withMedia.map(r => e("div", { key: r.id, className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-2xl space-y-3" },
      e("div", { className: "text-xs font-bold text-indigo-300" }, "RUN #" + r.id.slice(0, 8) + " · " + r.status + " ⚡"),
      r.video_path && e("video", { controls: true, className: "w-full rounded-2xl bg-black shadow-inner", src: "/api/runs/video/" + r.id }),
      e("div", { className: "grid grid-cols-2 gap-2" },
        (r.log || []).filter(step => step.screenshot).map((step, i) => e("div", { key: i },
          e("div", { className: "text-[9px] text-slate-400 mb-1" }, (step.label || step.action) + (step.repeat ? ` ×${step.repeat}` : "")),
          e("img", { src: step.screenshot, alt: step.label || "step", className: "rounded-lg border border-slate-800" })

function Github() {
  const [info, setInfo] = useState(null);
  const [error, setError] = useState("");
  const [publishing, setPublishing] = useState(false);
  const [fastInfo, setFastInfo] = useState(null);
  const load = () => {
    API.get("/api/library").then(setInfo).catch(err => setError(err.message));
    API.get("/api/library/fast").then(setFastInfo).catch(() => {});
  };
  useEffect(() => { load(); }, []);
  const publish = async () => {
    setPublishing(true);
    try {
      const result = await API.post("/api/library/publish", {});
      setInfo(result);
      setError("");
      // Also force sync
      await API.post("/api/sync/github", {});
    } catch (err) {
      setError(err.message);
    } finally {
      setPublishing(false);
    }
  };
  const sync = async () => {
    setPublishing(true);
    try {
      const result = await API.post("/api/sync/github", {});
      setError("");
      alert(result.message || "Pushed to main immediately ⚡");
      load();
    } catch (err) {
      setError(err.message);
    } finally {
      setPublishing(false);
    }
  };
  const repositoryUrl = (info && info.repository_url) || "https://github.com/Raheelatta1984/testforge";
  const tree = repositoryUrl + "/tree/main/library";
  const projects = (info && info.projects) || [];
  return e('div', { className: "py-8 px-5 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl space-y-4" },
    e('div', {className:"text-5xl text-center"}, "🐙"),
    e('div', { className: "flex justify-center gap-2" },
      e('h2', {className:"font-bold text-xl text-indigo-300 text-center"}, "GITHUB LIBRARY"),
      e('span', { className: "fast-badge" }, "MAIN ONLY ⚡")
    ),
    e('p', {className:"text-sm text-slate-400"}, "Projects, variables, recordings stored in library/ folder of main branch only. Dashboard loads super fast from catalog. Creating project or saving recording commits and pushes to main immediately with description. Repeated steps auto-compress."),
    info && e('div', { className: "text-xs text-slate-400 font-mono space-y-1" },
      e('div', {}, "Branch main (forced) ⚡"),
      e('div', {}, "Revision " + (info.revision || "—")),
      e('div', {}, info.publish_enabled ? "Push to main enabled ⚡" : "Push disabled"),
      info.dirty && e('div', { className: "text-amber-300" }, "Unpublished changes - will push to main immediately"),
      fastInfo && e('div', { className: "text-emerald-400" }, `Fast load: ${fastInfo.load_time || "cached"} from catalog ⚡`)
    ),
    e('div', { className: "space-y-2" },
      projects.length === 0 && e('p', { className: "text-sm text-slate-500 text-center" }, "No projects in main yet."),
      projects.map(project => e('div', { key: project.id, className: "p-3 bg-slate-950 rounded-xl border border-slate-800" },
        e('div', { className: "flex justify-between" },
          e('div', { className: "font-bold text-sm" }, project.name),
          e('span', { className: "text-[8px] bg-emerald-900 px-1 rounded" }, "MAIN")
        ),
        e('div', { className: "text-[10px] text-slate-500 font-mono" }, project.repository_path),
        (project.variables || []).length > 0 && e('div', { className: "text-[10px] text-indigo-300 mt-1" }, "Variables: " + project.variables.join(", ") + " (reusable)"),
        (project.recordings || []).map(rec => e('div', { key: rec.id, className: "text-[10px] text-slate-400 mt-1 flex justify-between" },
          e('span', {}, rec.name + " · " + rec.step_count + " steps" + (rec.step_count > 5 ? " · 🔁 deduped" : "")),
          e('span', { className: "text-emerald-400" }, "main")
        ))
      ))
    ),
    error && e('p', { role: "alert", className: "text-sm text-red-300" }, error),
    e('div', { className: "flex flex-col gap-2" },
      e('a', { href: tree, target: "_blank", rel: "noopener noreferrer", className: "text-center bg-slate-700 px-8 py-3 rounded-2xl font-bold" }, "OPEN LIBRARY ON GITHUB MAIN"),
      e('button', { type: "button", onClick: publish, disabled: publishing, className: "bg-indigo-600 disabled:opacity-60 px-8 py-3 rounded-2xl font-bold" }, publishing ? "PUSHING TO MAIN…⚡" : "PUSH LIBRARY TO GITHUB MAIN ⚡"),
      e('button', { type: "button", onClick: sync, disabled: publishing, className: "bg-emerald-600 disabled:opacity-60 px-8 py-3 rounded-2xl font-bold" }, publishing ? "SYNCING…⚡" : "FORCE SYNC TO MAIN NOW ⚡")
    ),
    e('div', { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-[10px] text-slate-500" },
      e('p', { className: "font-bold text-slate-400" }, "✅ Fixes applied:"),
      e('ul', { className: "list-disc ml-4 mt-1 space-y-1" },
        e('li', {}, "Projects load super fast via catalog cache ⚡"),
        e('li', {}, "Variables visible in Projects & Recording tabs for reuse"),
        e('li', {}, "Recording FAST mode: low CPU, 150ms polling, adaptive preview"),
        e('li', {}, "Repeated steps auto-compress: 'follow last steps x times' 🔁"),
        e('li', {}, "Smooth save: debounced export, retry logs, local fallback"),
        e('li', {}, "Immediate push to main with description, only main branch"),
        e('li', {}, "Library recordings load super fast from catalog"),
        e('li', {}, "Execution queue proceeds immediately, window displays"),
        e('li', {}, "Force push to main if difference, merge if required")
      )
    )
  );
}
