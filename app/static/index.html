<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge Titan ERP - Optimized</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; width: 100vw; }
  .nav-btn { flex: 1; padding: 12px; font-size: 11px; font-weight: bold; color: #64748b; border-top: 2px solid transparent; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .content-area { height: calc(100vh - 75px); overflow-y: auto; padding: 15px; padding-bottom: 90px; }
  .canvas-window { background: #000; border: 2px solid #1e293b; border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; }
  .progress-bar { height: 100%; background: #6366f1; transition: width 0.4s ease; box-shadow: 0 0 15px #6366f1; }
  .key-btn { background: #1e293b; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #334155; }
  .browser-shell { background: #020617; border: 2px solid #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 240px; }
  .browser-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #0f172a; border-bottom: 1px solid #1e293b; }
  .browser-url { flex: 1; font-size: 11px; color: #cbd5e1; background: #020617; border-radius: 999px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  .dot.red { background: #ef4444; } .dot.yellow { background: #eab308; } .dot.green { background: #22c55e; }
  .browser-viewport { position: relative; background: #000; min-height: 200px; }
  .browser-viewport img { width: 100%; height: auto; display: block; cursor: crosshair; user-select: none; -webkit-user-drag: none; }
  .browser-wait { min-height: 180px; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 24px; font-size: 13px; background: #000; }
  .fast-badge { background: linear-gradient(90deg, #22c55e, #16a34a); color: white; font-size: 8px; padding: 2px 6px; border-radius: 999px; font-weight: bold; }
  .var-chip { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; padding: 2px 8px; border-radius: 999px; font-size: 10px; cursor: pointer; }
  .var-chip:hover { background: #312e81; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;
async function apiRequest(url, options = {}) {
  const response = await fetch(url, options);
  let payload = null;
  const text = await response.text();
  try { payload = JSON.parse(text); } catch (_) { payload = text; }
  if (!response.ok) {
    const detail = payload && (payload.detail || payload.message || payload);
    throw new Error(typeof detail === 'string' ? detail : `Request failed (${response.status})`);
  }
  return payload;
}
const API = {
  get: u => apiRequest(u),
  post: (u, b) => apiRequest(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  patch: (u, b) => apiRequest(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  del: u => apiRequest(u, {method:'DELETE'})
};

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => setMic(true); rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20 border border-slate-700", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: async () => { const res = await API.post("/api/ai/rephrase", { text: value }); onChange({ target: { value: res.rephrased } }); }, className: "p-1 rounded bg-purple-900" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);
  // Live browser window for execution. Off means the replay runs without the
  // screencast, which is the cheapest way to run a suite.
  const [liveWindow, setLiveWindow] = useState(() => localStorage.getItem("tf_live_window") !== "0");
  const toggleLiveWindow = (next) => {
    setLiveWindow(next);
    localStorage.setItem("tf_live_window", next ? "1" : "0");
  };
  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["logs","📜"], ["github","🐙"]];

  return e('div', { className: "h-full flex flex-col" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between bg-slate-950/80 backdrop-blur" },
      e('div', { className: "flex items-center gap-2" },
        e('span', { className: "font-bold text-indigo-400 tracking-tighter" }, "⚡ TITAN ROG ERP"),
        e('span', { className: "fast-badge" }, "FAST ⚡")
      ),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('div', { className: "content-area" },
      tab === "projects" && e(Projects, { setActiveProject, activeProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, liveWindow, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId, liveWindow, setLiveWindow: toggleLiveWindow }),
      tab === "comparison" && e(Comparison), tab === "artifacts" && e(Artifacts),
      tab === "logs" && e(Logs), tab === "github" && e(Github)
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [status, setStatus] = useState("");
  const [error, setError] = useState("");
  const [saveNote, setSaveNote] = useState("");
  const [saveState, setSaveState] = useState("");
  const [steps, setSteps] = useState([]);
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [armed, setArmed] = useState(null);
  const [variableName, setVariableName] = useState("");
  const [varsList, setVarsList] = useState([]);
  const [publishInfo, setPublishInfo] = useState(null);
  const recRef = useRef(null);
  const frameUrl = useRef(null);
  const initialStepsLoaded = useRef(false);

  // Where a SAVE will land. Read once from the cheap catalog endpoint so the tab
  // can say "publishes to owner/repo@branch" or "stays local" before the user
  // records anything, instead of surprising them after SAVE.
  useEffect(() => {
    API.get("/api/library/fast").then(data => {
      setPublishInfo({
        mode: data.publish_mode,
        enabled: data.publish_enabled,
        slug: data.slug,
        branch: data.branch,
        reason: data.publish_disabled_reason,
      });
    }).catch(() => {});
  }, []);

  useEffect(() => {
    if (!project) return;
    setUrl(prev => prev || project.base_url || "");
    setName(prev => prev || ("Session " + new Date().toLocaleString()));
    // Load variables for reuse in recording tab (requirement 2)
    API.get(`/api/projects/${project.id}/variables`).then(data => {
      setVarsList(data.variables || []);
    }).catch(() => {});
  }, [project]);
  useEffect(() => { recRef.current = recId; }, [recId]);
  useEffect(() => () => {
    const id = recRef.current;
    if (id) fetch("/api/recordings/" + id + "/stop", { method: "POST" }).catch(() => {});
  }, []);
  useEffect(() => {
    if (!recId) return undefined;
    let stop = false;
    const tick = async () => {
      if (stop) return;
      try {
        const session = await API.get("/api/recordings/" + recId + "/session");
        if (session.error) { setError(session.error); setStatus("Browser error"); }
        else if (session.status === "live") {
          setStatus("Browser live ⚡ FAST");
          if (!initialStepsLoaded.current) {
            API.get("/api/recordings/" + recId).then(recording => {
              if ((recording.steps || []).length >= session.seq) initialStepsLoaded.current = true;
              setSteps(prev => [...prev, ...(recording.steps || []).filter(step => !prev.some(item => item.id === step.id))]
                .sort((a, b) => b.order - a.order));
            }).catch(() => {});
          }
        }
        else if (session.status === "starting") setStatus("Launching browser… FAST");
        const res = await fetch("/api/recordings/" + recId + "/frame?t=" + Date.now());
        if (res.ok && (res.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await res.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
          if (!session.error) { setStatus("Browser live ⚡ FAST"); setError(""); }
        } else if (res.status !== 204) {
          let detail = "Browser unavailable (" + res.status + ")";
          try { const payload = await res.json(); detail = payload.detail || detail; } catch (_) {}
          setError(detail);
          setStatus("Browser error");
        }
      } catch (err) { setError(err.message); }
      if (!stop) setTimeout(tick, 150); // Faster polling for super fast feel (was 400)
    };
    tick();
    return () => { stop = true; };
  }, [recId]);

  if (!project) return e("div", { className: "py-20 text-center text-slate-500 font-bold" }, "SELECT A PROJECT TO BEGIN");

  const send = async (msg) => {
    try {
      const res = await API.post("/api/recordings/" + recId + "/input", msg);
      if (res.step) setSteps(prev => [res.step, ...prev.filter(step => step.id !== res.step.id)]);
      if (msg.type === "save_variable") {
        API.get(`/api/projects/${project.id}/variables`).then(data => setVarsList(data.variables || [])).catch(() => {});
      }
      setError("");
    } catch (err) { setError(err.message); }
  };
  const start = async () => {
    setBusy(true); setError("");
    try {
      const recording = await API.post("/api/recordings", {
        project_id: project.id,
        name: (name || "Session").trim(),
        start_url: (url || "").trim() || "/demo.html"
      });
      initialStepsLoaded.current = false;
      setSteps([]); setFrame(null); setStatus("Launching browser… FAST ⚡"); setRecId(recording.id);
      await API.post("/api/recordings/" + recording.id + "/session", {});
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  };
  const stop = async () => {
    const id = recId;
    recRef.current = null;
    if (!id) { setRecId(null); setFrame(null); setStatus(""); return; }
    setStatus("Saving recording…");
    try {
      const result = await API.post("/api/recordings/" + id + "/stop", {});
      // The server states what happened and whether a retry exists. The old text
      // always promised "will retry in 1 minute", even when publishing was
      // disabled and no retry loop had been started.
      setSaveNote(result.publish_message || (result.published
        ? `Published to ${result.branch || "the repository"}.`
        : `Saved locally${result.publish_error ? ": " + result.publish_error : ""}.`));
      setSaveState(result.published ? "published" : (result.retry_scheduled ? "retry" : "local"));
      setError("");
    } catch (err) {
      setError(err.message);
    } finally {
      setRecId(null); setFrame(null); setStatus("");
    }
  };

  const insertVariable = (varName) => {
    const placeholder = `{{${varName}}}`;
    setText(prev => prev + placeholder);
  };

  if (recId) return e("div", { className: "fixed inset-0 bg-slate-950 z-[100] flex flex-col p-2 gap-2" },
    e("div", { className: "flex justify-between items-center px-1" },
      e("span", { className: "text-xs font-bold " + (status.includes("live") ? "text-emerald-400" : "text-red-400") }, status === "Browser live ⚡ FAST" ? "● BROWSER LIVE ⚡ FAST" : "● " + (status || "RECORDING")),
      e("div", { className: "flex gap-1 items-center" },
        e("button", { onClick: () => setZoom(z => Math.max(0.5, +(z - 0.25).toFixed(2))), className: "key-btn", title: "Zoom out" }, "−"),
        e("span", { className: "text-xs" }, Math.round(zoom * 100) + "%"),
        e("button", { onClick: () => setZoom(z => Math.min(2, +(z + 0.25).toFixed(2))), className: "key-btn", title: "Zoom in" }, "+"),
        e("button", { onClick: stop, className: "bg-red-600 px-4 py-1 rounded font-bold text-xs" }, "SAVE"))
    ),
    error && e("p", { role: "alert", className: "text-sm text-red-300 px-1" }, error),
    saveNote && e("p", { role: "status", className: "text-[11px] px-2 py-1 rounded-lg border " +
      (saveState === "published" ? "bg-emerald-950/40 border-emerald-800/40 text-emerald-200"
        : saveState === "retry" ? "bg-amber-950/40 border-amber-800/40 text-amber-200"
        : "bg-slate-950 border-slate-800 text-slate-300") },
      (saveState === "published" ? "✅ " : saveState === "retry" ? "⏳ " : "💾 ") + saveNote),
    e("div", { className: "browser-shell flex-1 min-h-0" },
      e("div", { className: "browser-bar" },
        e("span", { className: "dot red" }), e("span", { className: "dot yellow" }), e("span", { className: "dot green" }),
        e("span", { className: "browser-url" }, url || "/demo.html"),
        e("span", { className: "fast-badge ml-2" }, "FAST")
      ),
      e("div", { className: "browser-viewport flex-1 overflow-auto" },
        frame
          ? e("img", {
              src: frame, alt: "Remote browser", draggable: false,
              style: { width: (100 * zoom) + "%", maxWidth: "none" },
              onClick: (evt) => {
                const img = evt.target;
                const rect = img.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const x = Math.round((evt.clientX - rect.left) / rect.width * (img.naturalWidth || 1024));
                const y = Math.round((evt.clientY - rect.top) / rect.height * (img.naturalHeight || 640));
                send({ type: "tap", x: x, y: y });
              }
            })
          : e("div", { className: "browser-wait" }, error || status || "Starting the remote browser FAST…")
      )
    ),
    varsList.length > 0 && e("div", { className: "flex gap-1 flex-wrap px-1" },
      e("span", { className: "text-[10px] text-slate-500" }, "Variables:"),
      varsList.map(v => e("button", { key: v.id, onClick: () => insertVariable(v.name), className: "var-chip" }, `{{${v.name}}}`))
    ),
    steps.length > 0 && e("div", { className: "max-h-20 overflow-y-auto text-[10px] text-slate-400 px-1" },
      steps.map(step => e("div", { key: step.id || step.order, className: "flex justify-between" },
        e("span", {}, `${step.order}. ${step.label || step.action}`),
        step.repeat > 1 && e("span", { className: "text-emerald-400 font-bold" }, `×${step.repeat} 🔁`)
      ))
    ),
    e("div", { className: "bg-slate-900 p-2 space-y-2 rounded-xl" },
      e("p", { className: "text-[10px] text-slate-400" }, armed ? `Confirm ${armed}: tap again to send` : "Tap a command once to enlarge; tap again to execute."),
      e("div", { className: "flex flex-wrap gap-1" },
        ["Enter", "Tab", "Backspace", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Control", "Alt", "Control+c", "Control+v", "Control+s"].map(key =>
          e("button", { key, className: "key-btn " + (armed === key ? "scale-110 bg-indigo-600 border-indigo-300 z-10" : ""),
            onClick: () => { if (armed === key) { setArmed(null); send({ type: "key", key }); } else setArmed(key); } }, key))
      ),
      e("div", { className: "flex gap-1 items-center" },
        e("input", { value: variableName, onChange: evt => setVariableName(evt.target.value), placeholder: "Variable name for focused input", className: "flex-1 min-w-0 bg-slate-800 p-1 rounded text-xs" }),
        [false, true].map(existing => e("button", { key: String(existing), className: "key-btn " + (armed === (existing ? "update" : "new") ? "scale-110 bg-indigo-600" : ""),
          onClick: () => { const key = existing ? "update" : "new"; if (armed === key) { setArmed(null); send({ type: "save_variable", name: variableName, existing }); } else setArmed(key); } }, existing ? "Update variable" : "New variable"))
      ),
      e("div", { className: "flex gap-2" },
        e("input", {
          className: "flex-1 bg-slate-800 p-2 rounded text-sm", placeholder: "Type text or {{variable}}…", value: text,
          onChange: (evt) => setText(evt.target.value),
          onKeyDown: (evt) => { if (evt.key === "Enter" && text) { send({ type: "text", text: text }); setText(""); } }
        }),
        e("button", { className: "bg-indigo-600 px-4 rounded font-bold text-sm", onClick: () => { if (text) { send({ type: "text", text: text }); setText(""); } } }, "Type")
      ),
      e("p", { className: "text-[9px] text-slate-500" }, "💡 Each action is saved as an editable step in execution order. Repeating the same action merges it into one step with a ×N count.")
    )
  );

  return e("div", { className: "space-y-4" },
    e("div", { className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3" },
      e("div", { className: "flex justify-between items-center" },
        e("h2", { className: "font-bold text-lg text-indigo-300" }, "Record in remote browser ⚡ FAST"),
        e("span", { className: "fast-badge" }, "OPTIMIZED")
      ),
      e("p", { className: "text-sm text-slate-400" }, "Opens Chromium on server (free-tier optimized, low CPU). Repeated actions merge into one editable step with a repeat count."),
      publishInfo && e("p", { className: "text-[11px] px-3 py-2 rounded-xl border " +
        (publishInfo.enabled ? "bg-emerald-950/30 border-emerald-900/40 text-emerald-200"
                             : "bg-amber-950/30 border-amber-900/40 text-amber-200") },
        publishInfo.enabled
          ? `SAVE publishes to ${publishInfo.slug || "the repository"}${publishInfo.branch ? "@" + publishInfo.branch : ""} ` +
            (publishInfo.mode === "api" ? "through the GitHub API (this deployment has no git checkout)." : "with git push.")
          : "SAVE keeps the recording on this instance only. " + (publishInfo.reason || "GitHub publishing is disabled.")),
      varsList.length > 0 && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800" },
        e("div", { className: "text-xs font-bold text-indigo-300 mb-2" }, `📦 ${varsList.length} Variables available for reuse:`),
        e("div", { className: "flex flex-wrap gap-1" },
          varsList.map(v => e("button", { key: v.id, onClick: () => insertVariable(v.name), className: "var-chip", title: `${v.name} = ${v.value}` }, `{{${v.name}}}`))
        ),
        e("p", { className: "text-[9px] text-slate-500 mt-2" }, "Click to insert into type field")
      ),
      e("label", { className: "block text-xs text-slate-400", htmlFor: "rec-name" }, "Recording name"),
      e("input", { id: "rec-name", value: name, onChange: (evt) => setName(evt.target.value), className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e("label", { className: "block text-xs text-slate-400", htmlFor: "rec-url" }, "Page to open"),
      e("input", { id: "rec-url", value: url, onChange: (evt) => setUrl(evt.target.value), placeholder: "Leave blank for sample app", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e("button", { type: "button", onClick: () => setUrl("/demo.html"), className: "text-xs text-indigo-300 underline" }, "Use sample app"),
      e("button", { type: "button", onClick: start, disabled: busy, className: "w-full bg-red-600 disabled:opacity-60 py-4 rounded-2xl font-bold text-lg" }, busy ? "OPENING BROWSER FAST…" : "● START AI RECORDING ⚡"),
      error && e("p", { role: "alert", className: "text-sm text-red-300" }, error),
      saveNote && e("p", { role: "status", className: "text-xs px-3 py-2 rounded-xl border " +
        (saveState === "published" ? "bg-emerald-950/40 border-emerald-800/40 text-emerald-200"
          : saveState === "retry" ? "bg-amber-950/40 border-amber-800/40 text-amber-200"
          : "bg-slate-950 border-slate-800 text-slate-300") },
        (saveState === "published" ? "✅ " : saveState === "retry" ? "⏳ " : "💾 ") + saveNote)
    )
  );
}

function Runs({ runId, setRunId, liveWindow, setLiveWindow }) {
  /* Queue hygiene and batch execution live here: both are about what runs next. */
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);
  const [runStatus, setRunStatus] = useState("");
  const [runError, setRunError] = useState("");
  const [queueInfo, setQueueInfo] = useState(null);
  const [windowOff, setWindowOff] = useState(false);
  const windowOffRef = useRef(false);
  const frameUrl = useRef(null);

  const load = () => API.get("/api/runs").then(setRuns).catch(() => {});
  const loadQueue = () => API.get("/api/runs/queue/status").then(setQueueInfo).catch(() => {});
  useEffect(() => {
    load(); loadQueue();
    // A background tab must not keep polling: the service is small and every
    // poll is a database read plus a serialisation.
    const t = setInterval(() => { if (!document.hidden) { load(); loadQueue(); } }, 3000);
    const onVisible = () => { if (!document.hidden) { load(); loadQueue(); } };
    document.addEventListener("visibilitychange", onVisible);
    return () => { clearInterval(t); document.removeEventListener("visibilitychange", onVisible); };
  }, []);

  useEffect(() => {
    if (!runId) return undefined;
    setActiveLog([]); setPercent(0); setRunStatus("queued"); setRunError(""); setFrame(null);
    setWindowOff(false); windowOffRef.current = false;
    let stop = false;
    const ws = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws/runs/" + runId);
    ws.onmessage = (ev) => {
      const message = JSON.parse(ev.data);
      // The server states the window mode on the first status event of the run.
      if (message.display_window === false) { setWindowOff(true); windowOffRef.current = true; }
      if (message.type === "frame" && message.data) setFrame("data:image/jpeg;base64," + message.data);
      if (message.percent !== undefined) setPercent(message.percent);
      if (message.type === "done") {
        setRunStatus(message.status || "done");
        if (message.error) setRunError(message.error);
        load();
      } else if (message.status && (message.order !== undefined || message.type === "status")) {
        if (message.type === "status") {
          setRunStatus(message.status);
          setPercent(message.percent || 0);
        } else {
          setActiveLog(prev => prev.filter(item => item.order !== message.order).concat([message]));
        }
      }
    };
    const poll = async () => {
      if (stop) return;
      try {
        const run = await API.get("/api/runs/" + runId);
        if (run.progress_pct != null) setPercent(run.progress_pct);
        if (Array.isArray(run.log) && run.log.length) setActiveLog(run.log);
        if (run.status) setRunStatus(run.status);
        if (run.rog_monitor_log && run.status && run.status !== "running" && run.status !== "queued") setRunError(run.rog_monitor_log);
        if (run.display_window === false) { setWindowOff(true); windowOffRef.current = true; }
        // No point polling for a picture the run was told not to produce.
        if (!windowOffRef.current) {
        const img = await fetch("/api/runs/" + runId + "/live.jpg?t=" + Date.now());
        if (img.ok && (img.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await img.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current && frameUrl.current.indexOf("blob:") === 0) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
        }
        }
      } catch (_) {}
      if (!stop) setTimeout(poll, 500); // Faster poll for immediate display
    };
    poll();
    return () => { stop = true; ws.close(); };
  }, [runId]);

  return e("div", { className: "space-y-4" },
    queueInfo && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs" },

function QueueHygiene({ queueInfo, refresh }) {
  const [busy, setBusy] = useState("");
  const [note, setNote] = useState("");
  const hygiene = (queueInfo && queueInfo.hygiene) || {};
  const policy = hygiene.policy || {};
  const act = async (body, label) => {
    setBusy(label); setNote("");
    try {
      const res = await API.post("/api/runs/queue/clear", body);
      const kinds = Object.entries(res.by_kind || {}).map(([k, v]) => `${v} ${k}`).join(", ");
      setNote((res.message || "Done.") + (kinds ? ` (${kinds})` : "") + (res.purge ? ` Purged ${res.purge.purged || res.purge.would_purge || 0} finished run(s).` : ""));
      refresh();
    } catch (err) { setNote(err.message); }
    finally { setBusy(""); }
  };
  const clearable = hygiene.clearable || 0;
  return e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-2" },
    e("div", { className: "flex justify-between items-center" },
      e("span", { className: "font-bold text-indigo-300" }, "Queue hygiene 🧹"),
      clearable > 0
        ? e("span", { className: "text-[10px] px-2 py-0.5 rounded-full bg-amber-900 text-amber-200 font-bold" }, `${clearable} TO CLEAR`)
        : e("span", { className: "text-[10px] px-2 py-0.5 rounded-full bg-emerald-900 text-emerald-200 font-bold" }, "CLEAN")
    ),
    e("div", { className: "grid grid-cols-2 gap-1 text-[10px] text-slate-400" },
      e("span", {}, `Orphaned (no worker): ${hygiene.orphans || 0}`),
      e("span", {}, `Stale (queued > ${policy.stale_minutes || 30}m): ${hygiene.stale || 0}`),
      e("span", {}, `Duplicates: ${hygiene.duplicates || 0}`),
      e("span", {}, `Oldest queued: ${Math.round(hygiene.oldest_queued_seconds || 0)}s`),
      e("span", {}, `Live workers: ${hygiene.live_workers || 0}`),
      e("span", {}, `Cancelled so far: ${(queueInfo && queueInfo.cancelled) || 0}`)
    ),
    e("p", { className: "text-[10px] text-slate-500" },
      "Orphans are runs left behind by a restart: no worker owns them, so they can never finish. They are reaped at boot and every " +
      Math.round((policy.sweep_seconds || 300) / 60) + " minutes; clear them here to do it now."),
    e("div", { className: "flex flex-wrap gap-2" },
      e("button", { type: "button", disabled: !!busy, onClick: () => act({ dry_run: true }, "dry"),

      e("button", { type: "button", disabled: !!busy || clearable === 0,
        onClick: () => act({ include_orphans: true, include_stale: true }, "clear"),
        className: "key-btn bg-amber-700 border-amber-500 disabled:opacity-40" }, busy === "clear" ? "CLEARING…" : "CLEAR ORPHANS + STALE"),
      e("button", { type: "button", disabled: !!busy,
        onClick: () => act({ include_orphans: true, include_stale: true, include_duplicates: true }, "dupes"),
        className: "key-btn disabled:opacity-50" }, busy === "dupes" ? "CLEARING…" : "+ DUPLICATES"),
      e("button", { type: "button", disabled: !!busy,
        onClick: () => act({ include_orphans: true, include_stale: true, include_duplicates: true, purge_finished_days: policy.retention_days || 14 }, "purge"),
        className: "key-btn bg-red-900 border-red-700 disabled:opacity-50" }, busy === "purge" ? "PURGING…" : "PURGE OLD HISTORY")
    ),

  );

      const data = await res.json();
      const elapsed = Date.now() - start;
      setLoadTime(`${elapsed}ms ⚡`);

    setRunning(recording.id); setError("");

      const res = await API.post("/api/runs", { target_id: recording.id, display_window: liveWindow !== false });

      setError(err.message);

const LOG_FILES = ["results.md", "harness.log", "unit.log", "scenarios.log", "server.log"];

function parseMarkdownTable(text) {
  const rows = [];
  let headers = null;
  for (const raw of (text || "").split("\n")) {
    const line = raw.trim();
    if (!line.startsWith("|")) continue;
    const cells = line.slice(1, -1).split("|").map(c => c.trim());
    if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
    if (!headers) { headers = cells; continue; }
    const row = {};
    headers.forEach((h, i) => { row[h] = cells[i] || ""; });
    rows.push(row);
  }
  return rows;
}

function Logs() {
  const [source, setSource] = useState(null);
  const [mode, setMode] = useState("");
  const [rows, setRows] = useState([]);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [loading, setLoading] = useState(true);
  const [open, setOpen] = useState(null);
  const [files, setFiles] = useState({});
  const [busy, setBusy] = useState("");

  // Read a path out of the repository. raw.githubusercontent.com first; some
  // networks block it, and the contents API serves the same bytes.
  const fromGithub = async (src, path) => {
    try {
      const raw = await fetch(`${src.base}/${path}`, { cache: "no-store" });
      if (raw.ok) return await raw.text();
    } catch (_) { /* fall through to the API */ }
    const api = await fetch(
      `https://api.github.com/repos/${src.slug}/contents/${path}?ref=${encodeURIComponent(src.branch)}`,
      { cache: "no-store", headers: { Accept: "application/vnd.github.raw+json" } }
    );
    if (!api.ok) throw new Error(`GitHub returned ${api.status} for ${path}`);
    return await api.text();
  };

  // Fallback for a deployment with no git checkout: read the reports this
  // instance wrote itself. The server caps every file, so this stays cheap.
  const loadLocal = async () => {
    const local = await API.get("/api/logs/local/index");
    if (!local.available) throw new Error(local.reason || "No harness logs are stored on this instance.");
    setMode("local");
    setRows((local.rows || []).map(row => ({ ...row, folder: row.folder || row.Folder })));
    return true;
  };

  useEffect(() => {
    let stop = false;
    (async () => {
      try {
        const src = await API.get("/api/logs/source");
        if (stop) return;
        setSource(src);
        if (src.available) {
          try {
            const text = await fromGithub(src, "logs/index.md");
            if (stop) return;
            const parsed = parseMarkdownTable(text);
            if (parsed.length) {
              setMode("github"); setRows(parsed); setError("");
            } else {
              throw new Error("The committed log index has no runs yet.");
            }
          } catch (githubError) {
            if (stop) return;
            // Coordinates exist but the branch has no committed logs (or the
            // network blocks GitHub): fall back to this instance instead of
            // showing an empty tab.
            try {
              await loadLocal();
              setNotice(`GitHub logs unavailable (${githubError.message}). Showing the reports stored on this instance.`);
            } catch (localError) {
              setMode("github"); setRows([]);
              setError(githubError.message);
            }
          }
        } else {
          try {
            await loadLocal();
            setNotice(src.reason || "No git checkout here, so committed logs are unavailable.");
          } catch (localError) {
            setMode("none");
            setError((src.reason || "Log location unknown") + " " + localError.message);
          }
        }
      } catch (err) {
        if (!stop) setError(err.message);
      } finally {
        if (!stop) setLoading(false);
      }
    })();
    return () => { stop = true; };
  }, []);

  const openRun = async (folder) => {
    if (open === folder) { setOpen(null); return; }
    setOpen(folder); setFiles({}); setBusy(folder);
    if (mode === "local") {
      try {
        const listing = await API.get("/api/logs/local/" + encodeURIComponent(folder));
        for (const name of listing.files || []) {
          API.get(`/api/logs/local/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`)
            .then(res => setFiles(prev => ({ ...prev, [name]: (res.truncated ? "… (tail) …\n" : "") + res.text })))
            .catch(() => {});
        }
      } catch (_) { /* a run may have no files */ }
      setBusy("");
      return;
    }
    for (const name of LOG_FILES) {
      fromGithub(source, `logs/${folder}/${name}`)
        .then(text => setFiles(prev => ({ ...prev, [name]: text })))
        .catch(() => {});   // a run may simply not have every file
    }
    setBusy("");
  };

  const folderOf = (row) => {
    if (row.folder) return row.folder;
    const match = /\(([^)]+)\/results\.md\)/.exec(row["Folder"] || "");
    return match ? match[1] : (row["Folder"] || "").replace(/[[\]]/g, "");
  };

  const badge = mode === "github" ? "FROM GITHUB" : mode === "local" ? "FROM THIS INSTANCE" : "NO LOGS";
  return e("div", { className: "space-y-4" },
    e("div", { className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-2" },
      e("div", { className: "flex justify-between items-center" },
        e("h2", { className: "font-bold text-lg text-indigo-300" }, "Harness logs 📜"),
        e("span", { className: "fast-badge" }, badge)
      ),
      e("p", { className: "text-sm text-slate-400" },
        mode === "local"
          ? "Read from the reports stored on this instance, capped per file. This is the fallback used when the deployment has no git checkout to read the committed logs from."
          : "Read straight from the repository by your browser. This deployment never reads, stores or serves these files, so opening this tab puts no load on the service."),
      source && source.available && e("p", { className: "text-[10px] font-mono text-slate-500 break-all" },
        `${source.slug} @ ${source.branch}` + (source.via === "config" ? " (from TF_GITHUB_REPO, no checkout needed)" : "")),
      mode === "local" && source && source.local && e("p", { className: "text-[10px] font-mono text-slate-500 break-all" },
        `${source.local.logs_dir}`),
      source && !source.available && source.fixes && e("div", { className: "text-[10px] text-amber-300/80 space-y-0.5" },
        e("div", { className: "font-bold" }, "Make committed logs readable here:"),
        source.fixes.map(fix => e("div", { key: fix, className: "font-mono" }, "• " + fix)))
    ),
    loading && e("p", { className: "text-sm text-slate-400" }, "Fetching log index…"),
    notice && e("p", { role: "status", className: "text-xs text-amber-300" }, notice),
    error && e("p", { role: "alert", className: "text-sm text-red-300" }, error),
    !loading && !error && rows.length === 0 && e("p", { className: "text-sm text-slate-500 text-center py-6" },
      mode === "local" ? "No harness runs are stored on this instance yet." : "No committed harness runs on this branch yet."),
    rows.map((row, i) => {
      const folder = folderOf(row);
      const isOpen = open === folder;
      return e("div", { key: folder || i, className: "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden" },
        e("button", { className: "p-4 w-full text-left flex justify-between items-center gap-2", onClick: () => openRun(folder) },
          e("div", {},
            e("div", { className: "font-bold text-xs font-mono" }, row["Started"] || folder),
            e("div", { className: "text-[10px] text-slate-400 mt-0.5" },
              `${row["Passed"] || 0} passed · ${row["Failed"] || 0} failed · ${row["Skipped"] || 0} skipped · rev ${row["Revision"] || "?"}`)
          ),
          e("span", { className: "text-[10px] px-2 py-1 rounded font-bold " +
            ((row["Result"] || "").toUpperCase() === "PASS" ? "bg-emerald-900 text-emerald-200" : "bg-red-900 text-red-200") },
            row["Result"] || "?")
        ),
        isOpen && e("div", { className: "p-3 space-y-2 border-t border-slate-800" },
          busy === folder && e("p", { className: "text-xs text-slate-400" }, mode === "local" ? "Reading from this instance…" : "Fetching from GitHub…"),
          Object.keys(files).length === 0 && busy !== folder && e("p", { className: "text-xs text-slate-500" }, "No log files found for this run."),
          Object.entries(files).map(([name, text]) => e("details", { key: name, open: name === "results.md", className: "bg-slate-950 rounded border border-slate-800" },
            e("summary", { className: "text-[10px] font-mono p-2 cursor-pointer text-indigo-300" }, name),
            e("pre", { className: "text-[9px] p-2 overflow-x-auto max-h-64 overflow-y-auto whitespace-pre-wrap text-slate-300" }, text)
          )),
          mode === "github" && source && source.slug && e("a", { href: `https://github.com/${source.slug}/tree/${source.branch}/logs/${folder}`, target: "_blank", rel: "noopener noreferrer",
                   className: "block text-center text-[10px] text-indigo-300 underline pt-1" }, "Open this run on GitHub")
        )
      );
    })
  );
}

function Github() {
  const [info, setInfo] = useState(null);
  const [error, setError] = useState("");
  const [note, setNote] = useState("");
  const [plan, setPlan] = useState(null);
  const [publishing, setPublishing] = useState(false);
  const [fastInfo, setFastInfo] = useState(null);
  const load = () => {
    API.get("/api/library").then(data => { setInfo(data); setError(""); }).catch(err => setError(err.message));
    API.get("/api/library/fast").then(setFastInfo).catch(() => {});
  };
  useEffect(() => { load(); }, []);
  const preview = async () => {
    setNote("Comparing this instance with the remote branch…");
    try {
      const result = await API.get("/api/library/publish/plan");
      setPlan(result);
      setNote(result.available
        ? `${result.added || 0} new, ${result.changed || 0} changed, ${result.removed || 0} deleted file(s) to publish.`
        : (result.reason || result.error || "Nothing to compare."));
    } catch (err) { setNote(""); setError(err.message); }
  };
  const publish = async () => {
    setPublishing(true);
    try {
      const result = await API.post("/api/library/publish", {});
      setInfo(result);
      setError("");
      setNote(result.publish_message || result.message || "");
      load();
    } catch (err) {
      setError(err.message);
    } finally {
      setPublishing(false);
    }
  };
  const sync = async () => {
    setPublishing(true);
    try {
      const result = await API.post("/api/sync/github", {});
      setError("");
      setNote(result.message || "");
      load();
    } catch (err) {
      setError(err.message);
    } finally {
      setPublishing(false);
    }
  };
  const repositoryUrl = (info && info.repository_url) || "https://github.com/Raheelatta1984/testforge";
  const tree = repositoryUrl + "/tree/" + encodeURIComponent((info && info.branch) || "HEAD") + "/library";
  const projects = (info && info.projects) || [];
  return e('div', { className: "py-8 px-5 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl space-y-4" },
    e('div', {className:"text-5xl text-center"}, "🐙"),
    e('div', { className: "flex justify-center gap-2 items-center" },
      e('h2', {className:"font-bold text-xl text-indigo-300 text-center"}, "GITHUB LIBRARY"),
      e('span', { className: "fast-badge" },
        (info && info.publish_mode === "api") ? "GITHUB API ⚡"
        : (info && info.publish_enabled) ? "GIT CHECKOUT ⚡" : "LOCAL ONLY")
    ),
    e('p', {className:"text-sm text-slate-400"},
      "Projects, variables and recordings live in the library/ folder of the repository. Saving commits and publishes them, " +
      "either with git push from a checkout or, in a container that has no checkout, through the GitHub API. " +
      "Repeated actions are stored as one step with a repeat count."),
    info && e('div', { className: "text-xs text-slate-400 font-mono space-y-1" },
      e('div', {}, "Branch " + (info.branch
        ? info.branch + (info.publish_mode === "api" ? " (GitHub API — no checkout here)" : " (checked out)")
        : "— " + (info.git_state === "no-checkout" ? "(no git checkout here)" : "(unknown)"))),
      e('div', { className: info.remote_verification?.synced ? "text-emerald-400" : "text-amber-300" },
        info.remote_verification?.synced
          ? "Remote verified: fully synced"
          : "Remote not verified / sync pending" + (info.remote_verification?.state ? " · " + info.remote_verification.state : "")),
      e('div', {}, "Revision " + (info.revision || info.remote_verification?.revision || "—")),
      e('div', {}, info.publish_enabled
        ? (info.publish_mode === "api"
            ? `Publishing enabled through the GitHub API to ${info.api_publish?.slug || "the repository"} ⚡`
            : "Push to the checked-out branch enabled ⚡")
        : "Publishing disabled"),
      info.dirty && e('div', { className: "text-amber-300" }, "Unpublished changes - will push to the active branch immediately"),
      fastInfo && e('div', { className: "text-emerald-400" }, `Fast load: ${fastInfo.load_time || "cached"} from catalog ⚡`)
    ),
    info && info.git_note && e('div', { role: "status", className: "text-[11px] bg-slate-950 border border-slate-800 text-slate-300 p-3 rounded-xl" },
      e('div', { className: "font-bold mb-1 text-indigo-300" }, "How this deployment publishes"),
      e('p', {}, info.git_note),
      info.last_api_push && e('p', { className: "mt-1 text-[10px] text-emerald-300/80 font-mono break-all" },
        `Last API commit ${String(info.last_api_push.commit || "").slice(0, 7)} · ${info.last_api_push.total || 0} file(s) · ${info.last_api_push.elapsed || 0}s`)
    ),
    info && info.status_reason && e('div', { role: "status", className: "text-[11px] bg-amber-950/40 border border-amber-800/40 text-amber-200 p-3 rounded-xl" },
      e('div', { className: "font-bold mb-1" }, "Why the panel reads this way"),
      e('p', {}, info.status_reason),
      info.remote_verification?.reason && e('p', { className: "mt-1 text-amber-300/80" }, info.remote_verification.reason),
      info.git_state === "no-checkout" && e('p', { className: "mt-2 text-[10px] text-amber-300/70" },
        "Library folder: " + (info.library_dir || "library") + " · " + (info.projects_on_disk || 0) + " project(s) on disk · catalog " + (info.catalog_present ? "present" : "missing")),
      info.git_state === "no-checkout" && e('p', { className: "mt-2 text-[10px] text-amber-300/70 font-mono" },
        "To enable publishing: set TF_GITHUB_REPO=owner/name and TF_GITHUB_TOKEN (repo scope), or mount a git checkout.")
    ),
    e('div', { className: "space-y-2" },
      projects.length === 0 && e('p', { className: "text-sm text-slate-500 text-center" },
        info && info.projects_error
          ? "Projects could not be listed: " + info.projects_error
          : info && info.projects_on_disk > 0
            ? `${info.projects_on_disk} project(s) are on disk but are not listed. Reload, or create a project to rebuild the catalog.`
            : "No projects in the branch yet."),
      projects.map(project => e('div', { key: project.id, className: "p-3 bg-slate-950 rounded-xl border border-slate-800" },
        e('div', { className: "flex justify-between" },
          e('div', { className: "font-bold text-sm" }, project.name),
          e('span', { className: "text-[8px] bg-emerald-900 px-1 rounded" }, "BRANCH")
        ),
        e('div', { className: "text-[10px] text-slate-500 font-mono" }, project.repository_path),
        (project.variables || []).length > 0 && e('div', { className: "text-[10px] text-indigo-300 mt-1" }, "Variables: " + project.variables.join(", ") + " (reusable)"),
        (project.recordings || []).map(rec => e('div', { key: rec.id, className: "text-[10px] text-slate-400 mt-1 flex justify-between" },
          e('span', {}, rec.name + " · " + rec.step_count + " steps"),
          e('span', { className: "text-emerald-400" }, "branch")
        ))
      ))
    ),
    error && e('p', { role: "alert", className: "text-sm text-red-300" }, error),
    e('div', { className: "flex flex-col gap-2" },
      e('a', { href: tree, target: "_blank", rel: "noopener noreferrer", className: "text-center bg-slate-700 px-8 py-3 rounded-2xl font-bold" }, "OPEN LIBRARY ON GITHUB BRANCH"),
      e('button', { type: "button", onClick: publish, disabled: publishing || !(info && info.publish_enabled),
        title: (info && info.publish_enabled) ? "" : (info && info.publish_disabled_reason) || "Publishing is disabled in this deployment",
        className: "bg-indigo-600 disabled:opacity-40 disabled:cursor-not-allowed px-8 py-3 rounded-2xl font-bold" },
        publishing ? "PUBLISHING…⚡"
          : (info && info.publish_enabled)
            ? (info.publish_mode === "api" ? "PUBLISH LIBRARY VIA GITHUB API ⚡" : "PUSH LIBRARY TO GITHUB ⚡")
            : "PUBLISHING DISABLED"),
      e('button', { type: "button", onClick: sync, disabled: publishing || !(info && info.publish_enabled),
        title: (info && info.publish_enabled) ? "" : (info && info.publish_disabled_reason) || "Nothing to verify: publishing is disabled",
        className: "bg-emerald-600 disabled:opacity-40 disabled:cursor-not-allowed px-8 py-3 rounded-2xl font-bold" },
        publishing ? "SYNCING…⚡" : "VERIFY / SYNC NOW ⚡"),
      e('button', { type: "button", onClick: preview, disabled: publishing || !(info && info.publish_enabled),
        className: "bg-slate-700 disabled:opacity-40 px-8 py-3 rounded-2xl font-bold" }, "WHAT WOULD THIS PUBLISH?")
    ),
    plan && plan.available && e('div', { className: "text-[10px] font-mono text-slate-400 bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1" },
      e('div', {}, `${plan.slug || ""}@${plan.branch || ""} · remote ${String(plan.remote_sha || "—").slice(0, 7)} · ${plan.files || 0} local file(s), ${Math.round((plan.bytes || 0) / 1024)}KB`),
      e('div', { className: "text-emerald-300" }, `new: ${(plan.added || []).join(", ") || "none"}`),
      e('div', { className: "text-amber-300" }, `changed: ${(plan.changed || []).join(", ") || "none"}`),
      e('div', { className: "text-red-300" }, `deleted on remote: ${(plan.removed || []).join(", ") || "none"}`),
      (plan.skipped || []).length > 0 && e('div', { className: "text-slate-500" },
        `skipped: ${plan.skipped.map(s => s.path + " (" + s.reason + ")").join(", ")}`)
    ),
    note && e('p', { role: "status", className: "text-xs text-emerald-300" }, note),
    e('p', { className: "text-xs text-slate-500" },
      (info && info.publish_enabled)
        ? "Every publish is verified by reading the remote branch back. A push that GitHub rejects stays pending and is retried once a minute; the local library is never rolled back."
        : "Publishing is disabled here, so saves stay on this instance and no retry is scheduled. Configure TF_GITHUB_REPO with TF_GITHUB_TOKEN (or mount a checkout) to enable it.")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
