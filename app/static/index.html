<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: #020617; color: #f8fafc; font-family: sans-serif; }
  .canvas-img { image-rendering: auto; user-select: none; }
</style>
</head>
<body>
<div id="root">
  <div style="padding: 40px; text-align: center;"><h2>⚡ Loading TestForge Enterprise...</h2></div>
</div>

<script>
const { useState, useEffect, useRef, useCallback } = React;
const e = React.createElement;

const API = {
  async req(m, u, b) {
    const r = await fetch(u, { method: m,
      headers: { "Content-Type": "application/json" },
      body: b !== undefined ? JSON.stringify(b) : undefined });
    if (!r.ok) throw new Error((await r.text()).slice(0, 300));
    return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
  },
  get: (u) => API.req("GET", u),
  post: (u, b) => API.req("POST", u, b),
  del: (u) => API.req("DELETE", u),
};

function Badge(props) {
  return e('span', { className: `text-[10px] px-1.5 py-0.5 rounded ${props.color || "bg-slate-700"}` }, props.children);
}

function App() {
  const [tab, setTab] = useState("projects");
  const [projects, setProjects] = useState([]);
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || "null"));
  const [activeRun, setActiveRun] = useState(null);

  const loadProjects = () => API.get("/api/projects").then(setProjects).catch(console.error);
  useEffect(() => { loadProjects(); }, []);

  const selectProject = (p) => {
    setActiveProject(p);
    localStorage.setItem("tf_project", JSON.stringify(p));
  };

  const tabs = [
    ["projects", "📁 Projects"], ["variables", "🔤 Variables"],
    ["record", "⏺ AI Record"], ["library", "📚 Library"],
    ["scenarios", "✨ Jenkins Gherkin"], ["runs", "▶ Runs"]
  ];

  return e('div', { className: "min-h-screen pb-20" },
    e('header', { className: "sticky top-0 z-10 bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center gap-2" },
      e('span', { className: "font-bold text-lg text-indigo-400" }, "⚡ TestForge AI"),
      activeProject && e(Badge, { color: "bg-indigo-700" }, activeProject.name)
    ),
    e('main', { className: "p-3 max-w-3xl mx-auto" },
      tab === "projects" && e(Projects, { projects, active: activeProject, onSelect: selectProject, onChanged: loadProjects }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject, onDone: () => setTab("library") }),
      tab === "library" && e(Library, { project: activeProject }),
      tab === "scenarios" && e(Scenarios, { project: activeProject, onRun: (id) => { setActiveRun(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { activeRun, setActiveRun })
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex overflow-x-auto z-20" },
      tabs.map(([k, label]) =>
        e('button', {
          key: k, onClick: () => setTab(k),
          className: `flex-1 py-3 text-xs whitespace-nowrap px-2 ${tab === k ? "text-indigo-400 border-t-2 border-indigo-400 font-bold" : "text-slate-400"}`
        }, label)
      )
    )
  );
}

function NeedProject() {
  return e('div', { className: "text-center text-slate-400 mt-16 bg-slate-900 p-6 rounded-lg border border-slate-800" },
    e('p', { className: "text-lg mb-2" }, "⚠️ Project Required"),
    e('p', { className: "text-xs text-slate-500" }, "Please create or select a project in the Projects tab first.")
  );
}

function Projects({ projects, active, onSelect, onChanged }) {
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const create = async () => {
    if (!name.trim()) return;
    const p = await API.post("/api/projects", { name, base_url: url });
    setName(""); setUrl(""); onChanged(); onSelect(p);
  };
  return e('div', { className: "space-y-3" },
    e('div', { className: "bg-slate-900 rounded-lg p-4 space-y-2 border border-slate-800" },
      e('h2', { className: "font-bold text-sm text-indigo-300" }, "📁 Create New Project (AI Auto-Seeds Variables)"),
      e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Project Name", value: name, onChange: e => setName(e.target.value) }),
      e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Base URL (https://app.example.com)", value: url, onChange: e => setUrl(e.target.value) }),
      e('button', { onClick: create, className: "w-full bg-indigo-600 hover:bg-indigo-500 rounded py-2 font-semibold text-sm" }, "⚡ Create Project")
    ),
    projects.map(p =>
      e('div', {
        key: p.id, onClick: () => onSelect(p),
        className: `bg-slate-900 rounded-lg p-3 cursor-pointer border ${active?.id === p.id ? "border-indigo-500 bg-slate-850" : "border-slate-800"}`
      },
        e('div', { className: "font-semibold text-sm" }, p.name),
        e('div', { className: "text-xs text-slate-400 truncate" }, p.base_url || "No base URL")
      )
    )
  );
}

function Variables({ project }) {
  const [vars, setVars] = useState([]);
  const [name, setName] = useState("");
  const [val, setVal] = useState("");

  const load = () => { if (!project) return; API.get(`/api/variables?project_id=${project.id}`).then(setVars); };
  useEffect(() => { load(); }, [project]);

  if (!project) return e(NeedProject);

  const add = async () => {
    if (!name.trim()) return;
    await API.post("/api/variables", { scope: "project", project_id: project.id, name, value: val });
    setName(""); setVal(""); load();
  };

  const aiSuggest = async () => {
    const res = await API.post("/api/ai/suggest-variables", { project_name: project.name });
    for (let s of res.suggestions) {
      await API.post("/api/variables", { scope: "project", project_id: project.id, name: s.name, value: s.value });
    }
    load();
  };

  return e('div', { className: "space-y-3" },
    e('div', { className: "flex justify-between items-center" },
      e('h2', { className: "font-bold text-sm" }, "🔤 Scoped Test Variables"),
      e('button', { onClick: aiSuggest, className: "bg-purple-600 text-xs px-3 py-1.5 rounded font-bold" }, "✨ AI Suggest Variables")
    ),
    e('div', { className: "bg-slate-900 rounded-lg p-3 space-y-2 border border-slate-800" },
      e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Variable Name (e.g. username)", value: name, onChange: e => setName(e.target.value) }),
      e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Value", value: val, onChange: e => setVal(e.target.value) }),
      e('button', { onClick: add, className: "w-full bg-indigo-600 rounded py-2 text-sm font-semibold" }, "+ Add Variable")
    ),
    vars.map(v =>
      e('div', { key: v.id, className: "bg-slate-900 rounded-lg p-3 border border-slate-800 flex justify-between text-xs" },
        e('div', {}, e('code', { className: "text-indigo-400 font-bold" }, `{{${v.name}}}`), e('span', { className: "text-slate-400 ml-2" }, `= ${v.value}`)),
        e('button', { onClick: async () => { await API.del(`/api/variables/${v.id}`); load(); }, className: "text-red-400 font-bold" }, "✕")
      )
    )
  );
}

function Recorder({ project, onDone }) {
  const [name, setName] = useState("");
  const [url, setUrl] = useState(project?.base_url || "");
  const [recId, setRecId] = useState(null);
  const [steps, setSteps] = useState([]);

  if (!project) return e(NeedProject);

  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: name || "AI Recording", start_url: url, shared: false });
    setSteps([]); setRecId(r.id);
  };

  if (recId) return e(LiveRecorder, { recId, project, steps, setSteps, onDone: () => { setRecId(null); onDone(); } });

  return e('div', { className: "space-y-3 bg-slate-900 p-4 rounded-lg border border-slate-800" },
    e('h2', { className: "font-bold text-sm text-indigo-300" }, "⏺ AI-Powered Browser Recorder"),
    e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Recording Name", value: name, onChange: e => setName(e.target.value) }),
    e('input', { className: "w-full bg-slate-800 rounded px-3 py-2 text-white text-sm", placeholder: "Start URL (https://...)", value: url, onChange: e => setUrl(e.target.value) }),
    e('button', { onClick: start, className: "w-full bg-red-600 rounded py-2.5 font-bold text-sm" }, "● Launch Browser Recorder")
  );
}

function LiveRecorder({ recId, project, steps, setSteps, onDone }) {
  const [frame, setFrame] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [text, setText] = useState("");
  const [vars, setVars] = useState([]);
  const [aiTip, setAiTip] = useState("");
  const wsRef = useRef(null);

  useEffect(() => {
    API.get(`/api/variables?project_id=${project.id}`).then(setVars);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/record/${recId}`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
      else if (m.type === "step") setSteps(s => [...s, m.step]);
      else if (m.type === "stopped") onDone();
    };
    wsRef.current = ws;
    return () => { try { ws.send(JSON.stringify({ type: "stop" })); } catch(_){} ws.close(); };
  }, [recId]);

  const send = (o) => { if (wsRef.current?.readyState === 1) wsRef.current.send(JSON.stringify(o)); };
  const tap = (evt) => {
    const r = evt.currentTarget.getBoundingClientRect();
    const x = (evt.clientX - r.left) / zoom;
    const y = (evt.clientY - r.top) / zoom;
    send({ type: "tap", x: Math.round(x / r.width * 1280), y: Math.round(y / r.height * 800) });
  };

  const askAi = async () => {
    setAiTip("🤖 AI analyzing screen and suggesting next action...");
    const res = await API.post("/api/ai/suggest-step", {});
    setAiTip(`💡 AI Suggestion: ${res.suggestion}`);
  };

  return e('div', { className: "space-y-2" },
    e('div', { className: "flex items-center gap-2 bg-slate-900 p-2 rounded border border-slate-800 text-xs" },
      e('span', { className: "w-2 h-2 rounded-full bg-red-500 animate-pulse" }),
      e('span', { className: "font-bold" }, "Recording Active"),
      e('button', { onClick: askAi, className: "bg-purple-600 px-2 py-1 rounded text-[10px] font-bold" }, "✨ Ask AI"),
      e('div', { className: "ml-auto flex gap-1" },
        e('button', { onClick: () => setZoom(z => Math.max(1, z - 0.25)), className: "bg-slate-800 px-2 py-1 rounded" }, "🔍-"),
        e('button', { onClick: () => setZoom(z => Math.min(2, z + 0.25)), className: "bg-slate-800 px-2 py-1 rounded" }, "🔍+"),
        e('button', { onClick: () => send({ type: "stop" }), className: "bg-red-700 font-bold px-3 py-1 rounded text-white ml-2" }, "⏹ Save")
      )
    ),
    aiTip && e('div', { className: "bg-purple-950/80 border border-purple-800 p-2 rounded text-xs text-purple-200" }, aiTip),
    e('div', { className: "bg-black rounded-lg overflow-auto border border-slate-700 max-h-[350px] flex justify-center" },
      frame ? e('img', { className: "canvas-img", style: { transform: `scale(${zoom})`, transformOrigin: "top left" }, src: frame, onClick: tap, draggable: "false" })
            : e('div', { className: "h-40 flex items-center justify-center text-slate-500 text-xs" }, "Connecting browser...")
    ),
    e('div', { className: "flex gap-1 flex-wrap" },
      vars.map(v => e('button', { key: v.id, onClick: () => setText(t => t + `{{${v.name}}}`), className: "bg-indigo-900/60 border border-indigo-700 text-indigo-200 text-[10px] px-2 py-0.5 rounded" }, `+ {{${v.name}}}`))
    ),
    e('div', { className: "flex gap-1" },
      e('input', { className: "flex-1 bg-slate-800 rounded px-3 py-1.5 text-xs text-white", placeholder: "Type value or variables...", value: text, onChange: e => setText(e.target.value) }),
      e('button', { onClick: () => { if (text) { send({ type: "text", text }); setText(""); } }, className: "bg-indigo-600 px-3 py-1.5 rounded text-xs" }, "Type")
    ),
    e('div', { className: "bg-slate-900 rounded p-2 max-h-28 overflow-y-auto text-xs" },
      steps.map((s, i) => e('div', { key: i, className: "py-0.5 border-b border-slate-800" }, `${s.order}. ${s.action} -> ${s.label || s.value || ''}`))
    )
  );
}

function Library({ project }) {
  const [recs, setRecs] = useState([]);
  const load = () => project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs);
  useEffect(() => { load(); }, [project]);

  if (!project) return e(NeedProject);

  return e('div', { className: "space-y-3" },
    e('h2', { className: "font-bold text-sm" }, "📚 Recording Library & Jenkins Exporters"),
    recs.map(r =>
      e('div', { key: r.id, className: "bg-slate-900 rounded-lg p-3 border border-slate-800 space-y-2 text-xs" },
        e('div', { className: "flex justify-between items-center" },
          e('div', { className: "font-semibold" }, r.name),
          e('button', { onClick: () => API.post("/api/runs", { target_type: "recording", target_id: r.id }).then(() => alert("Run started! Check Runs tab.")), className: "bg-emerald-600 px-3 py-1 rounded font-bold" }, "▶ Run")
        ),
        e('div', { className: "flex gap-1 flex-wrap pt-1" },
          e('a', { href: `/api/recordings/${r.id}/export/jenkins`, className: "bg-amber-800 hover:bg-amber-700 px-2.5 py-1 rounded text-[10px] font-bold text-white" }, "🥒 Jenkins .feature"),
          e('a', { href: `/api/recordings/${r.id}/export/playwright`, className: "bg-indigo-900 px-2 py-1 rounded text-[10px]" }, "📥 Playwright"),
          e('a', { href: `/api/recordings/${r.id}/export/selenium`, className: "bg-purple-900 px-2 py-1 rounded text-[10px]" }, "📥 Selenium")
        )
      )
    )
  );
}

function Scenarios({ project, onRun }) {
  const [story, setStory] = useState("");
  const [scenarios, setScenarios] = useState([]);

  const load = () => project && API.get(`/api/projects/${project.id}/scenarios`).then(setScenarios);
  useEffect(() => { load(); }, [project]);

  if (!project) return e(NeedProject);

  const generate = async () => {
    if (!story.trim()) return;
    await API.post("/api/scenarios", { project_id: project.id, source_text: story });
    setStory(""); load();
  };

  return e('div', { className: "space-y-3" },
    e('div', { className: "bg-slate-900 p-4 rounded-lg border border-slate-800 space-y-2" },
      e('h2', { className: "font-bold text-sm text-indigo-300" }, "🥒 Jenkins Gherkin AI Scenario Generator"),
      e('textarea', { className: "w-full bg-slate-800 rounded p-2 text-xs text-white h-24", placeholder: "Paste user story / acceptance criteria...", value: story, onChange: e => setStory(e.target.value) }),
      e('button', { onClick: generate, className: "w-full bg-indigo-600 py-2 rounded text-xs font-bold" }, "✨ Generate Gherkin Feature")
    ),
    scenarios.map(sc =>
      e('div', { key: sc.id, className: "bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-2 text-xs" },
        e('div', { className: "flex justify-between items-center" },
          e('span', { className: "font-bold text-indigo-400" }, sc.title),
          e('button', { onClick: () => onRun(sc.id), className: "bg-emerald-600 px-3 py-1 rounded font-bold" }, "▶ Run")
        ),
        e('div', { className: "bg-black p-2 rounded font-mono text-[11px] text-slate-300 space-y-1" },
          sc.steps.map((st, i) => e('div', { key: i }, st.expected_result || `${st.action} ${st.value || ''}`))
        )
      )
    )
  );
}

function Runs({ activeRun, setActiveRun }) {
  const [runs, setRuns] = useState([]);
  const [selectedRun, setSelectedRun] = useState(null);

  const load = () => API.get("/api/runs").then(setRuns).catch(() => {});
  useEffect(() => { load(); const t = setInterval(load, 3000); return () => clearInterval(t); }, []);

  return e('div', { className: "space-y-3" },
    e('h2', { className: "font-bold text-sm" }, "▶ Step-by-Step AI Execution & Screenshot Logs"),
    runs.map(r =>
      e('div', { key: r.id, className: "bg-slate-900 p-3 rounded-lg border border-slate-800 text-xs space-y-2" },
        e('div', { className: "flex justify-between items-center" },
          e('span', { className: `font-bold px-2 py-0.5 rounded ${r.status === 'passed' ? 'bg-emerald-900 text-emerald-200' : 'bg-red-900 text-red-200'}` }, r.status.toUpperCase()),
          e('span', { className: "text-slate-400" }, r.created_at.slice(11, 19))
        ),
        e('div', { className: "text-slate-300 font-mono text-[11px]" }, `Target ID: ${r.target_id}`),
        e('div', { className: "space-y-2 pt-2 border-t border-slate-800" },
          (r.log || []).map((step, i) =>
            e('div', { key: i, className: "bg-slate-950 p-2 rounded border border-slate-850 space-y-1" },
              e('div', { className: "flex items-center gap-2" },
                e('span', {}, step.status === "passed" ? "✅" : "❌"),
                e('span', { className: "font-bold text-indigo-300" }, `Step ${step.order}: ${step.action}`),
                e('span', { className: "text-slate-400 text-[10px] ml-auto" }, step.label)
              ),
              step.screenshot && e('div', { className: "mt-1" },
                e('img', { src: step.screenshot, className: "rounded border border-slate-700 max-h-48 w-full object-cover", alt: "Step validation screenshot" })
              ),
              step.error && e('div', { className: "text-red-400 text-[10px] font-mono bg-red-950/40 p-1 rounded" }, step.error)
            )
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
