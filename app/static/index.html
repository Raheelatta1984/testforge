<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge AI Hybrid</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow-x: hidden; }
  .canvas-img { width: 100%; height: auto; border-radius: 12px; border: 1px solid #334155; }
  .nav-btn { flex: 1; padding: 12px 4px; font-size: 10px; font-weight: bold; color: #64748b; border-top: 2px solid transparent; transition: all 0.2s; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .progress-fill { height: 100%; background: #6366f1; transition: width 0.5s ease-in-out; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;

const API = {
  get: u => fetch(u).then(r => r.json()),
  post: (u, b) => fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  patch: (u, b) => fetch(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json()),
  del: u => fetch(u, {method:'DELETE'}).then(r => r.json())
};

function App() {
  const [tab, setTab] = useState("record");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || '{"id":"default","name":"Local_Mobile"}'));
  const [activeRunId, setActiveRunId] = useState(null);

  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["github","🐙"]];

  return e('div', { className: "min-h-screen pb-24" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-950/80 backdrop-blur z-40" },
      e('span', { className: "font-bold text-indigo-400" }, "⚡ TESTFORGE HYBRID"),
      e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('main', { className: "p-4 max-w-2xl mx-auto" },
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "comparison" && e(Comparison),
      tab === "projects" && e(Projects, { setActiveProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "artifacts" && e(Artifacts),
      tab === "github" && e(Github)
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex z-50 overflow-x-auto" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Recorder({ project }) {
  const [frame, setFrame] = useState(null);
  const [recId, setRecId] = useState(null);
  const [zoom, setZoom] = useState(1);
  const ws = useRef(null);

  const start = async () => {
    const r = await API.post("/api/recordings", { project_id: project.id, name: "New AI Session", start_url: "https://google.com" });
    setRecId(r.id);
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws.current = new WebSocket(`${proto}://${location.host}/ws/record/${r.id}`);
    ws.current.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
    };
  };

  const send = (m) => ws.current?.send(JSON.stringify(m));

  if (recId) return e('div', { className: "space-y-4" },
    e('div', { className: "flex justify-between" },
      e('button', { onClick: () => setZoom(z => z + 0.1), className: "bg-slate-800 p-2 rounded" }, "🔍+"),
      e('button', { onClick: () => { send({type:"stop"}); setRecId(null); }, className: "bg-red-600 px-6 rounded font-bold" }, "SAVE")
    ),
    e('div', { className: "overflow-auto bg-black rounded-xl" },
      frame && e('img', { src: frame, className: "canvas-img origin-top-left", style: { transform: `scale(${zoom})` }, onClick: (evt) => {
        const r = evt.target.getBoundingClientRect();
        send({ type: "tap", x: Math.round(((evt.clientX - r.left)/zoom / r.width) * 1280), y: Math.round(((evt.clientY - r.top)/zoom / r.height) * 800) });
      }})
    )
  );

  return e('button', { onClick: start, className: "w-full bg-red-600 py-10 rounded-2xl font-bold" }, "● START AI RECORDING");
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [percent, setPercent] = useState(0);
  const [frame, setFrame] = useState(null);

  const load = () => API.get("/api/runs").then(setRuns);
  useEffect(() => { load(); }, []);

  useEffect(() => {
    if (runId) {
      const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/runs/${runId}`);
      ws.onmessage = ev => {
        const m = JSON.parse(ev.data);
        if (m.type === "frame") setFrame("data:image/jpeg;base64," + m.data);
        if (m.type === "step") {
            setActiveLog(prev => [...prev.filter(x => x.order !== m.order), m]);
            setPercent(m.percent || 0);
        }
        if (m.type === "done") { setPercent(100); load(); }
      };
      return () => ws.close();
    }
  }, [runId]);

  return e('div', { className: "space-y-4" },
    runId && e('div', { className: "bg-slate-900 border-2 border-indigo-500 rounded-2xl p-4 space-y-3" },
      e('div', { className: "flex justify-between text-xs font-bold" }, e('span', {}, "LIVE PROGRESS"), e('span', {}, `${percent}%`)),
      e('div', { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden" }, e('div', { className: "progress-fill", style: { width: `${percent}%` } })),
      e('img', { src: frame, className: "w-full rounded bg-black" }),
      e('div', { className: "space-y-1" }, activeLog.sort((a,b)=>b.order-a.order).map((s,i) => e('div', {key:i, className:"text-[10px] flex justify-between"}, e('span',{},s.label), e('span',{},s.status==='passed'?'✅':'⏳'))))
    ),
    runs.map(r => e('div', { key: r.id, onClick: () => setRunId(r.id), className: "p-4 bg-slate-900 rounded-xl border border-slate-800 flex justify-between cursor-pointer" }, e('span', {}, `Run ${r.id.slice(0,8)}`), e('span', {}, r.status)))
  );
}

function Comparison() {
  const [runs, setRuns] = useState([]);
  useEffect(() => { API.get("/api/runs").then(setRuns); }, []);
  return e('div', { className: "space-y-4" }, runs.map(r => e('div', { key: r.id, className: "bg-slate-900 p-4 rounded-xl border border-slate-800" }, 
    e('div', { className: "grid grid-cols-2 gap-2" }, 
      e('div', {className:"text-[10px] text-purple-400 font-bold"}, "BASELINE RECORDING"),
      e('div', {className:"text-[10px] text-emerald-400 font-bold"}, "ACTUAL EXECUTION")
    ),
    e('div', { className: "h-32 flex items-center justify-center text-slate-700 text-[10px]" }, "Logs & Diff View will populate after background analysis...")
  )));
}

function Projects({ setActiveProject }) { return e('div', {}, "Project selection and creation..."); }
function Variables() { return e('div', {}, "Variable management..."); }
function Library({ project, onRun }) { 
    const [recs, setRecs] = useState([]);
    useEffect(() => { project && API.get(`/api/projects/${project.id}/recordings`).then(setRecs); }, [project]);
    return e('div', {className:"space-y-2"}, recs.map(r => e('div', {key:r.id, className:"p-4 bg-slate-900 rounded-xl flex justify-between"}, e('span',{},r.name), e('button',{onClick:()=>onRun(r.id), className:"bg-emerald-600 px-4 py-1 rounded text-xs"},"RUN")))); 
}
function Artifacts() { return e('div', {className:"py-20 text-center text-slate-500"}, "Media center loading..."); }
function Github() { return e('div', {className:"text-center py-10"}, e('a', {href:"/api/sync/github-bundle", className:"bg-indigo-600 px-6 py-3 rounded-xl font-bold"}, "Download Sync Bundle")); }

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
