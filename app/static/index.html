<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TestForge Titan ERP - Optimized</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  body { background: #020617; color: #f8fafc; font-family: system-ui; overflow: hidden; height: 100vh; width: 100vw; }
  .nav-btn { flex: 1; padding: 12px; font-size: 11px; font-weight: bold; color: #64748b; border-top: 2px solid transparent; }
  .nav-btn.active { color: #818cf8; border-top-color: #818cf8; background: rgba(30, 41, 59, 0.5); }
  .content-area { height: calc(100vh - 75px); overflow-y: auto; padding: 15px; padding-bottom: 90px; }
  .canvas-window { background: #000; border: 2px solid #1e293b; border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; }
  .progress-bar { height: 100%; background: #6366f1; transition: width 0.4s ease; box-shadow: 0 0 15px #6366f1; }
  .key-btn { background: #1e293b; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #334155; }
  .browser-shell { background: #020617; border: 2px solid #334155; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 240px; }
  .browser-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #0f172a; border-bottom: 1px solid #1e293b; }
  .browser-url { flex: 1; font-size: 11px; color: #cbd5e1; background: #020617; border-radius: 999px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
  .dot.red { background: #ef4444; } .dot.yellow { background: #eab308; } .dot.green { background: #22c55e; }
  .browser-viewport { position: relative; background: #000; min-height: 200px; }
  .browser-viewport img { width: 100%; height: auto; display: block; cursor: crosshair; user-select: none; -webkit-user-drag: none; }
  .browser-wait { min-height: 180px; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 24px; font-size: 13px; background: #000; }
  .fast-badge { background: linear-gradient(90deg, #22c55e, #16a34a); color: white; font-size: 8px; padding: 2px 6px; border-radius: 999px; font-weight: bold; }
  .var-chip { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; padding: 2px 8px; border-radius: 999px; font-size: 10px; cursor: pointer; }
  .var-chip:hover { background: #312e81; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef } = React;
const e = React.createElement;
async function apiRequest(url, options = {}) {
  const response = await fetch(url, options);
  let payload = null;
  const text = await response.text();
  try { payload = JSON.parse(text); } catch (_) { payload = text; }
  if (!response.ok) {
    const detail = payload && (payload.detail || payload.message || payload);
    throw new Error(typeof detail === 'string' ? detail : `Request failed (${response.status})`);
  }
  return payload;
}
const API = {
  get: u => apiRequest(u),
  post: (u, b) => apiRequest(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  patch: (u, b) => apiRequest(u, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)}),
  del: u => apiRequest(u, {method:'DELETE'})
};

function AiInput({ value, onChange, placeholder, isArea }) {
  const [mic, setMic] = useState(false);
  const startMic = () => {
    const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.onstart = () => setMic(true); rec.onend = () => setMic(false);
    rec.onresult = (ev) => onChange({ target: { value: (value || "") + " " + ev.results[0][0].transcript } });
    rec.start();
  };
  return e('div', { className: "relative w-full" },
    e(isArea ? 'textarea' : 'input', { className: "w-full bg-slate-800 rounded-lg px-4 py-2 text-sm pr-20 border border-slate-700", placeholder, value, onChange }),
    e('div', { className: "absolute right-2 top-2 flex gap-1" },
      e('button', { onClick: startMic, className: `p-1 rounded ${mic?'bg-red-600 animate-pulse':'bg-slate-700'}` }, "🎤"),
      e('button', { onClick: async () => { const res = await API.post("/api/ai/rephrase", { text: value }); onChange({ target: { value: res.rephrased } }); }, className: "p-1 rounded bg-purple-900" }, "✨")
    )
  );
}

function App() {
  const [tab, setTab] = useState("projects");
  const [activeProject, setActiveProject] = useState(() => JSON.parse(localStorage.getItem("tf_project") || 'null'));
  const [activeRunId, setActiveRunId] = useState(null);
  const tabs = [["projects","📁"], ["variables","🔤"], ["record","⏺"], ["library","📚"], ["runs","▶"], ["comparison","⚖️"], ["artifacts","🎥"], ["github","🐙"]];

  return e('div', { className: "h-full flex flex-col" },
    e('header', { className: "p-4 border-b border-slate-800 flex justify-between bg-slate-950/80 backdrop-blur" },
      e('div', { className: "flex items-center gap-2" },
        e('span', { className: "font-bold text-indigo-400 tracking-tighter" }, "⚡ TITAN ROG ERP"),
        e('span', { className: "fast-badge" }, "FAST ⚡")
      ),
      activeProject && e('span', { className: "text-[10px] bg-indigo-900 px-2 py-1 rounded" }, activeProject.name)
    ),
    e('div', { className: "content-area" },
      tab === "projects" && e(Projects, { setActiveProject, activeProject }),
      tab === "variables" && e(Variables, { project: activeProject }),
      tab === "record" && e(Recorder, { project: activeProject }),
      tab === "library" && e(Library, { project: activeProject, onRun: (id) => { setActiveRunId(id); setTab("runs"); } }),
      tab === "runs" && e(Runs, { runId: activeRunId, setRunId: setActiveRunId }),
      tab === "comparison" && e(Comparison), tab === "artifacts" && e(Artifacts), tab === "github" && e(Github)
    ),
    e('nav', { className: "fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex" },
      tabs.map(([k, icon]) => e('button', { key: k, onClick: () => setTab(k), className: `nav-btn ${tab===k?'active':''}` }, icon))
    )
  );
}

function Recorder({ project }) {
  const [recId, setRecId] = useState(null);
  const [frame, setFrame] = useState(null);
  const [status, setStatus] = useState("");
  const [error, setError] = useState("");
  const [steps, setSteps] = useState([]);
  const [name, setName] = useState("");
  const [url, setUrl] = useState("");
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const [zoom, setZoom] = useState(1);
  const [armed, setArmed] = useState(null);
  const [variableName, setVariableName] = useState("");
  const [varsList, setVarsList] = useState([]);
  const recRef = useRef(null);
  const frameUrl = useRef(null);
  const initialStepsLoaded = useRef(false);

  useEffect(() => {
    if (!project) return;
    setUrl(prev => prev || project.base_url || "");
    setName(prev => prev || ("Session " + new Date().toLocaleString()));
    // Load variables for reuse in recording tab (requirement 2)
    API.get(`/api/projects/${project.id}/variables`).then(data => {
      setVarsList(data.variables || []);
    }).catch(() => {});
  }, [project]);
  useEffect(() => { recRef.current = recId; }, [recId]);
  useEffect(() => () => {
    const id = recRef.current;
    if (id) fetch("/api/recordings/" + id + "/stop", { method: "POST" }).catch(() => {});
  }, []);
  useEffect(() => {
    if (!recId) return undefined;
    let stop = false;
    const tick = async () => {
      if (stop) return;
      try {
        const session = await API.get("/api/recordings/" + recId + "/session");
        if (session.error) { setError(session.error); setStatus("Browser error"); }
        else if (session.status === "live") {
          setStatus("Browser live ⚡ FAST");
          if (!initialStepsLoaded.current) {
            API.get("/api/recordings/" + recId).then(recording => {
              if ((recording.steps || []).length >= session.seq) initialStepsLoaded.current = true;
              setSteps(prev => [...prev, ...(recording.steps || []).filter(step => !prev.some(item => item.id === step.id))]
                .sort((a, b) => b.order - a.order));
            }).catch(() => {});
          }
        }
        else if (session.status === "starting") setStatus("Launching browser… FAST");
        const res = await fetch("/api/recordings/" + recId + "/frame?t=" + Date.now());
        if (res.ok && (res.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await res.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
          if (!session.error) { setStatus("Browser live ⚡ FAST"); setError(""); }
        } else if (res.status !== 204) {
          let detail = "Browser unavailable (" + res.status + ")";
          try { const payload = await res.json(); detail = payload.detail || detail; } catch (_) {}
          setError(detail);
          setStatus("Browser error");
        }
      } catch (err) { setError(err.message); }
      if (!stop) setTimeout(tick, 150); // Faster polling for super fast feel (was 400)
    };
    tick();
    return () => { stop = true; };
  }, [recId]);

  if (!project) return e("div", { className: "py-20 text-center text-slate-500 font-bold" }, "SELECT A PROJECT TO BEGIN");

  const send = async (msg) => {
    try {
      const res = await API.post("/api/recordings/" + recId + "/input", msg);
      if (res.step) setSteps(prev => [res.step, ...prev.filter(step => step.id !== res.step.id)]);
      if (msg.type === "save_variable") {
        API.get(`/api/projects/${project.id}/variables`).then(data => setVarsList(data.variables || [])).catch(() => {});
      }
      setError("");
    } catch (err) { setError(err.message); }
  };
  const start = async () => {
    setBusy(true); setError("");
    try {
      const recording = await API.post("/api/recordings", {
        project_id: project.id,
        name: (name || "Session").trim(),
        start_url: (url || "").trim() || "/demo.html"
      });
      initialStepsLoaded.current = false;
      setSteps([]); setFrame(null); setStatus("Launching browser… FAST ⚡"); setRecId(recording.id);
      await API.post("/api/recordings/" + recording.id + "/session", {});
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  };
  const stop = async () => {
    const id = recId;
    recRef.current = null;
    if (!id) { setRecId(null); setFrame(null); setStatus(""); return; }
    setStatus("Saving recording…");
    try {
      const result = await API.post("/api/recordings/" + id + "/stop", {});
      if (result.publish_error) {
        setError(`Saved locally; GitHub push will retry in 1 minute: ${result.publish_error}`);
      } else {
        setError("");
      }
    } catch (err) {
      setError(err.message);
    } finally {
      setRecId(null); setFrame(null); setStatus("");
    }
  };

  const insertVariable = (varName) => {
    const placeholder = `{{${varName}}}`;
    setText(prev => prev + placeholder);
  };

  if (recId) return e("div", { className: "fixed inset-0 bg-slate-950 z-[100] flex flex-col p-2 gap-2" },
    e("div", { className: "flex justify-between items-center px-1" },
      e("span", { className: "text-xs font-bold " + (status.includes("live") ? "text-emerald-400" : "text-red-400") }, status === "Browser live ⚡ FAST" ? "● BROWSER LIVE ⚡ FAST" : "● " + (status || "RECORDING")),
      e("div", { className: "flex gap-1 items-center" },
        e("button", { onClick: () => setZoom(z => Math.max(0.5, +(z - 0.25).toFixed(2))), className: "key-btn", title: "Zoom out" }, "−"),
        e("span", { className: "text-xs" }, Math.round(zoom * 100) + "%"),
        e("button", { onClick: () => setZoom(z => Math.min(2, +(z + 0.25).toFixed(2))), className: "key-btn", title: "Zoom in" }, "+"),
        e("button", { onClick: stop, className: "bg-red-600 px-4 py-1 rounded font-bold text-xs" }, "SAVE"))
    ),
    error && e("p", { role: "alert", className: "text-sm text-red-300 px-1" }, error),
    e("div", { className: "browser-shell flex-1 min-h-0" },
      e("div", { className: "browser-bar" },
        e("span", { className: "dot red" }), e("span", { className: "dot yellow" }), e("span", { className: "dot green" }),
        e("span", { className: "browser-url" }, url || "/demo.html"),
        e("span", { className: "fast-badge ml-2" }, "FAST")
      ),
      e("div", { className: "browser-viewport flex-1 overflow-auto" },
        frame
          ? e("img", {
              src: frame, alt: "Remote browser", draggable: false,
              style: { width: (100 * zoom) + "%", maxWidth: "none" },
              onClick: (evt) => {
                const img = evt.target;
                const rect = img.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const x = Math.round((evt.clientX - rect.left) / rect.width * (img.naturalWidth || 1024));
                const y = Math.round((evt.clientY - rect.top) / rect.height * (img.naturalHeight || 640));
                send({ type: "tap", x: x, y: y });
              }
            })
          : e("div", { className: "browser-wait" }, error || status || "Starting the remote browser FAST…")
      )
    ),
    varsList.length > 0 && e("div", { className: "flex gap-1 flex-wrap px-1" },
      e("span", { className: "text-[10px] text-slate-500" }, "Variables:"),
      varsList.map(v => e("button", { key: v.id, onClick: () => insertVariable(v.name), className: "var-chip" }, `{{${v.name}}}`))
    ),
    steps.length > 0 && e("div", { className: "max-h-20 overflow-y-auto text-[10px] text-slate-400 px-1" },
      steps.map(step => e("div", { key: step.id || step.order, className: "flex justify-between" },
        e("span", {}, `${step.order}. ${step.label || step.action}`),
        step.repeat > 1 && e("span", { className: "text-emerald-400 font-bold" }, `×${step.repeat} 🔁`)
      ))
    ),
    e("div", { className: "bg-slate-900 p-2 space-y-2 rounded-xl" },
      e("p", { className: "text-[10px] text-slate-400" }, armed ? `Confirm ${armed}: tap again to send` : "Tap a command once to enlarge; tap again to execute."),
      e("div", { className: "flex flex-wrap gap-1" },
        ["Enter", "Tab", "Backspace", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Control", "Alt", "Control+c", "Control+v", "Control+s"].map(key =>
          e("button", { key, className: "key-btn " + (armed === key ? "scale-110 bg-indigo-600 border-indigo-300 z-10" : ""),
            onClick: () => { if (armed === key) { setArmed(null); send({ type: "key", key }); } else setArmed(key); } }, key))
      ),
      e("div", { className: "flex gap-1 items-center" },
        e("input", { value: variableName, onChange: evt => setVariableName(evt.target.value), placeholder: "Variable name for focused input", className: "flex-1 min-w-0 bg-slate-800 p-1 rounded text-xs" }),
        [false, true].map(existing => e("button", { key: String(existing), className: "key-btn " + (armed === (existing ? "update" : "new") ? "scale-110 bg-indigo-600" : ""),
          onClick: () => { const key = existing ? "update" : "new"; if (armed === key) { setArmed(null); send({ type: "save_variable", name: variableName, existing }); } else setArmed(key); } }, existing ? "Update variable" : "New variable"))
      ),
      e("div", { className: "flex gap-2" },
        e("input", {
          className: "flex-1 bg-slate-800 p-2 rounded text-sm", placeholder: "Type text or {{variable}}…", value: text,
          onChange: (evt) => setText(evt.target.value),
          onKeyDown: (evt) => { if (evt.key === "Enter" && text) { send({ type: "text", text: text }); setText(""); } }
        }),
        e("button", { className: "bg-indigo-600 px-4 rounded font-bold text-sm", onClick: () => { if (text) { send({ type: "text", text: text }); setText(""); } } }, "Type")
      ),
      e("p", { className: "text-[9px] text-slate-500" }, "💡 Each action is saved as an editable step in its original execution order.")
    )
  );

  return e("div", { className: "space-y-4" },
    e("div", { className: "bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3" },
      e("div", { className: "flex justify-between items-center" },
        e("h2", { className: "font-bold text-lg text-indigo-300" }, "Record in remote browser ⚡ FAST"),
        e("span", { className: "fast-badge" }, "OPTIMIZED")
      ),
      e("p", { className: "text-sm text-slate-400" }, "Opens Chromium on server (free-tier optimized, low CPU). SAVE pushes immediately to GitHub branch with description. Each step remains editable."),
      varsList.length > 0 && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800" },
        e("div", { className: "text-xs font-bold text-indigo-300 mb-2" }, `📦 ${varsList.length} Variables available for reuse:`),
        e("div", { className: "flex flex-wrap gap-1" },
          varsList.map(v => e("button", { key: v.id, onClick: () => insertVariable(v.name), className: "var-chip", title: `${v.name} = ${v.value}` }, `{{${v.name}}}`))
        ),
        e("p", { className: "text-[9px] text-slate-500 mt-2" }, "Click to insert into type field")
      ),
      e("label", { className: "block text-xs text-slate-400", htmlFor: "rec-name" }, "Recording name"),
      e("input", { id: "rec-name", value: name, onChange: (evt) => setName(evt.target.value), className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e("label", { className: "block text-xs text-slate-400", htmlFor: "rec-url" }, "Page to open"),
      e("input", { id: "rec-url", value: url, onChange: (evt) => setUrl(evt.target.value), placeholder: "Leave blank for sample app", className: "w-full bg-slate-800 rounded-lg px-4 py-3 text-sm border border-slate-700" }),
      e("button", { type: "button", onClick: () => setUrl("/demo.html"), className: "text-xs text-indigo-300 underline" }, "Use sample app"),
      e("button", { type: "button", onClick: start, disabled: busy, className: "w-full bg-red-600 disabled:opacity-60 py-4 rounded-2xl font-bold text-lg" }, busy ? "OPENING BROWSER FAST…" : "● START AI RECORDING ⚡"),
      error && e("p", { role: "alert", className: "text-sm text-red-300" }, error)
    )
  );
}

function Runs({ runId, setRunId }) {
  const [runs, setRuns] = useState([]);
  const [activeLog, setActiveLog] = useState([]);
  const [frame, setFrame] = useState(null);
  const [percent, setPercent] = useState(0);
  const [runStatus, setRunStatus] = useState("");
  const [runError, setRunError] = useState("");
  const [queueInfo, setQueueInfo] = useState(null);
  const frameUrl = useRef(null);

  const load = () => API.get("/api/runs").then(setRuns).catch(() => {});
  const loadQueue = () => API.get("/api/runs/queue/status").then(setQueueInfo).catch(() => {});
  useEffect(() => { load(); loadQueue(); const t = setInterval(() => { load(); loadQueue(); }, 3000); return () => clearInterval(t); }, []);

  useEffect(() => {
    if (!runId) return undefined;
    setActiveLog([]); setPercent(0); setRunStatus("queued"); setRunError(""); setFrame(null);
    let stop = false;
    const ws = new WebSocket((location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/ws/runs/" + runId);
    ws.onmessage = (ev) => {
      const message = JSON.parse(ev.data);
      if (message.type === "frame" && message.data) setFrame("data:image/jpeg;base64," + message.data);
      if (message.percent !== undefined) setPercent(message.percent);
      if (message.type === "done") {
        setRunStatus(message.status || "done");
        if (message.error) setRunError(message.error);
        load();
      } else if (message.status && (message.order !== undefined || message.type === "status")) {
        if (message.type === "status") {
          setRunStatus(message.status);
          setPercent(message.percent || 0);
        } else {
          setActiveLog(prev => prev.filter(item => item.order !== message.order).concat([message]));
        }
      }
    };
    const poll = async () => {
      if (stop) return;
      try {
        const run = await API.get("/api/runs/" + runId);
        if (run.progress_pct != null) setPercent(run.progress_pct);
        if (Array.isArray(run.log) && run.log.length) setActiveLog(run.log);
        if (run.status) setRunStatus(run.status);
        if (run.rog_monitor_log && run.status && run.status !== "running" && run.status !== "queued") setRunError(run.rog_monitor_log);
        const img = await fetch("/api/runs/" + runId + "/live.jpg?t=" + Date.now());
        if (img.ok && (img.headers.get("content-type") || "").indexOf("image") !== -1) {
          const blob = await img.blob();
          const next = URL.createObjectURL(blob);
          if (frameUrl.current && frameUrl.current.indexOf("blob:") === 0) URL.revokeObjectURL(frameUrl.current);
          frameUrl.current = next;
          setFrame(next);
        }
      } catch (_) {}
      if (!stop) setTimeout(poll, 500); // Faster poll for immediate display
    };
    poll();
    return () => { stop = true; ws.close(); };
  }, [runId]);

  return e("div", { className: "space-y-4" },
    queueInfo && e("div", { className: "bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs" },
      e("div", { className: "flex justify-between" },
        e("span", { className: "font-bold text-indigo-300" }, `Queue: ${queueInfo.queued} queued, ${queueInfo.running} running ⚡`),
        e("span", { className: "fast-badge" }, "IMMEDIATE")
      ),
      e("p", { className: "text-[10px] text-slate-400 mt-1" }, `${queueInfo.passed} passed (${queueInfo.passed_pct}%) · ${queueInfo.failed} failed · ${queueInfo.pending} pending` )
    ),
    runId && e("div", { className: "bg-slate-900 border-2 border-indigo-500 rounded-3xl p-5 shadow-2xl" },
      e("div", { className: "flex justify-between font-bold text-xs" },
        e("span", {}, "EXECUTION ⚡ IMMEDIATE"),
        e("span", {}, (runStatus || "running") + " · " + percent + "%")
      ),
      e("div", { className: "w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-2" },
        e("div", { className: "progress-bar", style: { width: percent + "%" } })
      ),
      runError && e("p", { className: "text-xs text-red-300 mt-2" }, runError),
      e("div", { className: "mt-3 rounded-xl overflow-hidden border border-slate-800 bg-black min-h-[200px] flex items-center justify-center" },
        frame
          ? e("img", { src: frame, alt: "Execution browser", className: "w-full" })
          : e("div", { className: "text-slate-400 text-sm p-8 text-center" },
              runStatus === "queued" ? "⏳ Queued - browser launching immediately..." : "Waiting for execution browser… (window displays immediately)"
            )
      ),
      e("div", { className: "max-h-40 overflow-y-auto mt-3 space-y-1" },

function Projects({ setActiveProject, activeProject }) {
  const [projs, setProjs] = useState([]);

  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [varsMap, setVarsMap] = useState({});
  const [loadTime, setLoadTime] = useState("");

  const load = async () => {
    setLoading(true);
    const start = Date.now();
    try {
      const result = await API.get("/api/projects?fast=true");
      setProjs(Array.isArray(result) ? result : []);
      setLoadTime(`${Date.now() - start}ms ⚡ FAST`);
      setError("");
      // Load variables for each project for display (requirement 2)
      const vMap = {};
      for (const p of result) {
        try {
          const vData = await API.get(`/api/projects/${p.id}/variables`);
          vMap[p.id] = vData.variables || [];
        } catch (_) { vMap[p.id] = []; }
      }

      setError(`Unable to load projects: ${err.message}`);

    try {

        base_url: baseUrl.trim()

      setProjs(prev => [project, ...prev.filter(item => item.id !== project.id)]);

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
