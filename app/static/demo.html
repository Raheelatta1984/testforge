<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TestForge Sample App</title>
<style>
  body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  h1 { position: absolute; left: 40px; top: 28px; margin: 0; font-size: 32px; }
  p.hint { position: absolute; left: 40px; top: 76px; margin: 0; color: #94a3b8; font-size: 14px; }
  #name { position: absolute; left: 40px; top: 120px; width: 280px; height: 44px; font-size: 18px; padding: 8px; box-sizing: border-box; }
  #go { position: absolute; left: 40px; top: 180px; width: 160px; height: 44px; font-size: 18px; }
  #out { position: absolute; left: 40px; top: 250px; font-size: 24px; min-height: 32px; }
</style>
</head>
<body>
  <h1>TestForge Sample App</h1>
  <p class="hint">Type a name, then press Continue.</p>
  <input id="name" placeholder="Your name" autocomplete="off"/>
  <button id="go" type="button">Continue</button>
  <div id="out"></div>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      var name = document.getElementById("name").value;
      document.getElementById("out").textContent = "Hello, " + name;
    });
  </script>
</body>
</html>
